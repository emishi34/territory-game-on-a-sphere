<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>進路 オンライン対戦 - Line Runner 3D</title>
<style>
:root{
    --bg: #0b0d12;
    --hint: rgba(255,255,255,0.4);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    touch-action: none;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: block;
  }
  #hint {
    position: fixed;
    top: max(96px, calc(env(safe-area-inset-top) + 96px));
    left: 0; right: 0;
    text-align: center;
    color: var(--hint);
    font-size: 13px;
    line-height: 1.6;
    letter-spacing: 0.02em;
    pointer-events: none;
    transition: opacity 0.6s ease;
    padding: 0 16px;
  }
  #meteorHud {
    position: fixed;
    top: max(20px, env(safe-area-inset-top));
    right: max(18px, env(safe-area-inset-right));
    color: rgba(255,210,170,0.85);
    background: rgba(20,14,10,0.35);
    border: 1px solid rgba(255,180,120,0.18);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 12.5px;
    letter-spacing: 0.02em;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  #resetBtn {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    left: max(16px, env(safe-area-inset-left));
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(20,20,26,0.55);
    border: 1px solid rgba(255,255,255,0.18);
    color: rgba(255,255,255,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 12;
    touch-action: manipulation;
    padding: 0;
  }
  #resetBtn:active { background: rgba(255,255,255,0.18); }
  #resetBtn.confirmArmed {
    background: rgba(255,70,70,0.35);
    border-color: rgba(255,120,120,0.6);
    color: #fff;
    animation: resetPulse 1s ease-in-out infinite;
  }
  @keyframes resetPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,70,70,0.5); }
    50% { box-shadow: 0 0 0 6px rgba(255,70,70,0); }
  }
  #bottomPanels {
    position: fixed;
    bottom: max(20px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    z-index: 10;
  }
  #settingsPanel {
    width: min(92vw, 380px);
    max-height: 46vh;
    background: rgba(18,18,24,0.82);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    color: rgba(255,255,255,0.9);
    font-size: 12.5px;
    letter-spacing: 0.01em;
    touch-action: auto;
    backdrop-filter: blur(8px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  #settingsBtnRow {
    flex: 0 0 auto;
    display: flex;
    gap: 6px;
    margin: 10px 12px 0;
  }
  .settingsActionBtn {
    flex: 1 1 auto;
    padding: 8px 6px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    color: rgba(255,255,255,0.85);
    font-size: 12px;
    line-height: 1.3;
    touch-action: manipulation;
  }
  .settingsActionBtn:active { background: rgba(255,255,255,0.18); }
  #settingsScroll {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 10px 12px;
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
  }
  .settingsSection {
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 4px 0 8px;
  }
  .settingsSection:last-child { border-bottom: none; }
  .settingsSection > summary {
    cursor: pointer;
    padding: 6px 2px;
    font-weight: 600;
    font-size: 13px;
    color: #fff;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .settingsSection > summary::-webkit-details-marker { display: none; }
  .settingsSection > summary::before {
    content: '▸';
    display: inline-block;
    transition: transform 0.15s ease;
    color: rgba(255,255,255,0.5);
    font-size: 10px;
  }
  .settingsSection[open] > summary::before { transform: rotate(90deg); }
  .settingRow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 2px;
  }
  .settingRow label {
    color: rgba(255,255,255,0.7);
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .settingRow .settingInputWrap {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 0 0 auto;
  }
  .settingRow input {
    width: 64px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 6px;
    color: #fff;
    font-size: 12.5px;
    padding: 4px 6px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    touch-action: auto;
  }
  .settingRow .settingUnit {
    color: rgba(255,255,255,0.45);
    font-size: 11px;
    min-width: 2.6em;
  }

  .hidden { display: none !important; }

  #armedCardBadge {
    position: fixed;
    top: max(70px, calc(env(safe-area-inset-top) + 70px));
    left: 50%;
    transform: translateX(-50%);
    background: rgba(191,239,255,0.16);
    border: 1px solid rgba(191,239,255,0.6);
    color: #eafcff;
    font-size: 13px;
    padding: 7px 16px;
    border-radius: 999px;
    z-index: 12;
    pointer-events: none;
    white-space: nowrap;
  }

  #panelTabs {
    display: flex;
    gap: 6px;
  }
  .panelTabBtn {
    background: rgba(20,20,26,0.7);
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 999px;
    touch-action: auto;
  }
  .panelTabBtn.active {
    background: rgba(255,255,255,0.9);
    color: #16161c;
    border-color: transparent;
  }

  #abilityPanel {
    display: flex;
    gap: 10px;
    touch-action: auto;
  }
  #spawnInfoPanel {
    width: min(92vw, 380px);
    max-height: 46vh;
    background: rgba(18,18,24,0.82);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    color: rgba(255,255,255,0.9);
    font-size: 12.5px;
    touch-action: auto;
    backdrop-filter: blur(8px);
    overflow: hidden;
  }
  #spawnInfoScroll {
    max-height: 46vh;
    overflow-y: auto;
    padding: 12px 14px;
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
  }
  .spawnInfoGroup { margin-bottom: 12px; }
  .spawnInfoGroup:last-child { margin-bottom: 0; }
  .spawnInfoTitle {
    font-weight: 600;
    font-size: 13px;
    color: #fff;
    margin-bottom: 4px;
  }
  .spawnInfoRow {
    display: flex;
    justify-content: space-between;
    padding: 2px 0;
    color: rgba(255,255,255,0.8);
  }
  .spawnInfoRow span:last-child { font-variant-numeric: tabular-nums; color: #fff; }
  .cardCooldown {
    font-size: 11px;
    color: #ffd166;
    font-variant-numeric: tabular-nums;
    min-height: 1.1em;
  }
  .abilityCard.onCooldown { opacity: 0.45; }
  .abilityCard.onCooldown .cardName { color: rgba(255,255,255,0.6); }
  .abilityCard {
    width: 74px;
    height: 104px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 6px;
    background: rgba(22,22,28,0.85);
    border: 2px solid rgba(255,255,255,0.2);
    color: #fff;
    touch-action: none;
    user-select: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  .abilityCard.skillCard { border-color: #5ac8ff; }
  .abilityCard.strongCard { border-color: #ffcc4d; box-shadow: 0 4px 18px rgba(255,204,77,0.25); }
  .abilityCard .cardType {
    font-size: 9.5px;
    letter-spacing: 0.05em;
    opacity: 0.75;
  }
  .abilityCard.skillCard .cardType { color: #7fd6ff; }
  .abilityCard.strongCard .cardType { color: #ffdc7f; }
  .abilityCard .cardName {
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    line-height: 1.3;
  }

  #radialMenu {
    position: fixed;
    left: 0; top: 0;
    width: 0; height: 0;
    z-index: 50;
    pointer-events: none;
  }
  #radialMenu.open { pointer-events: auto; }
  .radialCenter {
    position: absolute;
    width: 10px; height: 10px;
    margin-left: -5px; margin-top: -5px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    box-shadow: 0 0 10px 2px rgba(255,255,255,0.25);
  }
  .radialItem {
    position: absolute;
    width: 58px; height: 58px;
    margin-left: -29px; margin-top: -29px;
    border-radius: 50%;
    background: rgba(24,24,30,0.88);
    border: 1px solid rgba(255,255,255,0.28);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-family: 'Segoe UI', sans-serif;
    backdrop-filter: blur(6px);
    transition: transform 0.16s ease, opacity 0.16s ease;
    opacity: 0;
    transform: scale(0.3);
    touch-action: auto;
  }
  .radialItem.show { opacity: 1; transform: scale(1); }
  .radialItem:active { background: rgba(255,255,255,0.3); }

  /* ---------- online match UI ---------- */
  #matchHud {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    z-index: 11; pointer-events: none;
    color: #fff;
  }
  #matchTimer {
    font-size: 20px; font-weight: 700; letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  }
  #matchTimer.urgent { color: #ffd166; }
  #scoreBar {
    width: min(58vw, 260px); height: 8px; border-radius: 4px; overflow: hidden;
    display: flex; background: rgba(255,255,255,0.14);
  }
  #scorePink { background: rgb(255,90,160); width: 0%; transition: width .4s ease; }
  #scoreGap { flex: 1 1 auto; }
  #scoreCyan { background: rgb(90,210,255); width: 0%; transition: width .4s ease; }
  #scoreText {
    font-size: 11.5px; font-variant-numeric: tabular-nums; color: rgba(255,255,255,0.78);
    display: flex; gap: 14px;
  }
  #scoreText .p { color: #ff8fc1; } #scoreText .c { color: #8fe0ff; }
  #topBanner {
    position: fixed;
    top: max(88px, calc(env(safe-area-inset-top) + 88px));
    left: 0; right: 0;
    text-align: center;
    font-size: clamp(34px, 9vw, 64px);
    font-weight: 800;
    letter-spacing: 0.02em;
    color: #fff;
    text-shadow: 0 2px 18px rgba(0,0,0,0.65), 0 0 2px rgba(0,0,0,0.8);
    pointer-events: none;
    z-index: 30;
    opacity: 0;
  }
  #topBanner.show { opacity: 1; }
  #topBanner.fadeOut { animation: bannerFade 3.2s ease-out forwards; }
  #topBanner.pop { animation: bannerPop 0.9s ease-out; opacity: 1; }
  #topBanner.pink { color: #ff7fb8; }
  #topBanner.cyan { color: #7fdcff; }
  #topBanner.warn { color: #ffd166; }
  @keyframes bannerFade { 0% { opacity: 1; transform: scale(1.08); } 20% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
  @keyframes bannerPop { 0% { transform: scale(1.35); opacity: 0.3; } 35% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  #resultSub {
    position: fixed; left: 0; right: 0;
    top: max(170px, calc(env(safe-area-inset-top) + 170px));
    text-align: center; color: rgba(255,255,255,0.85); font-size: 14px;
    z-index: 30; pointer-events: none;
    font-variant-numeric: tabular-nums;
    white-space: pre-line; line-height: 1.7;
  }
  #lobby {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center;
    background: rgba(6,8,12,0.55);
    backdrop-filter: blur(3px);
    padding: 16px;
  }
  #lobbyCard {
    width: min(92vw, 380px);
    background: rgba(18,18,24,0.94);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 18px;
    padding: 20px 18px 16px;
    color: #fff;
  }
  #lobbyCard h1 { margin: 0 0 4px; font-size: 21px; letter-spacing: 0.02em; }
  #lobbyStatus { font-size: 12.5px; color: rgba(255,255,255,0.6); margin-bottom: 14px; line-height: 1.55; }
  .seatRow {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 12px; margin-bottom: 8px;
    background: rgba(255,255,255,0.05);
    border-left: 4px solid transparent;
  }
  .seatRow.p1 { border-left-color: rgb(255,90,160); }
  .seatRow.p2 { border-left-color: rgb(90,210,255); }
  .seatInfo { flex: 1 1 auto; min-width: 0; }
  .seatName { font-size: 14px; font-weight: 700; }
  .seatState { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 2px; }
  .seatState.me { color: #9dffb0; }
  .lobbyBtn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff; font-size: 13px; font-weight: 600;
    padding: 8px 14px; border-radius: 10px;
    touch-action: manipulation;
  }
  .lobbyBtn:disabled { opacity: 0.35; }
  .lobbyBtn:active:not(:disabled) { background: rgba(255,255,255,0.22); }
  #startBtn {
    width: 100%; margin-top: 8px; padding: 12px;
    font-size: 15px; background: rgba(255,255,255,0.92); color: #16161c; border-color: transparent;
  }
  #lobbyNote { font-size: 11.5px; color: rgba(255,255,255,0.45); margin-top: 12px; line-height: 1.6; }
  #rematchBtn {
    position: fixed; left: 50%; transform: translateX(-50%);
    top: max(206px, calc(env(safe-area-inset-top) + 206px));
    z-index: 31; padding: 11px 26px; font-size: 15px;
    background: rgba(255,255,255,0.92); color: #16161c; border-color: transparent;
  }
  #netWarn {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(max(20px, env(safe-area-inset-bottom)) + 170px);
    background: rgba(120,30,30,0.85); color: #fff; font-size: 12.5px;
    padding: 6px 14px; border-radius: 999px; z-index: 40; pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    #topBanner.fadeOut, #topBanner.pop { animation-duration: 0.01s; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hint">キャラクターをなぞって進路を描く<br>それ以外の場所をなぞると球体を回転<br>長押し(1.5秒)でメニュー</div>
<div id="meteorHud">☄ <span id="meteorCount">0</span></div>
<button id="resetBtn" class="hidden" title="盤面をリセット" aria-label="盤面をリセット">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 12a8.5 8.5 0 1 0 2.8-6.3"></path>
    <polyline points="3 3 3.5 8.2 8.7 7.7"></polyline>
  </svg>
</button>
<div id="matchHud">
  <div id="matchTimer">6:00</div>
  <div id="scoreBar"><div id="scorePink"></div><div id="scoreGap"></div><div id="scoreCyan"></div></div>
  <div id="scoreText"><span class="p" id="scorePinkTxt">ピンク 0.0%</span><span class="c" id="scoreCyanTxt">水色 0.0%</span></div>
</div>
<div id="topBanner"></div>
<div id="resultSub"></div>
<button id="rematchBtn" class="lobbyBtn hidden">もう一度対戦する</button>
<div id="netWarn" class="hidden"></div>
<div id="lobby">
  <div id="lobbyCard">
    <h1>進路 オンライン対戦</h1>
    <div id="lobbyStatus">接続しています…</div>
    <div class="seatRow p1">
      <div class="seatInfo"><div class="seatName">プレイヤー1 ピンク陣営</div><div class="seatState" id="seat1State">空き</div></div>
      <button class="lobbyBtn" id="seat1Btn">参加する</button>
    </div>
    <div class="seatRow p2">
      <div class="seatInfo"><div class="seatName">プレイヤー2 水色陣営</div><div class="seatState" id="seat2State">空き</div></div>
      <button class="lobbyBtn" id="seat2Btn">参加する</button>
    </div>
    <button class="lobbyBtn" id="startBtn" disabled>試合開始</button>
    <div id="lobbyNote">1試合6分。終了時に陣地の面積が広い陣営の勝ちです。<br>相手にもこのページを開いてもらい、空いている席に参加してもらってください。試合はプレイヤー1の端末で進行するので、プレイヤー1は試合中この画面を開いたままにしてください。</div>
  </div>
</div>
<div id="armedCardBadge" class="hidden"></div>
<div id="bottomPanels">
  <div id="panelTabs">
    <button id="tabSliders" class="panelTabBtn active">設定</button>
    <button id="tabAbilities" class="panelTabBtn">アビリティ</button>
    <button id="tabSpawnInfo" class="panelTabBtn">湧き率</button>
  </div>
  <div id="settingsPanel">
    <div id="settingsScroll"></div>
  </div>
  <div id="abilityPanel" class="hidden">
    <div class="abilityCard strongCard" id="card_giant_meteor">
      <div class="cardType">強スキル</div>
      <div class="cardName">巨大隕石</div>
      <div class="cardCooldown" id="cooldown_giant_meteor"></div>
    </div>
    <div class="abilityCard strongCard" id="card_light_pillar">
      <div class="cardType">強スキル</div>
      <div class="cardName">光の柱</div>
      <div class="cardCooldown" id="cooldown_light_pillar"></div>
    </div>
    <div class="abilityCard strongCard" id="card_poison_rain">
      <div class="cardType">強スキル</div>
      <div class="cardName">毒の雨</div>
      <div class="cardCooldown" id="cooldown_poison_rain"></div>
    </div>
  </div>
  <div id="spawnInfoPanel" class="hidden">
    <div id="spawnInfoScroll"></div>
  </div>
</div>
<div id="radialMenu"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// =====================================================================
//  GitHub Pages 用の通信部分
// ---------------------------------------------------------------------
//  Claude のアーティファクトでは window.claude.use('room') が「部屋」を
//  用意してくれていましたが、GitHub Pages にはそれがありません。
//  代わりに Trystero（サーバー不要の WebRTC P2P ライブラリ）で同じ形の
//  部屋を作ります。ゲーム本体からは今までと同じ
//    room.presence(一部の値)  / room.onPeers(cb) / room.onConnection(cb)
//  に見えるので、ゲームのコードはほぼそのままです。
//
//  部屋: 同じURLを開いた人は全員同じ部屋に入ります。
//  別の部屋で遊びたいときは URL の後ろに ?room=好きな名前 を付けます。
//    例) https://emishi34.github.io/territory-game-on-a-sphere/?room=abc
// =====================================================================
window.createP2PRoom = async function(){
  const APP_ID = 'emishi34-line-runner-3d-v10';   // バージョンを分けたいときはここを変える
  const roomName = (new URLSearchParams(location.search).get('room') || 'main').slice(0, 64);

  let mod;
  try {
    mod = await import('https://esm.run/trystero@0.21.8');
  } catch (e){
    console.warn('Trystero を読み込めませんでした', e);
    return null;
  }
  const { joinRoom, selfId } = mod;
  let tr;
  try {
    tr = joinRoom({ appId: APP_ID }, roomName);
  } catch (e){
    console.warn('部屋に入れませんでした', e);
    return null;
  }

  // 新旧どちらの makeAction の形にも対応
  const act = tr.makeAction('pr');
  let sendRaw, onRaw;
  if (Array.isArray(act)){ sendRaw = act[0]; onRaw = act[1]; }
  else {
    sendRaw = (data, target) => act.send(data, target ? { target } : undefined);
    onRaw = (cb) => { act.onMessage = (data, info) => cb(data, info && info.peerId); };
  }

  let myPresence = {};
  const others = new Map();   // peerId -> presence
  const peersCbs = [];
  let lastPeers = [];

  function emit(){
    const list = [{ peer: selfId, kind: 'viewer', presence: myPresence, isMe: true, sameTab: true }];
    for (const [id, pr] of others) list.push({ peer: id, kind: 'viewer', presence: pr, isMe: false, sameTab: false });
    lastPeers = list;
    for (const cb of peersCbs){ try { cb({ peers: list }); } catch (e){ console.error(e); } }
  }

  // f=1 は全体の置き換え、それ以外は差分のマージ
  onRaw((msg, peerId) => {
    if (!msg || typeof msg !== 'object' || !peerId) return;
    const cur = others.get(peerId) || {};
    const p = (msg.p && typeof msg.p === 'object') ? msg.p : {};
    // 毎回新しいオブジェクトにする（ゲーム側が「変わったか」を同一性で見ているため）
    others.set(peerId, msg.f ? Object.assign({}, p) : Object.assign({}, cur, p));
    emit();
  });

  tr.onPeerJoin((peerId) => {
    if (!others.has(peerId)) others.set(peerId, {});
    try { sendRaw({ f: 1, p: myPresence }, peerId); } catch (e){}
    emit();
  });
  tr.onPeerLeave((peerId) => {
    others.delete(peerId);
    emit();
  });

  // 念のため、席の情報だけは数秒おきに送り直す（大きな盤面データは送らない）
  setInterval(() => {
    if (!others.size) return;
    const light = {};
    for (const k in myPresence){ if (k !== 's' && k !== 'cq') light[k] = myPresence[k]; }
    try { sendRaw({ p: light }); } catch (e){}
  }, 4000);

  const leave = () => { try { tr.leave(); } catch (e){} };
  window.addEventListener('pagehide', leave);
  window.addEventListener('beforeunload', leave);

  return {
    presence(patch){
      myPresence = Object.assign({}, myPresence, patch || {});
      try { sendRaw({ p: patch || {} }); } catch (e){}
      emit();
      return Promise.resolve();
    },
    onPeers(cb){ peersCbs.push(cb); cb({ peers: lastPeers.length ? lastPeers : [{ peer: selfId, kind: 'viewer', presence: myPresence, isMe: true, sameTab: true }] }); },
    onConnection(cb){ setTimeout(() => { try { cb(true); } catch (e){ console.error(e); } }, 300); },
    connected(){ return true; },
    roomName
  };
};
</script>
<script>
(function(){
  const canvas = document.getElementById('stage');
  const hintEl = document.getElementById('hint');

  // ---------- online match state (the network code lives near the bottom) ----------
  // Player 1's page runs the whole simulation (the "host"); player 2 and
  // anyone watching render what the host reports and send their own
  // commands back. Team 0 = pink (player 1), team 1 = cyan (player 2).
  const NET = { seat: 0, offline: false, room: null, phase: 'lobby', broadcasting: false, hostPresent: false };
  let myTeam = -1; // -1 = just watching
  const MATCH_MS = 6 * 60 * 1000;
  let matchStartAt = 0, matchFrozenElapsed = 0;
  function isSimHost(){ return NET.seat === 1; }
  function simRunning(){ return isSimHost() && NET.phase === 'playing'; }
  // Game clock (ms since kick-off). The host measures it directly; the
  // others follow the host's reports (see netClockElapsed).
  function gameElapsedMs(){
    if (isSimHost()){
      if (NET.phase === 'playing') return performance.now() - matchStartAt;
      if (NET.phase === 'ended') return matchFrozenElapsed;
      return 0;
    }
    return netClockElapsed();
  }

  // ---------- basic three.js setup ----------
  let W = window.innerWidth, H = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0d12);

  const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 100);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(dpr);
  renderer.setSize(W, H);

  // Base fill light is kept fairly soft; the key light is aligned with the
  // fixed Sun direction below so the visible lighting and the custom
  // day/night terminator agree with each other.
  // (Toned down: ambient 0.55 + key 0.9 on the near-white globe pushed the
  // lit side past full white, so it looked like it was glowing.)
  scene.add(new THREE.AmbientLight(0xffffff, 0.4));
  const keyLight = new THREE.DirectionalLight(0xffffff, 0.68);
  keyLight.position.set(4, 5, 6); // updated every frame to follow the Sun (updateCelestialBodies)
  scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0xffffff, 0.08);
  fillLight.position.set(-5, -3, -4);
  scene.add(fillLight);

  // ---------- the sphere (rotatable) ----------
  const R = 2.2;

  const camBasePos = new THREE.Vector3();
  let zoomFactor = 1;
  const MIN_ZOOM_FACTOR = 0.45;
  const MAX_ZOOM_FACTOR = 2.2;
  let camDistance = 1;
  // User dragging now orbits the camera around the (otherwise stationary,
  // but independently time-spinning — see updateCelestialBodies) sphere,
  // instead of spinning the sphere itself. camYaw/camPitch are the
  // player's own view angle; camDistance comes from zoom.
  let camYaw = 0, camPitch = 0;
  const CAM_PITCH_LIMIT = Math.PI / 2 - 0.08; // stay short of the poles to avoid a gimbal flip
  function updateCameraOrbit(){
    const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
    const cy = Math.cos(camYaw), sy = Math.sin(camYaw);
    camBasePos.set(
      camDistance * cp * sy,
      camDistance * sp,
      camDistance * cp * cy
    );
    camera.position.copy(camBasePos);
    camera.up.set(0, 1, 0);
    camera.lookAt(0, 0, 0);
  }
  function fitCameraDistance(){
    const vFov = camera.fov * Math.PI / 180;
    const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
    const limitingFov = Math.min(vFov, hFov);
    const margin = 1.45;
    camDistance = (R * margin / Math.sin(limitingFov / 2)) * zoomFactor;
    updateCameraOrbit();
  }
  fitCameraDistance();

  function onResize(){
    W = window.innerWidth; H = window.innerHeight;
    camera.aspect = W / H;
    fitCameraDistance();
    camera.updateProjectionMatrix();
    renderer.setSize(W, H);
  }
  window.addEventListener('resize', onResize);

  const SPHERE_TEX_W = 1024, SPHERE_TEX_H = 512;
  let sphereCtx = null;
  let sphereTexture = null;

  function makeSphereTexture(){
    const c = document.createElement('canvas');
    c.width = SPHERE_TEX_W; c.height = SPHERE_TEX_H;
    const g = c.getContext('2d');
    g.fillStyle = '#e9eaee'; // soft light gray rather than pure white
    g.fillRect(0, 0, c.width, c.height);
    g.strokeStyle = 'rgba(20,25,35,0.22)';
    g.lineWidth = 2;
    for (let lon = 0; lon <= c.width; lon += c.width / 24){
      g.beginPath(); g.moveTo(lon, 0); g.lineTo(lon, c.height); g.stroke();
    }
    for (let lat = 0; lat <= c.height; lat += c.height / 12){
      g.beginPath(); g.moveTo(0, lat); g.lineTo(c.width, lat); g.stroke();
    }
    sphereCtx = g;
    sphereTexture = new THREE.CanvasTexture(c);
    return sphereTexture;
  }

  // Burn a scorch mark into the sphere's own texture at a given uv, so the
  // mark is fixed to the surface and rotates naturally with the sphere.
  function drawScorchMark(u, v){
    if (!sphereCtx) return;
    const px = u * SPHERE_TEX_W;
    const py = (1 - v) * SPHERE_TEX_H;
    const r = 13 + Math.random() * 7;
    function blot(x, y){
      const rg = sphereCtx.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, 'rgba(58,42,34,0.4)');
      rg.addColorStop(0.55, 'rgba(58,42,34,0.18)');
      rg.addColorStop(1, 'rgba(58,42,34,0)');
      sphereCtx.fillStyle = rg;
      sphereCtx.beginPath(); sphereCtx.arc(x, y, r, 0, Math.PI * 2); sphereCtx.fill();
    }
    blot(px, py);
    if (px < r) blot(px + SPHERE_TEX_W, py);
    if (px > SPHERE_TEX_W - r) blot(px - SPHERE_TEX_W, py);
    sphereTexture.needsUpdate = true;
  }

  // =====================================================================
  //  天体モデル（ゲーム用の簡易公転モデル）
  // ---------------------------------------------------------------------
  //  ゲームの都合上、地球はワールド原点に固定したまま、太陽と月を地球の
  //  周りで動かす「地球中心の座標系」で公転を表現しています。
  //  （太陽から見て地球が反時計回りに公転する ＝ 地球から見て太陽が
  //    黄道上を反時計回りに移動する、と等価です）
  //
  //  1年 = 12分
  //    0分 : 秋分（参考画像の真ん中下）
  //    3分 : 冬至（右）      … 北極側が夜・南極側が昼
  //    6分 : 春分（真ん中上）… 1回目の日食
  //    9分 : 夏至（左）      … 北極側が昼・南極側が夜
  //   12分 : 秋分（真ん中下）… 2回目の日食、以後くり返し
  //
  //  座標の取り方（黄道座標系）
  //    ECL_N : 黄道面（地球の公転面）の北向き法線
  //    ECL_Y : 秋分時点で地球→太陽の向き（参考画像の「上」方向）
  //    ECL_X : 参考画像の「右」方向（ECL_X × ECL_Y = ECL_N）
  // =====================================================================
  const YEAR_SEC = 12 * 60;               // 地球の公転周期（ゲーム内1年）
  const SYNODIC_MONTH_SEC = YEAR_SEC / 2;  // 新月→新月（春分・秋分の新月＝日食）
  // 月の恒星周期：太陽の見かけの移動（1年で1周）＋ 朔望（6分で1周）
  //   1/4分 = 1/12分 + 1/6分  → 4分で天球を1周
  const MOON_SIDEREAL_SEC = 1 / (1 / YEAR_SEC + 1 / SYNODIC_MONTH_SEC);

  // 開始時（秋分）の地球→太陽の向き。以前の固定太陽方向をそのまま使い、
  // ゲーム開始直後の見た目（カメラから見て昼側が見えている状態）を保つ。
  const SUN_DIR_START = new THREE.Vector3(0.6, 0.25, 0.75).normalize();
  const ECL_Y = SUN_DIR_START.clone();
  const ECL_N = new THREE.Vector3(0, 1, 0)
    .sub(ECL_Y.clone().multiplyScalar(ECL_Y.y))
    .normalize();
  const ECL_X = new THREE.Vector3().crossVectors(ECL_Y, ECL_N).normalize();

  // 現在の地球→太陽の単位ベクトル（毎フレーム更新）
  const sunDirNow = SUN_DIR_START.clone();

  // ---------- 地軸の傾き 23.4° ----------
  // 地軸は宇宙空間に対して向きが固定（公転しても同じ方向を向き続ける）。
  // 冬至（地球が画像の右＝+ECL_X側、太陽は -ECL_X 方向）に北極が太陽から
  // 遠ざかるよう、地軸の北極側を +ECL_X に傾ける。
  //   → 夏至（地球が左、太陽は +ECL_X 方向）では北極が太陽側に向く。
  const EARTH_AXIAL_TILT = 23.4 * Math.PI / 180;
  const earthSpinAxis = ECL_N.clone().multiplyScalar(Math.cos(EARTH_AXIAL_TILT))
    .add(ECL_X.clone().multiplyScalar(Math.sin(EARTH_AXIAL_TILT)))
    .normalize();

  const earthTiltGroup = new THREE.Group();
  // グループのローカル +Y 軸が地軸（北極方向）になる。
  earthTiltGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), earthSpinAxis);
  scene.add(earthTiltGroup);

  const sphereGroup = new THREE.Group();
  earthTiltGroup.add(sphereGroup);

  const sphereMesh = new THREE.Mesh(
    new THREE.SphereGeometry(R, 64, 64),
    new THREE.MeshStandardMaterial({ map: makeSphereTexture(), roughness: 0.9, metalness: 0.02 })
  );
  sphereGroup.add(sphereMesh);

  // ---------- 自転 ----------
  // 自転（恒星日）は2分で1回転。公転と同じ向き（北から見て反時計回り）。
  const EARTH_SPIN_PERIOD_SEC = 120;
  const SUN_DISTANCE = 40;
  const MOON_DISTANCE = 4.6;
  const MOON_RADIUS = 0.34;

  // ---------- 月の軌道面 5.1° ----------
  // 月の軌道面は黄道面に対して 5.1° 傾ける。昇交点・降交点を結ぶ線
  // （交点線）を ECL_Y（春分・秋分時の太陽方向）に合わせることで、
  //   春分・秋分の新月 … 太陽・月・地球が一直線 → 日食
  //   夏至・冬至の新月/満月 … 月が黄道面から約5°外れる → 一直線にならない
  // となる（参考画像と同じ関係）。交点線の移動（歳差）はゲームなので省略。
  const MOON_ORBIT_INCLINATION = 5.1 * Math.PI / 180;
  const moonOrbitU = ECL_Y.clone();  // 交点方向
  const moonOrbitV = ECL_X.clone()   // 軌道面内で交点から90°の方向（黄道から5.1°持ち上がる）
    .applyAxisAngle(ECL_Y, MOON_ORBIT_INCLINATION)
    .normalize();

  // 黄道面内の角度 λ（ECL_Y から北側から見て反時計回り）→ 方向ベクトル
  function eclipticDir(lambda, out){
    // 反時計回り：+ECL_Y から -ECL_X 方向へ回る
    return out.copy(ECL_Y).multiplyScalar(Math.cos(lambda))
      .addScaledVector(ECL_X, -Math.sin(lambda));
  }

  const sunMesh = new THREE.Mesh(
    new THREE.SphereGeometry(2.0, 24, 24),
    new THREE.MeshBasicMaterial({ color: 0xfff2cf })
  );
  sunMesh.position.copy(SUN_DIR_START).multiplyScalar(SUN_DISTANCE);
  scene.add(sunMesh);
  // A small self-contained radial-gradient halo behind the sun — kept
  // independent of the meteor system's glow texture since this is set up
  // long before that exists.
  const sunGlowCanvas = document.createElement('canvas');
  sunGlowCanvas.width = 128; sunGlowCanvas.height = 128;
  const sunGlowCtx = sunGlowCanvas.getContext('2d');
  const sunGlowGrad = sunGlowCtx.createRadialGradient(64, 64, 0, 64, 64, 64);
  sunGlowGrad.addColorStop(0, 'rgba(255,244,214,0.3)');
  sunGlowGrad.addColorStop(1, 'rgba(255,244,214,0)');
  sunGlowCtx.fillStyle = sunGlowGrad;
  sunGlowCtx.fillRect(0, 0, 128, 128);
  const sunGlowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(sunGlowCanvas), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  sunGlowSprite.scale.set(5, 5, 1); // smaller, so it doesn't wash over the globe when the sun is in view
  sunMesh.add(sunGlowSprite);

  const moonMesh = new THREE.Mesh(
    new THREE.SphereGeometry(MOON_RADIUS, 24, 24),
    new THREE.MeshStandardMaterial({ color: 0xb7b7bd, roughness: 1, metalness: 0 })
  );
  scene.add(moonMesh);

  // ---------- 昼夜と日食の影 ----------
  // ワールド空間に固定した（自転しない）少し大きい球で、太陽と反対側を暗くする。
  // sunDir を毎フレーム更新するので、公転に合わせて明暗境界線が動き、
  // 地軸の傾きによって極地方の昼夜の割合も季節ごとに変わる。
  // さらに月の影（本影＋半影）を地表に落とし、日食を表現する。
  const MOON_UMBRA_R = 0.28;     // 本影の半径（ゲーム用に見やすく誇張）
  const MOON_PENUMBRA_R = 0.95;  // 半影の半径
  const nightShadeMat = new THREE.ShaderMaterial({
    uniforms: {
      sunDir: { value: SUN_DIR_START.clone() },
      moonPos: { value: new THREE.Vector3() },
      umbraR: { value: MOON_UMBRA_R },
      penumbraR: { value: MOON_PENUMBRA_R },
      nightOpacity: { value: 0.4 },   // tuned for "noticeably dimmer, not too dark"
      eclipseOpacity: { value: 0.78 }
    },
    vertexShader: `
      varying vec3 vNormalWorld;
      varying vec3 vPosWorld;
      void main(){
        vNormalWorld = normalize(mat3(modelMatrix) * normal);
        vPosWorld = (modelMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 sunDir;
      uniform vec3 moonPos;
      uniform float umbraR;
      uniform float penumbraR;
      uniform float nightOpacity;
      uniform float eclipseOpacity;
      varying vec3 vNormalWorld;
      varying vec3 vPosWorld;
      void main(){
        vec3 s = normalize(sunDir);
        float ndotl = dot(normalize(vNormalWorld), s);
        float dayFactor = smoothstep(-0.12, 0.12, ndotl); // 0 = night, 1 = day, soft terminator
        float night = nightOpacity * (1.0 - dayFactor);

        // 月の影：太陽光に平行な円柱として近似
        vec3 d = vPosWorld - moonPos;
        float along = dot(d, s);                 // <0 なら月より太陽の反対側
        float perp = length(d - s * along);
        float shadow = 1.0 - smoothstep(umbraR, penumbraR, perp);
        shadow *= step(along, 0.0) * dayFactor;  // 昼側にだけ落とす
        float eclipse = eclipseOpacity * shadow * shadow;

        gl_FragColor = vec4(0.01, 0.02, 0.06, max(night, eclipse));
      }
    `,
    transparent: true,
    depthWrite: false,
    side: THREE.FrontSide
  });
  const nightShadeMesh = new THREE.Mesh(new THREE.SphereGeometry(R * 1.012, 64, 64), nightShadeMat);
  nightShadeMesh.renderOrder = 3;
  scene.add(nightShadeMesh);

  // 日食中は太陽のハロ・主光源を少し弱める演出用
  const baseKeyIntensity = keyLight.intensity;

  const celestialStartTime = performance.now();
  const _tmpV = new THREE.Vector3();
  function updateCelestialBodies(now){
    const elapsed = gameElapsedMs() / 1000;

    // 自転
    sphereGroup.rotation.y = (2 * Math.PI / EARTH_SPIN_PERIOD_SEC) * elapsed;

    // 公転：地球から見た太陽の黄経（秋分=0 から反時計回り）
    const sunLambda = (2 * Math.PI / YEAR_SEC) * elapsed;
    eclipticDir(sunLambda, sunDirNow);
    sunMesh.position.copy(sunDirNow).multiplyScalar(SUN_DISTANCE);
    keyLight.position.copy(sunDirNow).multiplyScalar(10);
    fillLight.position.copy(sunDirNow).multiplyScalar(-10);
    nightShadeMat.uniforms.sunDir.value.copy(sunDirNow);

    // 月：5.1°傾いた軌道面上を反時計回り。t=0（秋分）で交点上の新月、
    // 6分ごとに再び交点上の新月になる（=春分・秋分の日食）。
    const moonAngle = (2 * Math.PI / MOON_SIDEREAL_SEC) * elapsed;
    const moonDir = _tmpV.copy(moonOrbitU).multiplyScalar(Math.cos(moonAngle))
      .addScaledVector(moonOrbitV, -Math.sin(moonAngle));
    moonMesh.position.copy(moonDir).multiplyScalar(MOON_DISTANCE);
    nightShadeMat.uniforms.moonPos.value.copy(moonMesh.position);

    // 日食の度合い（太陽方向の直線と月の距離）で主光源を少し落とす
    const moonAlong = moonMesh.position.dot(sunDirNow);
    const moonOffAxis = Math.sqrt(Math.max(0, MOON_DISTANCE * MOON_DISTANCE - moonAlong * moonAlong));
    const eclipseAmt = moonAlong > 0 ? 1 - THREE.MathUtils.smoothstep(moonOffAxis, MOON_UMBRA_R, R + MOON_PENUMBRA_R) : 0;
    keyLight.intensity = baseKeyIntensity * (1 - 0.35 * eclipseAmt);
    sunGlowSprite.material.opacity = 1 - 0.5 * eclipseAmt;
  }

  // ---------- territory overlay (pink = player, cyan = enemy) ----------
  // A small logical grid is the source of truth for who owns each patch of
  // the sphere; a matching canvas texture is painted to visualize it.
  const GRID_W = 180, GRID_H = 90;
  const EMPTY = 0, PINK = 1, CYAN = 2, DARK_PINK = 3, METEOR_CRATER = 4, CRYSTAL_ZONE = 5, DARK_CYAN = 6, MOON_CRATER = 7;
  const POISON_POOL = 10, TOXIC_POOL = 11; // (8 / 9 are taken on the wire by farm cells)
  // Level 3 ground (made by B enclosing dark ground): red for pink, deep blue for cyan.
  const RED_PINK = 12, DEEP_BLUE = 13;
  const RED_OF = [RED_PINK, DEEP_BLUE];
  // Per-team colours: index 0 = pink team (player 1), 1 = cyan team (player 2).
  const LIGHT_OF = [PINK, CYAN];
  const DARK_OF = [DARK_PINK, DARK_CYAN];
  function teamOfCell(c){
    if (c === PINK || c === DARK_PINK || c === RED_PINK) return 0;
    if (c === CYAN || c === DARK_CYAN || c === DEEP_BLUE) return 1;
    return -1;
  }
  const isTeamTerritory = [c => c === PINK || c === DARK_PINK || c === RED_PINK, c => c === CYAN || c === DARK_CYAN || c === DEEP_BLUE];
  const TEAM_NAMES = ['ピンク陣営', '水色陣営'];
  // Row-level change tracking, so the host only resends territory rows that changed.
  const terrRowDirty = new Uint8Array(90);
  function markRowDirty(idx){ terrRowDirty[(idx / 180) | 0] = 3; }
  const territoryGrid = new Uint8Array(GRID_W * GRID_H);

  const TERR_CANVAS_W = 1024, TERR_CANVAS_H = 512;
  const terrCanvas = document.createElement('canvas');
  terrCanvas.width = TERR_CANVAS_W; terrCanvas.height = TERR_CANVAS_H;
  const terrCtx = terrCanvas.getContext('2d');
  // Fill with white-but-transparent (not black-but-transparent): if the GPU
  // ever blends an "empty" texel with a painted neighbor, it blends toward
  // white (matching the sphere) instead of leaving a dark/colored halo.
  terrCtx.fillStyle = 'rgba(255,255,255,0)';
  terrCtx.fillRect(0, 0, TERR_CANVAS_W, TERR_CANVAS_H);
  const terrTexture = new THREE.CanvasTexture(terrCanvas);
  // Mipmapping a mostly-transparent texture with small painted patches can
  // produce dark ring artifacts around them at a distance; this texture is
  // always viewed at roughly texel resolution, so mipmaps aren't needed.
  terrTexture.generateMipmaps = false;
  terrTexture.minFilter = THREE.LinearFilter;
  terrTexture.magFilter = THREE.LinearFilter;

  const overlayMesh = new THREE.Mesh(
    new THREE.SphereGeometry(R * 1.004, 64, 64),
    new THREE.MeshBasicMaterial({ map: terrTexture, transparent: true, depthWrite: false })
  );
  overlayMesh.renderOrder = 1;
  sphereGroup.add(overlayMesh);

  // A second overlay, additively blended, for the orange "still fresh /
  // being actively drawn" glow around this run's new pink territory.
  const glowCanvas = document.createElement('canvas');
  glowCanvas.width = TERR_CANVAS_W; glowCanvas.height = TERR_CANVAS_H;
  const glowCtx = glowCanvas.getContext('2d');
  const glowTexture = new THREE.CanvasTexture(glowCanvas);
  glowTexture.generateMipmaps = false;
  glowTexture.minFilter = THREE.LinearFilter;
  glowTexture.magFilter = THREE.LinearFilter;
  let glowDirty = false;

  const glowMesh = new THREE.Mesh(
    new THREE.SphereGeometry(R * 1.008, 64, 64),
    new THREE.MeshBasicMaterial({ map: glowTexture, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })
  );
  glowMesh.renderOrder = 2;
  sphereGroup.add(glowMesh);

  function paintDirAsColor(dir, colorId, angularRadius, onTouch){

      } else {
        mob.mesh.material.color.copy(mob.baseColor).lerp(MOB_DAMAGED_COLOR, 1 - mob.hp / mob.maxHp);
        if (mob.hpBar) updateHPBarSprite(mob.hpBar, mob.hp / mob.maxHp);
      }
    }
    for (const other of charTargets()){
      if (other.team !== ch.team && other.alive && enclosed.has(dirToGridIdx(other.dir))) damageCharacter(other, trailDmg);
    }
    return true; // a loop really did close here — the caller consumes it
  }

  // ---------- lat/lon grid (drawn on the ground only; movement is free) ----------
  // Matches the 15°-spaced grid drawn on the sphere's own ground texture,
  // so the paths characters can walk are exactly the visible lines.
  const GRID_STEP_DEG = 15;
  const ALLOWED_LATS = []; // -75..75
  for (let l = -75; l <= 75; l += GRID_STEP_DEG) ALLOWED_LATS.push(l);
  const ALLOWED_LONS = []; // 0..345, wraps
  for (let l = 0; l < 360; l += GRID_STEP_DEG) ALLOWED_LONS.push(l);

  function latLonDegToDir(latDeg, lonDeg){
    const phi = (90 - latDeg) * Math.PI / 180;
    const theta = lonDeg * Math.PI / 180;
    const sinPhi = Math.sin(phi);
    return new THREE.Vector3(-Math.cos(theta) * sinPhi, Math.cos(phi), Math.sin(theta) * sinPhi);
  }
  function dirToLatLonDeg(dir){
    const phi = Math.acos(THREE.MathUtils.clamp(dir.y, -1, 1));
    let theta = Math.atan2(dir.z, -dir.x);
    if (theta < 0) theta += Math.PI * 2;
    return { lat: 90 - phi * 180 / Math.PI, lon: theta * 180 / Math.PI };
  }
  function latIndex(latDeg){ return ALLOWED_LATS.indexOf(latDeg); }
  function lonIndex(lonDeg){ return ALLOWED_LONS.indexOf(((Math.round(lonDeg / GRID_STEP_DEG) * GRID_STEP_DEG) % 360 + 360) % 360); }
  function nearestLat(latDeg){
    let best = ALLOWED_LATS[0], bestD = Infinity;
    for (const L of ALLOWED_LATS){ const d = Math.abs(L - latDeg); if (d < bestD){ bestD = d; best = L; } }
    return best;
  }
  function nearestLon(lonDeg){
    const norm = ((lonDeg % 360) + 360) % 360;
    let best = ALLOWED_LONS[0], bestD = Infinity;
    for (const Lo of ALLOWED_LONS){
      let d = Math.abs(Lo - norm); d = Math.min(d, 360 - d);
      if (d < bestD){ bestD = d; best = Lo; }
    }
    return best;
  }
  function stepLat(latDeg, dir){
    const i = Math.max(0, Math.min(ALLOWED_LATS.length - 1, latIndex(latDeg) + dir));
    return ALLOWED_LATS[i];
  }
  function stepLon(lonDeg, dir){
    const n = ALLOWED_LONS.length;
    const i = ((lonIndex(lonDeg) + dir) % n + n) % n;
    return ALLOWED_LONS[i];
  }
  function lonCircularDiffSteps(fromLon, toLon){
    const n = ALLOWED_LONS.length;
    let diff = lonIndex(toLon) - lonIndex(fromLon);
    diff = ((diff + n / 2 + n) % n) - n / 2;
    return diff;
  }
  function randomGridVertex(){
    const lat = ALLOWED_LATS[Math.floor(Math.random() * ALLOWED_LATS.length)];
    const lon = ALLOWED_LONS[Math.floor(Math.random() * ALLOWED_LONS.length)];
    return { lat, lon };
  }
  // Interpolates along whichever single grid line connects two adjacent
  // vertices — the parallel (fixed latitude) if longitude changes, or the
  // meridian (fixed longitude) if latitude changes.
  function interpolateGridSegment(a, b, t){
    if (a.lat === b.lat){
      let lonDiff = b.lon - a.lon;
      if (lonDiff > 180) lonDiff -= 360;
      if (lonDiff < -180) lonDiff += 360;
      return latLonDegToDir(a.lat, a.lon + lonDiff * t);
    }
    return latLonDegToDir(a.lat + (b.lat - a.lat) * t, a.lon);
  }
  // Turns a sequence of grid vertices into a dense list of Vector3 points
  // that hug the true parallel/meridian curves (rather than cutting the
  // great-circle "shortcut" between them), for smooth-looking movement.
  const GRID_SEG_SUBDIVISIONS = 6;
  function buildDensePointsFromGridPath(gridPath){
    if (gridPath.length === 0) return [];
    const pts = [latLonDegToDir(gridPath[0].lat, gridPath[0].lon)];
    for (let i = 1; i < gridPath.length; i++){
      const a = gridPath[i-1], b = gridPath[i];
      for (let s = 1; s <= GRID_SEG_SUBDIVISIONS; s++){
        pts.push(interpolateGridSegment(a, b, s / GRID_SEG_SUBDIVISIONS));
      }
    }
    return pts;
  }

  // ---------- HP bar sprites (small billboard above an entity) ----------
  function makeHPBarSprite(){
    const c = document.createElement('canvas');
    c.width = 64; c.height = 10;
    const ctx = c.getContext('2d');
    const tex = new THREE.CanvasTexture(c);
    tex.generateMipmaps = false;
    tex.minFilter = THREE.LinearFilter;
    const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, depthWrite: false, transparent: true });
    const spr = new THREE.Sprite(mat);
    spr.scale.set(0.42, 0.075, 1);
    spr.renderOrder = 999;
    spr._canvas = c; spr._ctx = ctx; spr._tex = tex;
    return spr;
  }
  function updateHPBarSprite(spr, frac){
    const c = spr._canvas, ctx = spr._ctx;
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, c.width, c.height);
    const w = Math.max(0, Math.min(1, frac)) * (c.width - 2);
    ctx.fillStyle = frac > 0.5 ? '#6bff8a' : (frac > 0.25 ? '#ffd166' : '#ff5a5a');
    ctx.fillRect(1, 1, w, c.height - 2);
    spr._tex.needsUpdate = true;
  }

  // ---------- floating damage/heal numbers: a quick fade-in, held briefly,
  // then gone after ~1s. Spawned at a random spot above whatever took the
  // hit or was healed, using a plain direction + visual radius so it works
  // uniformly for mobs, characters, and the blue dot alike. Always called
  // BEFORE any code that might remove/dispose the target, so a killing
  // blow still shows its damage number.
  //
  // Uses a small pre-warmed pool of sprites/textures instead of creating a
  // new canvas + GPU texture on every single hit — with several mobs
  // attacking a second and AOE hits landing on multiple targets at once,
  // that was allocating (and immediately throwing away) a fresh WebGL
  // texture many times a second, which is exactly the kind of churn that
  // makes a page feel like it's bogging down over time. ----------
  const MAX_FLOATING_NUMBERS = 28;
  const floatingNumberPool = []; // { sprite, canvas, ctx, tex } — created once, reused forever
  const freeFloatingSlots = [];  // stack of pool indices not currently in use
  const floatingNumbers = [];    // active: { poolIdx, t, duration }, oldest first
  (function prewarmFloatingNumberPool(){
    for (let i = 0; i < MAX_FLOATING_NUMBERS; i++){
      const c = document.createElement('canvas');
      c.width = 110; c.height = 56;
      const ctx = c.getContext('2d');
      const tex = new THREE.CanvasTexture(c);
      tex.generateMipmaps = false;
      tex.minFilter = THREE.LinearFilter;
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0, depthTest: false, depthWrite: false });
      const sprite = new THREE.Sprite(mat);
      sprite.renderOrder = 1000;
      sprite.visible = false;
      sphereGroup.add(sprite);
      floatingNumberPool.push({ sprite, canvas: c, ctx, tex });
      freeFloatingSlots.push(i);
    }
  })();
  function spawnFloatingNumber(dir, visualRadius, amount, colorHex, fromNet){
    const rounded = Math.round(amount);
    if (rounded <= 0) return;
    if (!fromNet) netPushEvent('f' + encDir(dir) + enc1(Math.min(63, Math.round(visualRadius * 100))) + enc2(Math.min(4095, rounded)) + (colorHex === '#3dff6e' ? '1' : colorHex === '#c061ff' ? '2' : '0'));
    let poolIdx;
    if (freeFloatingSlots.length > 0){
      poolIdx = freeFloatingSlots.pop();
    } else {
      // Pool's fully in use — recycle whichever number has been showing
      // longest rather than skip this one.
      const oldest = floatingNumbers.shift();
      if (!oldest) return;
      poolIdx = oldest.poolIdx;
    }
    const entry = floatingNumberPool[poolIdx];
    const isLarge = rounded >= 100;
    const c = entry.canvas, ctx = entry.ctx;
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.font = `bold ${isLarge ? 36 : 25}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = colorHex;
    ctx.fillText(String(rounded), c.width / 2, c.height / 2 + 1);
    entry.tex.needsUpdate = true;
    const scale = isLarge ? 0.34 : 0.24;
    entry.sprite.scale.set(scale, scale * (c.height / c.width), 1);
    let axis = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0));
    if (axis.lengthSq() < 1e-4) axis.set(1, 0, 0);
    axis.normalize();
    const upJitter = visualRadius + 0.1 + Math.random() * 0.14;
    const sideJitter = (Math.random() - 0.5) * 0.2;
    entry.sprite.position.copy(dir).multiplyScalar(R * 1.02 + upJitter).add(axis.multiplyScalar(sideJitter));
    entry.sprite.material.opacity = 0;
    entry.sprite.visible = true;
    floatingNumbers.push({ poolIdx, t: 0, duration: 1.0 });
  }
  function updateFloatingNumbers(dt){
    for (let i = floatingNumbers.length - 1; i >= 0; i--){
      const fn = floatingNumbers[i];
      fn.t += dt;
      const p = fn.t / fn.duration;
      const entry = floatingNumberPool[fn.poolIdx];
      let opacity;
      if (p < 0.12) opacity = p / 0.12; // fast fade-in
      else if (p > 0.75) opacity = Math.max(0, (1 - p) / 0.25);
      else opacity = 1;
      entry.sprite.material.opacity = opacity;
      if (p >= 1){
        entry.sprite.visible = false;
        floatingNumbers.splice(i, 1);
        freeFloatingSlots.push(fn.poolIdx);
      }
    }
  }

  // Small text-label sprite, used to mark each red dot A / B / C.
  function makeLabelSprite(text, team){
    const c = document.createElement('canvas');
    c.width = 40; c.height = 40;
    const ctx = c.getContext('2d');
    ctx.fillStyle = team === 1 ? 'rgba(8,16,30,0.6)' : 'rgba(20,10,12,0.55)';
    ctx.beginPath(); ctx.arc(20, 20, 17, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 20, 22);
    const tex = new THREE.CanvasTexture(c);
    tex.generateMipmaps = false;
    tex.minFilter = THREE.LinearFilter;
    const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, depthWrite: false, transparent: true });
    const spr = new THREE.Sprite(mat);
    spr.scale.set(0.16, 0.16, 1);
    spr.renderOrder = 999;
    return spr;
  }

  // ---------- characters (red, x3: role A draws territory, B just moves,
  // C leaves a trail that can destroy enclosed blue mobs) ----------
  const CHAR_LOCAL_R = 0.11;
  let CHAR_MAX_HP = 500;
  function pickDistinctGridVertices(n){
    const picked = [];
    let guard = 0;
    while (picked.length < n && guard++ < 200){
      const v = randomGridVertex();
      const same = (p, q) => p.lat === q.lat && p.lon === q.lon;
      // Keep the cyan side (the antipodes) clear of the pink side too.
      if (!picked.some(p => same(p, v) || same(antipodeVertex(p), v))) picked.push(v);
    }
    return picked;
  }
  // Pink (red dots) starts around the north pole, on the northernmost grid
  // line (75°N — the lines stop short of the pole itself), spread evenly
  // 120° apart. Cyan (blue dots) starts on the exact opposite points, around
  // the south pole, so both sides get the same footing.
  const START_LAT = ALLOWED_LATS[ALLOWED_LATS.length - 1];
  const CHARACTER_START_VERTICES = [0, 120, 240].map(lon => ({ lat: START_LAT, lon }));
  function antipodeVertex(v){ return { lat: -v.lat, lon: (v.lon + 180) % 360 }; }
  const CHAR_COLORS = [0xff3b3b, 0x3b8bff];
  function makeCharacter(startVertex, role, team){
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(CHAR_LOCAL_R, 20, 20),
      new THREE.MeshBasicMaterial({ color: CHAR_COLORS[team] })
    );
    const hpBar = makeHPBarSprite();
    const label = makeLabelSprite(role, team);
    const ch = {
      team, // 0 = pink (red dots, player 1), 1 = cyan (blue dots, player 2)
      role, // 'A' draws territory, 'B' just moves, 'C' leaves a mob-killing trail
      hp: CHAR_MAX_HP, maxHp: CHAR_MAX_HP, alive: true,
      dir: latLonDegToDir(startVertex.lat, startVertex.lon),
      mesh, hpBar, label,
      activePathLocal: null,
      cumAngular: null,
      totalAngular: 0,
      traveledAngular: 0,
      moving: false,
      pathTubeMesh: null,
      runTrail: null,    // ordered list of grid indices painted this run (for splitting on a cut)
      runTrailSet: null, // same cells, as a Set, for fast membership checks
      runTrailFirstSeenArc: null, // idx -> traveledAngular when first painted this run (for telling a real loop-closing crossing from ordinary brush overlap with recently-painted ground)
      gridSnapshotAtRunStart: null, // (role A only) territoryGrid as it was before this run began, so a loop enclosing ground only painted moments ago this same run doesn't get misread as "pre-existing" pink
      stunUntil: 0, // locked in place until this time (gray mob's charge blast)
      carryingFragment: null, // (role C only) null | 'meteor' | 'crystal'
      fragmentMesh: null // the small cube shown above the head while carrying one
    };
    mesh.position.copy(ch.dir).multiplyScalar(R * 1.02);
    sphereGroup.add(mesh);
    hpBar.position.copy(ch.dir).multiplyScalar(R * 1.02 + CHAR_LOCAL_R + 0.1);
    sphereGroup.add(hpBar);
    updateHPBarSprite(hpBar, 1);
    label.position.copy(ch.dir).multiplyScalar(R * 1.02 + CHAR_LOCAL_R + 0.24);
    sphereGroup.add(label);
    return ch;
  }
  const characters = [
    ...CHARACTER_START_VERTICES.map((v, i) => makeCharacter(v, ['A', 'B', 'C'][i], 0)),
    ...CHARACTER_START_VERTICES.map((v, i) => makeCharacter(antipodeVertex(v), ['A', 'B', 'C'][i], 1))
  ];
  // (Characters no longer start on a patch of their own ground.)
  function charOf(team, role){ return characters.find(c => c.team === team && c.role === role) || null; }
  const TEAM_DOT_NAMES = ['赤い点', '青い点'];

  function damageCharacter(ch, dmg){
    if (ch.isBSeg){ damageBSeg(ch, dmg); return; }
    if (!ch.alive) return;
    spawnFloatingNumber(ch.dir, CHAR_LOCAL_R, dmg, '#ff3030'); // before hp drops to 0, so a killing blow still shows its number
    ch.hp = Math.max(0, ch.hp - dmg);
    updateHPBarSprite(ch.hpBar, ch.hp / ch.maxHp);
    if (ch.hp <= 0) killCharacter(ch);
  }
  function killCharacter(ch){
    if (!ch.alive) return;
    ch.alive = false;
    if (ch.moving) stopCharacterRun(ch, false);

    sphereGroup.remove(ch.hpBar);
    sphereGroup.remove(ch.label);
    if (ch.carryingFragment){
      detachFragmentMesh(ch);
      ch.carryingFragment = null;
    }
    if (ch.poisonLiquid || ch.liquidMesh){ ch.poisonLiquid = false; detachLiquidMesh(ch); }
    if (drawingChar === ch) drawingChar = null;

    ch.respawnAt = performance.now() + DOT_RESPAWN_DELAY;
    ch.trailEpoch = (ch.trailEpoch || 0) + 1;
  }
  function respawnCharacter(ch){
    // Back on a random patch of its own team's ground if it has any,
    // otherwise anywhere on the grid.
    const idx = randomCellOfColor(isTeamTerritory[ch.team]);
    const spawnDir = findNearestUnblockedDir(idx !== null ? cellIdxToDir(idx) : randomSphereDir(), CHAR_LOCAL_R);
    ch.maxHp = CHAR_MAX_HP; ch.hp = ch.maxHp;
    ch.alive = true; ch.stunUntil = 0; ch.respawnAt = 0;
    ch.moving = false; ch.activePathLocal = null; ch.cumAngular = null;
    ch._prevDir = null;
    placeCharacterAt(ch, spawnDir);
    sphereGroup.add(ch.mesh); sphereGroup.add(ch.hpBar); sphereGroup.add(ch.label);

  }
  function updateRespawns(now){
    for (const ch of characters){
      if (!ch.alive && ch.respawnAt && now >= ch.respawnAt) respawnCharacter(ch);
    }
  }


  // ---------- blue dot (wanders freely over the surface) ----------
  const DOT_LOCAL_R = 0.09;
  let BLUE_DOT_MAX_HP = 500;
  const blueDot = {
    dir: new THREE.Vector3(),
    segFrom: null, // {lat, lon} vertex it left
    segTo: null,   // {lat, lon} vertex it's walking toward
    segT: 0,       // 0..1 progress along the current segment
    active: false, // the AI blue dot is retired: player 2's blue dots take its place
    respawnAt: 0,
    hp: BLUE_DOT_MAX_HP, maxHp: BLUE_DOT_MAX_HP,
    mesh: new THREE.Mesh(
      new THREE.SphereGeometry(DOT_LOCAL_R, 18, 18),
      new THREE.MeshBasicMaterial({ color: 0x3b8bff })
    ),
    hpBar: makeHPBarSprite()
  };
  sphereGroup.add(blueDot.mesh);
  sphereGroup.add(blueDot.hpBar);
  updateHPBarSprite(blueDot.hpBar, 1);

  function damageBlueDot(dmg){
    if (!blueDot.active) return;
    spawnFloatingNumber(blueDot.dir, DOT_LOCAL_R, dmg, '#ff3030');
    blueDot.hp = Math.max(0, blueDot.hp - dmg);
    updateHPBarSprite(blueDot.hpBar, blueDot.hp / blueDot.maxHp);
    if (blueDot.hp <= 0){
      blueDot.active = false;
      blueDot.mesh.visible = false;
      blueDot.hpBar.visible = false;
      blueDot.respawnAt = performance.now() + DOT_RESPAWN_DELAY;

  // A unit vector `ang` radians away from `from`, in the direction `heading`
  // (radians, measured around `from`).
  const DOT_COLLISION_RADIUS = DOT_LOCAL_R;
  const _bdNorth = new THREE.Vector3(), _bdEast = new THREE.Vector3(), _bdTan = new THREE.Vector3();
  function dirAtBearing(from, heading, ang){
    _bdNorth.set(0, 1, 0);
    if (Math.abs(from.dot(_bdNorth)) > 0.99) _bdNorth.set(1, 0, 0);
    _bdEast.crossVectors(from, _bdNorth).normalize();
    _bdNorth.crossVectors(_bdEast, from).normalize();
    _bdTan.copy(_bdNorth).multiplyScalar(Math.cos(heading)).addScaledVector(_bdEast, Math.sin(heading));
    return from.clone().multiplyScalar(Math.cos(ang)).addScaledVector(_bdTan, Math.sin(ang)).normalize();
  }
  function randomSphereDir(){
    const u = Math.random() * 2 - 1;
    const th = Math.random() * Math.PI * 2;
    const r = Math.sqrt(Math.max(0, 1 - u * u));
    return new THREE.Vector3(r * Math.cos(th), u, r * Math.sin(th));
  }
  // Nearest spot to `dir` that isn't inside an obstacle, searched outward in
  // rings. Free-form, so it never snaps onto a grid line.
  function findNearestUnblockedDir(dir, entityRadius){
    if (!isDirCollidingWithObstacle(dir, entityRadius)) return dir.clone();
    for (let ring = 1; ring <= 15; ring++){
      const ang = ring * (3 * Math.PI / 180);
      for (let k = 0; k < 12; k++){
        const cand = dirAtBearing(dir, (k / 12) * Math.PI * 2, ang);
        if (!isDirCollidingWithObstacle(cand, entityRadius)) return cand;
      }

  }

  // Picks the next leg of the blue dot's wander: one BLUE_DOT_STEP hop in a

  const BLUE_DOT_STEP = GRID_STEP_DEG * Math.PI / 180; // one leg of the wander
  function pickNextBlueDotTarget(){
    const from = blueDot.segFromDir || (blueDot.segFromDir = blueDot.dir.clone());
    let target = null;
    for (let attempt = 0; attempt < 8; attempt++){
      target = dirAtBearing(from, Math.random() * Math.PI * 2, BLUE_DOT_STEP);
      if (!isDirCollidingWithObstacle(target, DOT_COLLISION_RADIUS)) break;
    }
    blueDot.segToDir = target;
    blueDot.segT = 0;
  }

    blueDot.segFromDir = findNearestUnblockedDir(randomSphereDir(), DOT_COLLISION_RADIUS);
    blueDot.dir = blueDot.segFromDir.clone();

    blueDot.active = true;
    blueDot.mesh.visible = true;
    blueDot.hpBar.visible = true;
    blueDot.hp = blueDot.maxHp;
    updateHPBarSprite(blueDot.hpBar, 1);
    blueDot.mesh.position.copy(blueDot.dir).multiplyScalar(R * 1.02);
    blueDot.hpBar.position.copy(blueDot.dir).multiplyScalar(R * 1.02 + DOT_LOCAL_R + 0.1);
  }

  blueDot.hpBar.visible = false;

  const BASE_BLUE_DOT_DEG_PER_FRAME = 0.2; // wandering speed, in degrees of arc per frame
  let BLUE_DOT_SEG_SPEED = BASE_BLUE_DOT_DEG_PER_FRAME / GRID_STEP_DEG; // as a fraction of one leg
  let DOT_RESPAWN_DELAY = 30000;

  // ---------- mobs: pink (ally, spawns from pink territory) and blue

  const MOB_LOCAL_R = 0.075;
  let MOB_HP_MAX = 150;
  let MOB_AURA_RANGE = 5 * Math.PI / 180; // shared "range around itself" for attack/erosion/aggro — adjustable
  let MOB_ATTACK_DAMAGE_MIN = 38, MOB_ATTACK_DAMAGE_MAX = 45;

  let MOB_ATTACK_COOLDOWN_MS = 1800;
  let MOB_ERODE_DURATION = 4.0; // seconds (compared against dt-accumulated progress, which is in seconds)
  const MOB_RETARGET_INTERVAL_MS = 500;
  let MOB_SPAWN_MIN_MS = 1000, MOB_SPAWN_MAX_MS = 2000;
  const BASE_MOB_DEG_PER_FRAME = 0.08;
  let MOB_ANGULAR_SPEED = BASE_MOB_DEG_PER_FRAME * Math.PI / 180;
  const MOB_UP = new THREE.Vector3(0, 1, 0);
  const PINK_MOB_COLOR = new THREE.Color(0xff5a9e);
  const GOLD_MOB_COLOR = new THREE.Color(0xffd23c);
  const SILVER_MOB_COLOR = new THREE.Color(0xc9ced6); // the cyan side's "gold" mob is silver
  const GOLD_MOB_COLORS = [GOLD_MOB_COLOR, SILVER_MOB_COLOR];
  const GOLD_RING_COLORS = [0xffd23c, 0xdde2ea];
  const BLUE_MOB_COLOR = new THREE.Color(0x5ad0ff);
  const BOSS_BLUE_MOB_COLOR = new THREE.Color(0x0a2a6e); // deep navy, distinct from the regular light blue
  const BOSS_PINK_MOB_COLOR = new THREE.Color(0x6e0a3c); // deep magenta — the pink side's counterpart
  const BOSS_MOB_COLORS = [BOSS_PINK_MOB_COLOR, BOSS_BLUE_MOB_COLOR];
  const MOB_DAMAGED_COLOR = new THREE.Color(0x33363f);

  // Shared ring geometry (unit radius) for visualizing each mob's aura

  // MOB_AURA_RANGE, so changing the range doesn't need new geometry.
  const mobAuraRingGeo = new THREE.RingGeometry(0.9, 1.0, 40);
  function makeAuraRing(color){
    const mat = new THREE.MeshBasicMaterial({
      color, transparent: true, opacity: 0.32, side: THREE.DoubleSide, depthWrite: false
    });
    return new THREE.Mesh(mobAuraRingGeo, mat);
  }
  // Big and gold mobs each have their own complete, independently-tunable
  // stat block now — nothing here is derived from the normal mob's current
  // stats times a multiplier, so tuning one variant never silently drags
  // the others along with it.
  let BIG_MOB_HP = 300;
  let BIG_MOB_DAMAGE_MIN = 58, BIG_MOB_DAMAGE_MAX = 71;
  let BIG_MOB_COOLDOWN_MS = 1800;
  let BIG_MOB_RANGE = 7 * Math.PI / 180;
  let BIG_MOB_SPEED = 0.08 * Math.PI / 180;
  let BIG_MOB_SIZE_MULT = 2; // purely visual scale, relative to a normal mob's mesh

  // Big blue mob's own independent stat block — starts equal to big pink
  // mob's, but can be tuned separately from here on.
  let BIG_BLUE_MOB_HP = 300;
  let BIG_BLUE_MOB_DAMAGE_MIN = 58, BIG_BLUE_MOB_DAMAGE_MAX = 71;
  let BIG_BLUE_MOB_COOLDOWN_MS = 1800;
  let BIG_BLUE_MOB_RANGE = 7 * Math.PI / 180;
  let BIG_BLUE_MOB_SPEED = 0.08 * Math.PI / 180;
  let BIG_BLUE_MOB_SIZE_MULT = 2;

  let GOLD_MOB_HP = 100;
  let GOLD_MOB_DAMAGE_MIN = 38, GOLD_MOB_DAMAGE_MAX = 45;
  let GOLD_MOB_COOLDOWN_MS = 1800;
  let GOLD_MOB_RANGE = 5 * Math.PI / 180;
  let GOLD_MOB_SPEED = 5 * Math.PI / 180;
  let GOLD_MOB_SIZE_MULT = 1;

  // Boss blue mob: a one-time, much tougher blue mob with its own complete,
  // independent stat block (checked first, ahead of big/gold).
  let BOSS_BLUE_MOB_HP = 7000;
  let BOSS_BLUE_MOB_DAMAGE_MIN = 135, BOSS_BLUE_MOB_DAMAGE_MAX = 161;
  let BOSS_BLUE_MOB_COOLDOWN_MS = 7000;
  let BOSS_BLUE_MOB_SPEED = 0.02 * Math.PI / 180;
  let BOSS_BLUE_MOB_RANGE = 12 * Math.PI / 180;
  let BOSS_BLUE_MOB_ERODE_DURATION = 10.0;
  let BOSS_BLUE_MOB_SIZE_MULT = 2.5;
  let BOSS_BLUE_MOB_SPAWN_DELAY_MS = 180000; // after kick-off; shared by the pink and blue bosses

  // ---------- Gray mob: a cyan-side dodecahedron that hunts crowds ----------
  // Three modes. It starts in "search", behaving like an ordinary blue mob
  // while sweeping for a knot of enemies every few seconds. Finding one
  // sends it to "charge": walk up, pause, then roll straight through at
  // speed, clipping whoever is in the way and detonating on the target.
  // Afterwards it settles into "attack" until nothing is left nearby.
  const GRAY_MOB_COLOR = new THREE.Color(0x8d8f96);
  let GRAY_MOB_CHANCE = 0.05;   // share of cyan-ground spawns
  let GRAY_MOB_HP = 900;
  let GRAY_MOB_SIZE_MULT = 1;   // relative to a normal blue mob
  let GRAY_MOB_SPEED = 0.08 * Math.PI / 180; // ordinary walking pace, used by every mode
  // --- search mode ---
  let GRAY_MOB_SCAN_INTERVAL_MS = 3000;
  let GRAY_MOB_SCAN_RANGE = 25 * Math.PI / 180;
  let GRAY_MOB_CLUSTER_RADIUS = 7 * Math.PI / 180; // how tightly packed counts as a crowd
  // --- charge mode ---
  let GRAY_MOB_CHARGE_TRIGGER_RANGE = 20 * Math.PI / 180; // close enough to wind up
  let GRAY_MOB_CHARGE_WINDUP_MS = 1000;
  let GRAY_MOB_CHARGE_SPEED = 2.5 * Math.PI / 180;
  let GRAY_MOB_CHARGE_LINE_DAMAGE = 50;
  let GRAY_MOB_CHARGE_LINE_WIDTH = 2 * Math.PI / 180;  // corridor it sweeps on the way through
  let GRAY_MOB_CHARGE_LINE_KNOCKBACK = 2 * Math.PI / 180;
  let GRAY_MOB_HIT_RADIUS = 2.5 * Math.PI / 180;       // how close it must get to actually connect
  let GRAY_MOB_BLAST_DAMAGE = 85;
  let GRAY_MOB_BLAST_RADIUS = 7 * Math.PI / 180;
  let GRAY_MOB_BLAST_KNOCKBACK_MIN = 3.5 * Math.PI / 180;
  let GRAY_MOB_BLAST_KNOCKBACK_MAX = 3.8 * Math.PI / 180;
  let GRAY_MOB_BLAST_STUN_MS = 300;
  let GRAY_MOB_KNOCKBACK_SPEED = 0.35 * Math.PI / 180;  // per frame, so a 3.5° fling slides over ~10 frames
  let GRAY_MOB_CHARGE_OVERSHOOT = 3 * Math.PI / 180;    // how far past the target it presses on before giving up
  let GRAY_MOB_SLIDE_FRICTION = 0.90;                   // per-frame speed decay once a charge has missed
  // --- attack mode ---
  let GRAY_MOB_ATTACK_DAMAGE = 30;
  let GRAY_MOB_COOLDOWN_MS = 8000;
  let GRAY_MOB_RANGE = 5 * Math.PI / 180;               // attack / erosion radius
  let GRAY_MOB_ATTACK_SEARCH_RANGE = 7 * Math.PI / 180; // attack mode ends when this empties out
  let GRAY_MOB_MASS = 10;

  function mobAuraRange(mob){
    if (mob.isFarmer) return FARMER_MOB_SENSE;
    if (mob.isScarecrow) return SCARECROW_RANGE;
    if (mob.isPurple) return PURPLE_MOB_RANGE;
    if (mob.isGray) return GRAY_MOB_RANGE;
    if (mob.isBoss) return BOSS_BLUE_MOB_RANGE;
    if (mob.isAlliedBlack) return BLACK_MOB_RANGE;
    if (mob.isAlliedGreen) return GREEN_MOB_RANGE;
    if (mob.isBig) return mob.team === 'pink' ? BIG_MOB_RANGE : BIG_BLUE_MOB_RANGE;
    return mob.isGold ? GOLD_MOB_RANGE : MOB_AURA_RANGE;
  }
  function mobSpeed(mob){
    if (mob.isFarmer) return FARMER_MOB_SPEED;
    if (mob.isScarecrow) return SCARECROW_SPEED;
    if (mob.isPurple) return PURPLE_MOB_SPEED;
    if (mob.isGray) return GRAY_MOB_SPEED;
    if (mob.isBoss) return BOSS_BLUE_MOB_SPEED;
    if (mob.isAlliedBlack) return BLACK_MOB_SPEED;
    if (mob.isAlliedGreen) return GREEN_MOB_SPEED;
    if (mob.isBig) return mob.team === 'pink' ? BIG_MOB_SPEED : BIG_BLUE_MOB_SPEED;
    return mob.isGold ? GOLD_MOB_SPEED : MOB_ANGULAR_SPEED;
  }
  function mobAttackCooldown(mob){
    if (mob.isFarmer) return FARMER_MOB_THROW_MS;
    if (mob.isScarecrow) return SCARECROW_COOLDOWN_MS;
    if (mob.isPurple) return PURPLE_MOB_COOLDOWN_MS;
    if (mob.isGray) return GRAY_MOB_COOLDOWN_MS;
    if (mob.isBoss) return BOSS_BLUE_MOB_COOLDOWN_MS;
    if (mob.isAlliedBlack) return BLACK_MOB_COOLDOWN_MS;
    if (mob.isAlliedGreen) return GREEN_MOB_COOLDOWN_MS;
    if (mob.isBig) return mob.team === 'pink' ? BIG_MOB_COOLDOWN_MS : BIG_BLUE_MOB_COOLDOWN_MS;
    return mob.isGold ? GOLD_MOB_COOLDOWN_MS : MOB_ATTACK_COOLDOWN_MS;
  }
  function mobDamageRoll(mob){
    if (mob.isPurple || mob.isFarmer) return 0; // never attack directly
    if (mob.isScarecrow) return SCARECROW_DMG_MIN + Math.random() * (SCARECROW_DMG_MAX - SCARECROW_DMG_MIN);
    if (mob.isGray) return GRAY_MOB_ATTACK_DAMAGE; // fixed, never a range
    if (mob.isBoss) return BOSS_BLUE_MOB_DAMAGE_MIN + Math.random() * (BOSS_BLUE_MOB_DAMAGE_MAX - BOSS_BLUE_MOB_DAMAGE_MIN);
    if (mob.isAlliedBlack) return BLACK_MOB_DAMAGE_MIN + Math.random() * (BLACK_MOB_DAMAGE_MAX - BLACK_MOB_DAMAGE_MIN);
    if (mob.isAlliedGreen) return GREEN_MOB_DAMAGE_MIN + Math.random() * (GREEN_MOB_DAMAGE_MAX - GREEN_MOB_DAMAGE_MIN);
    if (mob.isBig){
      const lo = mob.team === 'pink' ? BIG_MOB_DAMAGE_MIN : BIG_BLUE_MOB_DAMAGE_MIN;
      const hi = mob.team === 'pink' ? BIG_MOB_DAMAGE_MAX : BIG_BLUE_MOB_DAMAGE_MAX;
      return lo + Math.random() * (hi - lo);
    }
    const lo = mob.isGold ? GOLD_MOB_DAMAGE_MIN : MOB_ATTACK_DAMAGE_MIN;
    const hi = mob.isGold ? GOLD_MOB_DAMAGE_MAX : MOB_ATTACK_DAMAGE_MAX;
    return lo + Math.random() * (hi - lo);
  }
  function mobErodeDuration(mob){
    return mob.isBoss ? BOSS_BLUE_MOB_ERODE_DURATION : MOB_ERODE_DURATION;
  }
  function updateAuraRingTransform(ring, dir, range){
    ring.position.copy(dir).multiplyScalar(R * 1.02 + 0.008);
    ring.quaternion.setFromUnitVectors(MOB_UP, dir);
    ring.scale.setScalar(R * range);
  }

  const pinkMobs = [];
  const blueMobs = [];
  function teamMobs(t){ return t === 0 ? pinkMobs : blueMobs; }
  function mobTeamIdx(mob){ return mob.team === 'pink' ? 0 : 1; }
  let nextMobNetId = 1;
  function takeMobNetId(){ const id = nextMobNetId; nextMobNetId = (nextMobNetId % 4095) + 1; return id; }

  function randomCellOfColor(match){
    const matches = [];
    for (let i = 0; i < territoryGrid.length; i++){
      if (match(territoryGrid[i], i)) matches.push(i);
    }
    if (matches.length === 0) return null;
    return matches[Math.floor(Math.random() * matches.length)];
  }

  function removeMob(list, i){
    const mob = list[i];
    // A purple mob killed off (HP 0) bursts too.
    if (mob.isPurple && mob.hp <= 0 && !mob.burst) purpleBurst(mob);
    sphereGroup.remove(mob.mesh);
    mob.mesh.geometry.dispose();
    mob.mesh.material.dispose();
    sphereGroup.remove(mob.auraRing);
    mob.auraRing.material.dispose();
    if (mob.hpBar){
      sphereGroup.remove(mob.hpBar);
      mob.hpBar.material.map.dispose();
      mob.hpBar.material.dispose();
    }
    list.splice(i, 1);
  }

  let BIG_PINK_MOB_CHANCE = 0.35;   // from dark-pink ground: big 35% / gold 2% / pink the rest
  let DARK_PINK_GOLD_CHANCE = 0.02;
  let RED_BIG_CHANCE = 0.60, RED_GOLD_CHANCE = 0.05; // red / deep-blue ground: normal 35% / big 60% / gold 5%
  let PLAIN_PINK_GOLD_CHANCE = 0.01; // from plain pink ground: pink 99% / gold 1%
  let BIG_BLUE_MOB_CHANCE = 0.35; // from cyan ground: shares the same stats as big pink mob
  // A hard cap on how many mobs can be alive per side at once. Without
  // one, the population only ever grows over a long session — every extra
  // spawn source added over time (allied auto-spawns, boss, neutral
  // guardians, big/gold rolls) stacks on top of the last with nothing to
  // bring the count back down except combat deaths — and resolveMobCollisions
  // checks every pair of mobs each frame, so that growth costs quadratically,
  // not linearly. This is almost certainly why things gradually felt
  // heavier over a play session.
  const MAX_MOBS_PER_TEAM = 60;
  const MAX_NEUTRAL_MOBS = 30; // 2 black + 6 green per team from strong cards, plus moon grays
  // Each team's ground spawns that team's mobs. The light colour gives a
  // normal mob (or rarely a gold one); the dark colour also has a chance
  // of a big or gold one. The cyan side uses exactly the pink side's rules.
  function spawnMob(team){
    const isPink = team === 'pink';
    const t = isPink ? 0 : 1;
    if (teamMobs(t).length >= MAX_MOBS_PER_TEAM) return;
    const idx = randomCellOfColor(isTeamTerritory[t]);
    if (idx === null) return; // no territory of that color to spawn from yet
    let isBig = false, isGold = false;
    const roll = Math.random();
    const bigChance = isPink ? BIG_PINK_MOB_CHANCE : BIG_BLUE_MOB_CHANCE;
    if (isFarmCell(idx)){
      // 畑陣地 has its own table: farmer 50% / gold (silver) 1% / normal 49%.
      if (roll < FARM_FARMER_CHANCE){ spawnFarmerMob(t, cellIdxToDir(idx)); return; }
      if (roll < FARM_FARMER_CHANCE + FARM_GOLD_CHANCE) isGold = true;
    } else if (territoryGrid[idx] === RED_OF[t]){
      if (roll < RED_BIG_CHANCE) isBig = true;
      else if (roll < RED_BIG_CHANCE + RED_GOLD_CHANCE) isGold = true;
    } else if (territoryGrid[idx] === DARK_OF[t]){
      if (roll < bigChance) isBig = true;
      else if (roll < bigChance + DARK_PINK_GOLD_CHANCE) isGold = true;
    } else if (roll < PLAIN_PINK_GOLD_CHANCE){
      isGold = true;
    }
    const dir = cellIdxToDir(idx);
    const baseColor = isGold ? GOLD_MOB_COLORS[t] : (isPink ? PINK_MOB_COLOR : BLUE_MOB_COLOR);
    const sizeMult = isBig ? (isPink ? BIG_MOB_SIZE_MULT : BIG_BLUE_MOB_SIZE_MULT) : (isGold ? GOLD_MOB_SIZE_MULT : 1); // visual scale only
    const mesh = new THREE.Mesh(
      new THREE.ConeGeometry(MOB_LOCAL_R * sizeMult, MOB_LOCAL_R * 2.1 * sizeMult, 3),
      new THREE.MeshBasicMaterial({ color: baseColor.clone() })
    );
    mesh.position.copy(dir).multiplyScalar(R * 1.02);
    mesh.quaternion.setFromUnitVectors(MOB_UP, dir);
    sphereGroup.add(mesh);
    const ringColor = isGold ? GOLD_RING_COLORS[t] : isBig ? (isPink ? 0xff2f7a : 0x2f7aff) : (isPink ? 0xff5a9e : 0x5ad0ff);
    const auraRing = makeAuraRing(ringColor);
    const spawnHp = isBig ? (isPink ? BIG_MOB_HP : BIG_BLUE_MOB_HP) : (isGold ? GOLD_MOB_HP : MOB_HP_MAX);
    updateAuraRingTransform(auraRing, dir, isBig ? (isPink ? BIG_MOB_RANGE : BIG_BLUE_MOB_RANGE) : (isGold ? GOLD_MOB_RANGE : MOB_AURA_RANGE));
    sphereGroup.add(auraRing);
    const mob = {
      team, isBig: !!isBig, isGold: !!isGold, isGray: false, mesh, auraRing, hpBar: null, baseColor, dir: dir.clone(),
      hp: spawnHp, maxHp: spawnHp,
      netId: takeMobNetId(),
      targetKind: null, target: null, // 'territory' (grid idx) | 'mob' | 'char'
      nextRetargetAt: 0,
      lastAttackAt: -999,
      spinT: 0,
      erodeProgress: 0,
      grayState: null, grayTarget: null, nextScanAt: 0,
      chargeActive: false, chargeSliding: false, chargeWindupUntil: 0, rollAngle: 0,
      kbRemaining: 0, kbCenter: null, stunUntil: 0
    };
    teamMobs(t).push(mob);
  }
  const nextMobSpawnAt = [0, 0]; // set at kick-off (see startMatchSim)

  // Boss mobs — one per team (boss pink / boss blue, identical stats: the
  // BOSS_BLUE_* block), each spawning exactly once BOSS_BLUE_MOB_SPAWN_DELAY_MS
  // after kick-off (not from the usual spawn-timer cadence at all). If that
  // team has no territory when its time comes, it keeps trying each
  // subsequent check until some exists, rather than spawning nowhere.
  const bossMobSpawned = [false, false];
  function spawnBossMob(t){
    const idx = randomCellOfColor(isTeamTerritory[t]);
    if (idx === null) return false; // no territory yet — try again later
    const dir = cellIdxToDir(idx);
    const baseColor = BOSS_MOB_COLORS[t];
    const mesh = new THREE.Mesh(
      new THREE.ConeGeometry(MOB_LOCAL_R * BOSS_BLUE_MOB_SIZE_MULT, MOB_LOCAL_R * 2.1 * BOSS_BLUE_MOB_SIZE_MULT, 3),
      new THREE.MeshBasicMaterial({ color: baseColor.clone() })
    );
    mesh.position.copy(dir).multiplyScalar(R * 1.02);
    mesh.quaternion.setFromUnitVectors(MOB_UP, dir);
    sphereGroup.add(mesh);
    const auraRing = makeAuraRing(0xffffff);
    updateAuraRingTransform(auraRing, dir, BOSS_BLUE_MOB_RANGE);
    sphereGroup.add(auraRing);
    const hpBar = makeHPBarSprite();
    hpBar.position.copy(dir).multiplyScalar(R * 1.02 + MOB_LOCAL_R * BOSS_BLUE_MOB_SIZE_MULT + 0.12);
    updateHPBarSprite(hpBar, 1);
    sphereGroup.add(hpBar);
    const mob = {
      team: t === 0 ? 'pink' : 'blue', isBig: false, isGold: false, isBoss: true, mesh, auraRing, hpBar, baseColor, dir: dir.clone(),
      hp: BOSS_BLUE_MOB_HP, maxHp: BOSS_BLUE_MOB_HP,
      netId: takeMobNetId(),
      targetKind: null, target: null,
      nextRetargetAt: 0,
      lastAttackAt: -999,
      spinT: 0,
      erodeProgress: 0
    };
    teamMobs(t).push(mob);
    return true;
  }

  // Expanding-ring search in grid space for the nearest cell of a color —
  // stops as soon as it finds one, so a nearby match (the common case) is
  // cheap; caps out at maxRing so a genuinely absent color doesn't scan
  // forever.
  // `match` is a predicate (colorId) => bool, not a single color — this lets
  // callers treat e.g. both PINK and DARK_PINK as "pink territory" at once.
  function findNearestCellOfColor(fromDir, match, maxRing){
    const idx0 = dirToGridIdx(fromDir);
    if (match(territoryGrid[idx0])) return idx0;
    const gx0 = idx0 % GRID_W, gy0 = (idx0 / GRID_W) | 0;
    for (let r = 1; r <= maxRing; r++){
      for (let dy = -r; dy <= r; dy++){
        const gy = gy0 + dy;
        if (gy < 0 || gy >= GRID_H) continue;
        if (Math.abs(dy) === r){
          for (let dx = -r; dx <= r; dx++){
            const gx = ((gx0 + dx) % GRID_W + GRID_W) % GRID_W;
            if (match(territoryGrid[gy * GRID_W + gx])) return gy * GRID_W + gx;
          }
        } else {
          let gx = ((gx0 + r) % GRID_W + GRID_W) % GRID_W;
          if (match(territoryGrid[gy * GRID_W + gx])) return gy * GRID_W + gx;
          gx = ((gx0 - r) % GRID_W + GRID_W) % GRID_W;
          if (match(territoryGrid[gy * GRID_W + gx])) return gy * GRID_W + gx;
        }
      }
    }
    return null;
  }
  const isCyan = (c) => c === CYAN;
  const isPinkTerritory = (c) => c === PINK || c === DARK_PINK;
  function nearestInList(fromDir, list, filterFn){
    let best = null, bestD = Infinity;
    for (const item of list){
      if (filterFn && !filterFn(item)) continue;
      const d = angleBetween(fromDir, item.dir);
      if (d < bestD){ bestD = d; best = item; }
    }
    return best;
  }
  function targetDirOf(mob){
    if (mob.targetKind === 'territory') return cellIdxToDir(mob.target);
    if (mob.targetKind === 'mob' || mob.targetKind === 'char' || mob.targetKind === 'dot' || mob.targetKind === 'neutral') return mob.target.dir;
    return null;
  }
  // No fixed priority — whichever candidate is actually nearest wins:
  // enemy ground, an enemy mob, or an enemy dot. Same rule for both teams.
  function retargetMob(mob){
    const t = mobTeamIdx(mob), e = 1 - t;
    const territoryIdx = findNearestCellOfColor(mob.dir, isTeamTerritory[e], 60);
    const territoryD = territoryIdx !== null ? angleBetween(mob.dir, cellIdxToDir(territoryIdx)) : Infinity;
    const em = nearestInList(mob.dir, teamMobs(e));
    const emD = em ? angleBetween(mob.dir, em.dir) : Infinity;
    const c = nearestInList(mob.dir, charTargets(), ch => ch.alive && ch.team === e);
    const cD = c ? angleBetween(mob.dir, c.dir) : Infinity;
    if (territoryD === Infinity && emD === Infinity && cD === Infinity){ mob.targetKind = null; mob.target = null; return; }
    if (territoryD <= emD && territoryD <= cD){ mob.targetKind = 'territory'; mob.target = territoryIdx; }
    else if (emD <= cD){ mob.targetKind = 'mob'; mob.target = em; }
    else { mob.targetKind = 'char'; mob.target = c; }
  }
  // A real-time check (every frame, not just on the retarget timer): an
  // enemy unit that has wandered within aura range always takes over as
  // the target, interrupting whatever the mob was otherwise doing
  // (heading for territory, eroding it, etc.) in favor of fighting back.
  // Angular distance from a team mob to the *edge* of a neutral mob's body.
  function neutralEdgeDist(mob, nm){
    return Math.max(0, angleBetween(mob.dir, nm.dir) - mobVisualRadius(nm) / R);
  }
  function findAggroTarget(mob){
    const range = mobAuraRange(mob);
    const e = 1 - mobTeamIdx(mob);
    const within = (item) => angleBetween(mob.dir, item.dir) <= range;
    const em = nearestInList(mob.dir, teamMobs(e), within);
    const c = nearestInList(mob.dir, charTargets(), ch => ch.alive && ch.team === e && within(ch));
    // Neutral mobs (black / green / gray) inside the range are fair game too.
    // (Only the mobs themselves — the crater / crystal ground is never
    // targeted; erosion below only ever touches the enemy team's colours.)
    // Measured to the neutral mob's body edge, not its centre: black mobs
    // are big enough that mob collision keeps a normal mob's centre from
    // ever getting within its 5° range of theirs, so a centre-to-centre
    // check never fired even with the aura ring clearly overlapping.
    const nm = nearestInList(mob.dir, neutralMobs, m => neutralEdgeDist(mob, m) <= range); // black, green and the moon's gray alike
    let best = null, bestD = Infinity;
    if (em){ const d = angleBetween(mob.dir, em.dir); if (d < bestD){ bestD = d; best = { kind: 'mob', target: em }; } }
    if (c){ const d = angleBetween(mob.dir, c.dir); if (d < bestD){ bestD = d; best = { kind: 'char', target: c }; } }
    if (nm){ const d = neutralEdgeDist(mob, nm); if (d < bestD){ bestD = d; best = { kind: 'neutral', target: nm }; } }
    return best;
  }

  const MOB_SPIN_DURATION = 0.4; // seconds, one full vertical tumble
  const MOB_SPIN_AXIS = new THREE.Vector3(1, 0, 0);
  const mobSpinQuat = new THREE.Quaternion();
  function applyMobSpin(mesh, remaining, axis){
    const t = 1 - remaining / MOB_SPIN_DURATION; // 0 -> 1 over the spin
    mobSpinQuat.setFromAxisAngle(axis || MOB_SPIN_AXIS, t * Math.PI * 2);
    mesh.quaternion.multiply(mobSpinQuat);
  }

  // ---------- knockback + stun (shared; currently only the gray mob inflicts them) ----------
  // Knockback is a slide, not a teleport: the angle is banked here and paid
  // out a little each frame by updateMobKnockback.
  function applyKnockback(mob, centerDir, angle){
    mob.kbCenter = centerDir.clone();
    if (!(mob.kbRemaining > 0)) mob.kbTotal = 0;
    mob.kbRemaining = (mob.kbRemaining || 0) + angle;
    mob.kbTotal = (mob.kbTotal || 0) + angle;
  }
  // Height of the arc a knocked-back mob flies along: a parabola over the
  // slide, peaking halfway, proportional to how far it's thrown.
  function knockbackHopHeight(total, remaining){
    if (!(total > 0)) return 0;
    const p = 1 - remaining / total;
    return 4 * p * (1 - p) * total * R * 0.55;
  }
  function stunMob(mob, now, ms){
    mob.stunUntil = Math.max(mob.stunUntil || 0, now + ms);
  }
  // Returns true while the mob is still being flung outward.
  function updateMobKnockback(mob){
    if (!mob.kbRemaining || mob.kbRemaining <= 0 || !mob.kbCenter) return false;
    const step = Math.min(mob.kbRemaining, GRAY_MOB_KNOCKBACK_SPEED * frameSpeedScale);

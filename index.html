    if (step < 0.002) return;
    ch.bHist.unshift(head.clone());
    for (let i = 0; i < ch.bHistLen.length; i++) ch.bHistLen[i] += step;
    ch.bHistLen.unshift(0);
    const need = BSEG_OFFSETS[BSEG_COUNT - 1] + 0.05;
    while (ch.bHist.length > 2 && ch.bHistLen[ch.bHistLen.length - 2] > need){ ch.bHist.pop(); ch.bHistLen.pop(); }
  }
  function bHistPoint(ch, s){
    const h = ch.bHist, L = ch.bHistLen;
    for (let i = 1; i < h.length; i++){
      if (L[i] >= s){
        const span = L[i] - L[i - 1];
        const f = span > 1e-9 ? (s - L[i - 1]) / span : 0;
        return slerpVec(h[i - 1], h[i], f).normalize();
      }
    }
    return h[h.length - 1].clone();
  }
  function showBSeg(seg, on){
    const f = on ? 'add' : 'remove';
    sphereGroup[f](seg.mesh); sphereGroup[f](seg.hpBar);
    if (!on){ seg.aura.visible = false; }
  }
  function layoutBChain(ch){
    const alive = ch.alive;
    const now = performance.now();
    const pulse = 1 + 0.12 * Math.sin(now * 0.006);
    // head aura
    ch.bAura.visible = alive && ch.bBall;
    if (ch.bAura.visible){
      ch.bAura.position.copy(ch.dir).multiplyScalar(R * 1.02);
      const s = CHAR_LOCAL_R * 5.2 * pulse; ch.bAura.scale.set(s, s, 1);
    }
    let prevDir = ch.dir, prevAlive = alive;
    for (let k = 0; k < BSEG_COUNT; k++){
      const seg = ch.bsegs[k];
      const cord = ch.bCords[k];
      if (!seg.alive){ cord.visible = false; seg.aura.visible = false; prevAlive = false; continue; }
      seg.dir = bHistPoint(ch, BSEG_OFFSETS[k]);
      seg.mesh.position.copy(seg.dir).multiplyScalar(R * 1.02);
      if (k === BSEG_COUNT - 1){
        // tail triangle lies flat, one corner pointing away from B5
        seg.mesh.quaternion.setFromUnitVectors(MOB_UP, seg.dir);
        const back = seg.dir.clone().sub(prevDir); back.sub(seg.dir.clone().multiplyScalar(back.dot(seg.dir)));
        if (back.lengthSq() > 1e-10){
          const localBack = back.normalize().applyQuaternion(seg.mesh.quaternion.clone().invert());
          seg.mesh.rotateY(Math.atan2(localBack.x, localBack.z));
        }
      }
      seg.hpBar.position.copy(seg.dir).multiplyScalar(R * 1.02 + BSEG_R + 0.08);
      seg.aura.visible = seg.ball;
      if (seg.ball){
        seg.aura.position.copy(seg.dir).multiplyScalar(R * 1.02);
        const s = BSEG_R * 5.2 * pulse; seg.aura.scale.set(s, s, 1);
      }
      // cord to the link in front
      cord.visible = prevAlive;
      if (prevAlive){
        const a = prevDir.clone().multiplyScalar(R * 1.02), b = seg.dir.clone().multiplyScalar(R * 1.02);
        const mid = a.clone().add(b).multiplyScalar(0.5);
        const len = a.distanceTo(b);
        cord.position.copy(mid);
        cord.scale.set(1, Math.max(0.001, len), 1);
        cord.quaternion.setFromUnitVectors(MOB_UP, b.sub(a).normalize());
      }
      prevDir = seg.dir; prevAlive = true;
    }
  }
  // Kill link k and everything behind it.
  function killBSegsFrom(ch, k){
    for (let j = k; j < BSEG_COUNT; j++){
      const seg = ch.bsegs[j];
      if (!seg.alive) continue;
      seg.alive = false; seg.ball = false; seg.hp = 0;
      showBSeg(seg, false);
    }
  }
  function damageBSeg(seg, dmg){
    if (!seg.alive) return;
    spawnFloatingNumber(seg.dir, BSEG_R, dmg, '#ff3030');
    seg.hp = Math.max(0, seg.hp - dmg);
    updateHPBarSprite(seg.hpBar, seg.hp / seg.maxHp);
    if (seg.hp <= 0) killBSegsFrom(seg.owner, seg.k);
  }
  // Every alive B link that can be hit, for enemy targeting.
  function aliveBSegs(){
    const out = [];
    for (const ch of characters) if (ch.bsegs) for (const s of ch.bsegs) if (s.alive) out.push(s);
    return out;
  }
  // Cached for a few ms: this is asked for by every mob every frame, and
  // rebuilding the list each time made a lot of garbage (= stutter).
  let _charTargetsCache = null, _charTargetsAt = -1;
  function charTargets(){
    const now = performance.now();
    if (_charTargetsCache && now - _charTargetsAt < 12) return _charTargetsCache;
    const segs = aliveBSegs();
    _charTargetsCache = segs.length ? characters.concat(segs) : characters;
    _charTargetsAt = now;
    return _charTargetsCache;
  }

  // ---- ball visuals (host and player 2) ----
  const bBalls = []; // { mesh, from, to, t, dur, arc, onLand }
  function spawnBBall(team, from, to, dur, arc, onLand){
    const mesh = new THREE.Mesh(bBallGeo, bBallMats[team === 1 ? 1 : 0]);
    sphereGroup.add(mesh);
    bBalls.push({ mesh, from: from.clone().normalize(), to: to.clone().normalize(), t: 0, dur, arc, onLand: onLand || null });
  }
  const bBlasts = []; // { mesh, t, dur, radius }
  function spawnBBlastVisual(dir, radius, team){
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), new THREE.MeshBasicMaterial({ color: team === 1 ? 0x4080ff : 0xff3a1a, transparent: true, opacity: 0.6, depthWrite: false }));
    mesh.position.copy(dir).multiplyScalar(R * 1.01);
    sphereGroup.add(mesh);
    bBlasts.push({ mesh, t: 0, dur: 0.45, size: R * Math.sin(radius) });
  }
  function updateBVisuals(dt){
    for (let i = bBalls.length - 1; i >= 0; i--){
      const b = bBalls[i];
      b.t += dt;
      const k = Math.min(1, b.t / b.dur);
      const d = slerpVec(b.from, b.to, k).normalize();
      b.mesh.position.copy(d).multiplyScalar(R * 1.04 + Math.sin(Math.PI * k) * b.arc);
      if (k >= 1){
        sphereGroup.remove(b.mesh);
        bBalls.splice(i, 1);
        if (b.onLand && simRunning()) b.onLand(b.to);
      }
    }
    for (let i = bBlasts.length - 1; i >= 0; i--){
      const x = bBlasts[i];
      x.t += dt;
      const k = Math.min(1, x.t / x.dur);
      x.mesh.scale.setScalar(x.size * (0.3 + 0.7 * k));
      x.mesh.material.opacity = 0.6 * (1 - k);
      if (k >= 1){ sphereGroup.remove(x.mesh); x.mesh.geometry.dispose(); x.mesh.material.dispose(); bBlasts.splice(i, 1); }
    }
  }
  // Relay hand-off (short hop between links) — host plays it and tells player 2.
  function bRelayVisual(team, from, to){
    spawnBBall(team, from, to, 0.35, 0.08);
    netPushEvent('j' + enc1(team) + encDir(from) + encDir(to));
  }
  function bBlastAt(team, dir){
    spawnBBlastVisual(dir, B_BLAST_RADIUS, team);
    netPushEvent('k' + enc1(team) + encDir(dir));
    const e = 1 - team;
    for (const x of charTargets()){
      if (x.alive && x.team === e && angleBetween(x.dir, dir) <= B_BLAST_RADIUS){
        damageCharacter(x, B_BLAST_DMG_MIN + Math.random() * (B_BLAST_DMG_MAX - B_BLAST_DMG_MIN));
      }
    }
    const foes = teamMobs(e);
    for (const m of foes.slice()){
      if (foes.indexOf(m) === -1) continue;
      if (angleBetween(m.dir, dir) <= B_BLAST_RADIUS + mobVisualRadius(m) / R){
        damageMobInList(foes, m, B_BLAST_DMG_MIN + Math.random() * (B_BLAST_DMG_MAX - B_BLAST_DMG_MIN));
      }
    }
    // Neutral mobs caught in the blast take it too.
    for (const m of neutralMobs.slice()){
      if (neutralMobs.indexOf(m) === -1) continue;
      if (angleBetween(m.dir, dir) <= B_BLAST_RADIUS + mobVisualRadius(m) / R){
        damageMobInList(neutralMobs, m, B_BLAST_DMG_MIN + Math.random() * (B_BLAST_DMG_MAX - B_BLAST_DMG_MIN));
      }
    }
  }
  function bFindTarget(ch){
    const e = 1 - ch.team;
    let best = null, bestD = Infinity;
    for (const m of teamMobs(e)){ const d = angleBetween(ch.dir, m.dir); if (d <= B_ATTACK_RANGE && d < bestD){ bestD = d; best = m; } }
    for (const m of neutralMobs){ const d = angleBetween(ch.dir, m.dir); if (d <= B_ATTACK_RANGE && d < bestD){ bestD = d; best = m; } } // neutral mobs too
    for (const x of charTargets()){
      if (!x.alive || x.team !== e) continue;
      const d = angleBetween(ch.dir, x.dir);
      if (d <= B_ATTACK_RANGE && d < bestD){ bestD = d; best = x; }
    }
    return best;
  }

  // Host: runs the chain each frame.
  function updateReloader(ch, dt, now){
    ensureBChain(ch);
    if (!ch.bInit && ch.alive){
      // Kick-off: the whole chain is there from the start.
      ch.bInit = true; ch.bWasAlive = true;
      resetBHistory(ch);
      for (const seg of ch.bsegs){ seg.alive = true; seg.hp = seg.maxHp; seg.ball = false; updateHPBarSprite(seg.hpBar, 1); showBSeg(seg, true); }
      ch.bRelayAt = now + B_RELAY_MS;
    }
    if (!ch.alive){
      killBSegsFrom(ch, 0);
      ch.bBall = false;
      ch.bWasAlive = false;
      layoutBChain(ch);
      return;
    }
    if (!ch.bWasAlive){
      // (re)spawned: the chain grows back from the front, one link per 10 s
      ch.bWasAlive = true;
      resetBHistory(ch);
      ch.bRelayAt = now + B_RELAY_MS;
    }
    pushBHistory(ch);
    // Revive: the first missing link comes back after BSEG_REVIVE_MS.
    const firstDead = ch.bsegs.findIndex(s => !s.alive);
    if (firstDead !== -1){
      const seg = ch.bsegs[firstDead];
      if (!seg.reviveAt) seg.reviveAt = now + BSEG_REVIVE_MS;
      else if (now >= seg.reviveAt){
        seg.reviveAt = 0;
        seg.alive = true; seg.hp = seg.maxHp; seg.ball = false;
        updateHPBarSprite(seg.hpBar, 1);
        showBSeg(seg, true);
      }
    }
    for (let k = 0; k < BSEG_COUNT; k++) if (ch.bsegs[k].alive && k !== firstDead) ch.bsegs[k].reviveAt = 0;
    layoutBChain(ch);
    // Tail on red ground: a new ball forms there.
    const tail = ch.bsegs[BSEG_COUNT - 1];
    if (tail.alive && !tail.ball && territoryGrid[dirToGridIdx(tail.dir)] === RED_OF[ch.team]) tail.ball = true;
    // The relay: every B_RELAY_MS, everyone hands forward at once — B1
    // throws at an enemy if it holds a ball and one is in range, and every
    // link whose front neighbour is (now) empty passes its ball forward.
    // It only stalls when it's jammed: every link holds a ball and B1 has
    // nobody to throw at. The moment B1 throws, it all moves again at once
    // and the 3 s rhythm restarts from there.
    const target = ch.bBall ? bFindTarget(ch) : null;
    if (now >= ch.bRelayAt || (ch.bJammed && target)){
      if (ch.bBall && target){
        ch.bBall = false;
        const from = ch.dir.clone(), to = target.dir.clone();
        const dist = angleBetween(from, to);
        const team = ch.team;
        spawnBBall(team, from, to, 0.45 + dist * 1.5, 0.2 + dist * 1.2, (d) => bBlastAt(team, d));
        netPushEvent('j' + enc1(team) + encDir(from) + encDir(to));
      }
      const holders = [ch].concat(ch.bsegs);
      const hasBall = (n) => n === ch ? ch.bBall : n.ball;
      const setBall = (n, v) => { if (n === ch) ch.bBall = v; else n.ball = v; };
      for (let k = 1; k < holders.length; k++){
        const cur = holders[k], front = holders[k - 1];
        if (!cur.alive || !front.alive) break;
        if (hasBall(cur) && !hasBall(front)){
          setBall(cur, false); setBall(front, true);
          bRelayVisual(ch.team, cur.dir, front.dir);
        }
      }
      // The tail refills straight away if it's still on red ground.
      if (tail.alive && !tail.ball && territoryGrid[dirToGridIdx(tail.dir)] === RED_OF[ch.team]) tail.ball = true;
      // Jammed = every living link (and B1) is holding a ball.
      ch.bJammed = holders.every(n => !n.alive || hasBall(n));
      ch.bRelayAt = now + B_RELAY_MS;
    }
  }
  // Player 2's page: positions follow the (smoothed) head; state comes from snapshots.
  function guestLayoutB(ch){
    ensureBChain(ch);
    if (ch.alive) pushBHistory(ch);
    layoutBChain(ch);
  }
  function encodeBState(ch){
    if (!ch || !ch.bsegs) return '';
    let s = enc1(ch.bBall ? 1 : 0);
    for (const seg of ch.bsegs) s += enc1(seg.alive ? 1 + Math.round(Math.max(0, seg.hp) / seg.maxHp * 60) : 0) + enc1(seg.ball ? 1 : 0);
    return s;
  }
  function applyBState(ch, s){
    if (!ch || typeof s !== 'string' || s.length < 1 + BSEG_COUNT * 2) return;
    ensureBChain(ch);
    ch.bBall = dec1(s, 0) === 1;
    for (let k = 0; k < BSEG_COUNT; k++){
      const seg = ch.bsegs[k];
      const v = dec1(s, 1 + k * 2);
      const alive = v > 0;
      if (alive !== seg.alive){ seg.alive = alive; showBSeg(seg, alive); }
      if (alive){ seg.hp = (v - 1) / 60 * seg.maxHp; updateHPBarSprite(seg.hpBar, (v - 1) / 60); }
      seg.ball = alive && dec1(s, 2 + k * 2) === 1;
    }
  }

  const _headingDelta = new THREE.Vector3();
  function updateCharacterAbilities(dt, now){
    // Track each character's last walking direction (B needs it to know
    // what's "in front").
    for (const ch of characters){
      if (!ch._prevDir){ ch._prevDir = ch.dir.clone(); continue; }
      _headingDelta.copy(ch.dir).sub(ch._prevDir);
      const len2 = _headingDelta.lengthSq();
      if (len2 > 1e-12 && len2 < 0.01){
        if (!ch.heading) ch.heading = new THREE.Vector3();
        ch.heading.copy(_headingDelta).normalize();
      }
      ch._prevDir.copy(ch.dir);
    }
    for (let t = 0; t < 2; t++){
      const farmer = charOf(t, 'A');
      if (farmer) updateFarmer(farmer, dt, now);
    }
    updateCrops(dt);
    updateWatermelonThrows(dt);
    for (let t = 0; t < 2; t++){
      const reloader = charOf(t, 'B');
      if (reloader) updateReloader(reloader, dt, now); // (the old ✕-mark ability is retired)
    }
    updateTunnelWarps();
    for (let t = 0; t < 2; t++){
      const wolf = charOf(t, 'C');
      if (wolf) updateWerewolfEars(wolf);
    }
    if (farmDirty && now - lastFarmRebuildAt > 250){
      rebuildFarmOutline();
      farmDirty = false;
      lastFarmRebuildAt = now;
    }
  }

  // ---------- ice wall support: the "氷の壁" skill card was removed, but an
  // always-empty `iceWalls` array is kept so the generic obstacle-collision
  // code (findObstaclePush, updateCharacterMovement's stop-and-backoff)
  // still has something safe to iterate, in case a wall-like obstacle is
  // added again later. ----------
  // (`iceWalls` itself is declared up near the top, before the blue dot's
  // initial spawn, since that spawn's obstacle check already reads it.)
  // How far a character backs off (in the same radians-of-travel units as
  // everything else) after being stopped by an obstacle, so it rests
  // clearly outside its collision radius instead of sitting right on the
  // boundary.
  const LANDMARK_STOP_BACKOFF = 0.03;

  // ---------- neutral guardian mobs: spawn from a landmark's zone, hostile
  // to absolutely everyone (both teams' mobs, both red dots and the blue
  // dot), and stay tethered near their home landmark. ----------
  const neutralMobs = [];
  let NEUTRAL_SPAWN_MIN_MS = 2200, NEUTRAL_SPAWN_MAX_MS = 3500; // same cadence as pink/blue; the % chance is what makes them rare
  let BLACK_MOB_CHANCE = 0.10, GREEN_MOB_CHANCE = 0.13; // (no longer used: black/green now spawn only when their landmark appears)
  let CRATER_BLACK_MOB_COUNT = 2;  // black mobs that appear together when a meteor crater forms
  let CRYSTAL_GREEN_MOB_COUNT = 1; // green mobs per spirit crystal (light pillar makes 6 crystals -> 6 greens)
  let NEUTRAL_LEASH_MULT = 3; // won't wander farther than this many home-zone-radii from home
  let NEUTRAL_WANDER_INTERVAL_MS = 3000;
  // Once the chased target gets farther than this from the neutral mob
  // (and is outside its attack range), the mob gives up and heads back
  // to its landmark.
  let NEUTRAL_CHASE_GIVEUP_RANGE = 6 * Math.PI / 180;

  let BLACK_MOB_HP = 600;
  let BLACK_MOB_SPEED = 0.05 * Math.PI / 180;
  let BLACK_MOB_DAMAGE_MIN = 70, BLACK_MOB_DAMAGE_MAX = 85;
  let BLACK_MOB_COOLDOWN_MS = 3500;
  let BLACK_MOB_RANGE = 8 * Math.PI / 180;

  let GREEN_MOB_HP = 30;
  let GREEN_MOB_SPEED = 0.08 * Math.PI / 180;
  let GREEN_MOB_RANGE = 14 * Math.PI / 180;
  let GREEN_MOB_DAMAGE_MIN = 4, GREEN_MOB_DAMAGE_MAX = 6;
  let GREEN_MOB_COOLDOWN_MS = 500;

  let nextBlackMobSpawnAt = performance.now() + NEUTRAL_SPAWN_MIN_MS + Math.random() * (NEUTRAL_SPAWN_MAX_MS - NEUTRAL_SPAWN_MIN_MS);
  let nextGreenMobSpawnAt = performance.now() + NEUTRAL_SPAWN_MIN_MS + Math.random() * (NEUTRAL_SPAWN_MAX_MS - NEUTRAL_SPAWN_MIN_MS);

  // A team mob hitting a neutral black / green mob.
  function damageNeutralMobRef(target, dmg){
    const i = neutralMobs.indexOf(target);
    if (i === -1) return;
    spawnFloatingNumber(target.dir, mobVisualRadius(target), dmg, '#ff3030');
    target.hp -= dmg;
    if (target.hp <= 0){ removeNeutralMob(i); return; }
    target.mesh.material.color.copy(target.baseColor).lerp(MOB_DAMAGED_COLOR, 1 - target.hp / target.maxHp);
    if (target.hpBar) updateHPBarSprite(target.hpBar, target.hp / target.maxHp);
  }
  function removeNeutralMob(i){
    const mob = neutralMobs[i];
    sphereGroup.remove(mob.mesh);
    mob.mesh.geometry.dispose(); mob.mesh.material.dispose();
    sphereGroup.remove(mob.auraRing);
    mob.auraRing.material.dispose();
    if (mob.hpBar){ sphereGroup.remove(mob.hpBar); mob.hpBar.material.map.dispose(); mob.hpBar.material.dispose(); }
    neutralMobs.splice(i, 1);
  }

  // `fixedHome` pins the spawn to one landmark (the moon crater's single
  // gray guardian); otherwise a random landmark of the matching type.
  function spawnNeutralMob(kind, fixedHome){
    if (neutralMobs.length >= MAX_NEUTRAL_MOBS) return;
    const isBlack = kind === 'black';
    const isGray = kind === 'gray';
    let home = fixedHome || null;
    if (!home){
      const homeType = isBlack ? 'meteor_mountain' : 'spirit_crystal';
      const candidates = landmarks.filter(lm => lm.type === homeType);
      if (candidates.length === 0) return;
      home = candidates[Math.floor(Math.random() * candidates.length)];
    }
    let dir = home.dir.clone();
    if (!isGray && home.radius > 0){
      // Several can appear on the same landmark at once — scatter them a
      // little inside the zone instead of stacking them on one point.
      let axis = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0));
      if (axis.lengthSq() < 1e-4) axis.set(1, 0, 0);
      axis.normalize();
      const bit = new THREE.Vector3().crossVectors(dir, axis).normalize();
      const ang = Math.random() * Math.PI * 2;
      const rad = Math.random() * home.radius * 0.5;
      dir = dir.add(axis.multiplyScalar(Math.cos(ang) * rad)).add(bit.multiplyScalar(Math.sin(ang) * rad)).normalize();
    }

    let mesh;
    if (isGray){
      mesh = new THREE.Mesh(
        new THREE.DodecahedronGeometry(MOB_LOCAL_R * GRAY_MOB_SIZE_MULT, 0),
        new THREE.MeshStandardMaterial({ color: GRAY_MOB_COLOR.clone(), roughness: 0.62, metalness: 0.28 })
      );
    } else if (isBlack){
      mesh = new THREE.Mesh(
        new THREE.ConeGeometry(MOB_LOCAL_R * 3, MOB_LOCAL_R * 2.1 * 3, 3),
        new THREE.MeshBasicMaterial({ color: 0x0c0c0c })
      );
    } else {
      mesh = new THREE.Mesh(
        new THREE.OctahedronGeometry(MOB_LOCAL_R * 1.5, 0),
        new THREE.MeshStandardMaterial({ color: 0x35ff8a, emissive: 0x0aff5a, emissiveIntensity: 0.6, roughness: 0.3, metalness: 0.15 })
      );
    }
    mesh.position.copy(dir).multiplyScalar(R * 1.02);
    mesh.quaternion.setFromUnitVectors(MOB_UP, dir);
    sphereGroup.add(mesh);

    const auraRing = makeAuraRing(isGray ? 0x9aa0a8 : isBlack ? 0x8a1f1f : 0x35ff8a);
    const attackRange = isGray ? GRAY_MOB_RANGE : isBlack ? BLACK_MOB_RANGE : GREEN_MOB_RANGE;
    updateAuraRingTransform(auraRing, dir, attackRange);
    sphereGroup.add(auraRing);
    const hpBar = null; // no HP bars on neutral mobs (the gray one's was removed too)
    const hp = isGray ? GRAY_MOB_HP : isBlack ? BLACK_MOB_HP : GREEN_MOB_HP;

    neutralMobs.push({
      netId: takeMobNetId(),
      kind, mesh, auraRing, hpBar, home, dir: dir.clone(),
      baseColor: mesh.material.color.clone(),
      visualRadius: isGray ? MOB_LOCAL_R * GRAY_MOB_SIZE_MULT : isBlack ? MOB_LOCAL_R * 3 : MOB_LOCAL_R * 1.5,
      hp, maxHp: hp,
      kbRemaining: 0, kbCenter: null, kbTotal: 0,
      grayState: 'search', grayTarget: null, chargeActive: false, chargeSliding: false, chargeWindupUntil: 0, rollAngle: 0, chargeAxis: null, nextScanAt: 0, grayReturning: false,
      target: null, // { kind: 'char'|'dot'|'pinkMob'|'blueMob', ref }
      returning: false,
      wanderTarget: null,
      nextWanderAt: 0,
      lastAttackAt: -999,
      spinT: 0,
      laserT: 0, laserTargetPos: null
    });
  }

  function neutralAttackRange(mob){
    return mob.kind === 'gray' ? GRAY_MOB_RANGE : mob.kind === 'black' ? BLACK_MOB_RANGE : GREEN_MOB_RANGE;
  }
  function neutralMoveSpeed(mob){
    return mob.kind === 'gray' ? GRAY_MOB_SPEED : mob.kind === 'black' ? BLACK_MOB_SPEED : GREEN_MOB_SPEED;
  }
  function neutralCooldown(mob){
    return mob.kind === 'gray' ? GRAY_MOB_COOLDOWN_MS : mob.kind === 'black' ? BLACK_MOB_COOLDOWN_MS : GREEN_MOB_COOLDOWN_MS;
  }
  function refOf(t){ return t.ref.dir; }

  // Anyone (either team's mobs, either red dots or the blue dot) inside the
  // mob's own attack range OR anywhere in its home landmark's zone counts
  // as intruding — nearest one wins.
  // homeOnly: while walking back home after giving up a chase, only
  // intruders actually standing inside the landmark are picked up.
  function findNeutralTarget(mob, homeOnly){
    const range = neutralAttackRange(mob);
    const homeR = mob.home.radius;
    const homeDir = mob.home.dir;
    const intrudes = homeOnly
      ? (d) => angleBetween(homeDir, d) <= homeR
      : (d) => angleBetween(mob.dir, d) <= range || angleBetween(homeDir, d) <= homeR;
    let best = null, bestD = Infinity;
    const consider = (kind, ref) => {
      if (!intrudes(ref.dir)) return;
      const d = angleBetween(mob.dir, ref.dir);
      if (d < bestD){ bestD = d; best = { kind, ref }; }
    };
    for (const ch of charTargets()) if (ch.alive) consider('char', ch);
    if (blueDot.active) consider('dot', blueDot);
    for (const m of pinkMobs) consider('pinkMob', m);
    for (const m of blueMobs) consider('blueMob', m);
    // Other neutral mobs are enemies too — but only ones of a different
    // kind, so the mobs that spawn together on one landmark don't wipe
    // each other out the moment they appear.
    for (const m of neutralMobs) if (m !== mob && m.kind !== mob.kind) consider('neutral', m);
    return best;
  }

  function damageNeutralTargetRef(t, dmg){
    if (t.kind === 'char') damageCharacter(t.ref, dmg);
    else if (t.kind === 'dot') damageBlueDot(dmg);
    else if (t.kind === 'neutral') damageNeutralMobRef(t.ref, dmg);
    else {
      const list = t.kind === 'pinkMob' ? pinkMobs : blueMobs;
      const oi = list.indexOf(t.ref);
      if (oi === -1) return;
      spawnFloatingNumber(t.ref.dir, mobVisualRadius(t.ref), dmg, '#ff3030');
      t.ref.hp -= dmg;
      if (t.ref.hp <= 0){
        removeMob(list, oi);
      } else {
        t.ref.mesh.material.color.copy(t.ref.baseColor).lerp(MOB_DAMAGED_COLOR, 1 - t.ref.hp / t.ref.maxHp);
        if (t.ref.hpBar) updateHPBarSprite(t.ref.hpBar, t.ref.hp / t.ref.maxHp);
      }
    }
  }
  function isNeutralTargetGone(t){
    if (t.kind === 'char') return !t.ref.alive;
    if (t.kind === 'dot') return !blueDot.active;
    if (t.kind === 'neutral') return neutralMobs.indexOf(t.ref) === -1;
    const list = t.kind === 'pinkMob' ? pinkMobs : blueMobs;
    return list.indexOf(t.ref) === -1;
  }

  function pickNeutralWanderTarget(mob){
    // A random point somewhere within the leash radius of home.
    const leash = mob.home.radius * NEUTRAL_LEASH_MULT;
    const homeDir = mob.home.dir;
    let axis = new THREE.Vector3().crossVectors(homeDir, new THREE.Vector3(0, 1, 0));
    if (axis.lengthSq() < 1e-4) axis.set(1, 0, 0);
    axis.normalize();
    const bitangent = new THREE.Vector3().crossVectors(homeDir, axis).normalize();
    const ang = Math.random() * Math.PI * 2;
    const rad = Math.random() * leash;
    const offset = axis.clone().multiplyScalar(Math.cos(ang) * rad).add(bitangent.clone().multiplyScalar(Math.sin(ang) * rad));
    mob.wanderTarget = homeDir.clone().add(offset).normalize();
    mob.nextWanderAt = performance.now() + NEUTRAL_WANDER_INTERVAL_MS;
  }

  // ---------- neutral gray guardian: search / charge / attack, like the
  // allied gray mob, but bound to its moon crater (see updateNeutralGray).
  // (NEUTRAL_GRAY_SCAN_RANGE below is no longer used.) ----------
  let NEUTRAL_GRAY_SCAN_RANGE = 4 * Math.PI / 180;
  function neutralGrayVictims(self){
    const out = [];
    for (const m of neutralMobs.slice()){
      if (m !== self && (!self || m.kind !== self.kind)) out.push({ dir: m.dir, ref: m, isChar: false, list: neutralMobs });
    }
    for (let t = 0; t < 2; t++){
      const list = teamMobs(t);
      for (const m of list.slice()) out.push({ dir: m.dir, ref: m, isChar: false, list });
    }
    for (const ch of charTargets()) if (ch.alive) out.push({ dir: ch.dir, ref: ch, isChar: true, list: null });
    return out;
  }
  function neutralGrayTargetDir(mob){
    const t = mob.grayTarget;
    if (!t) return null;
    if (t.isChar) return t.ref.alive ? t.ref.dir : null;
    return t.list.indexOf(t.ref) !== -1 ? t.ref.dir : null;
  }
  // ---- neutral gray: the same three modes as the allied gray mob
  // (search -> charge -> attack), with the same scan radius, but tied to
  // its moon crater. Top priority, above every mode: if it is ever outside
  // the crater (once a charge in flight has finished rolling), it walks
  // straight back into the crater and is forced back into search mode.
  function neutralGrayInCrater(mob, dir){
    return angleBetween(mob.home.dir, dir || mob.dir) <= mob.home.radius;
  }
  function neutralGrayResetToSearch(mob){
    mob.chargeActive = false;
    mob.chargeSliding = false;
    mob.chargeHits = null;
    mob.chargeWindupUntil = 0;
    mob.grayTarget = null;
    mob.grayState = 'search';
    mob.rollAngle = 0;
  }
  // Search mode: same rule as the allied gray — within GRAY_MOB_SCAN_RANGE,
  // go for whoever stands in the thickest crowd; distance breaks ties.
  function neutralGrayPickTarget(mob){
    const inRange = neutralGrayVictims(mob).filter(v => angleBetween(mob.dir, v.dir) <= GRAY_MOB_SCAN_RANGE);
    if (!inRange.length) return null;
    let best = null, bestCount = -1, bestDist = Infinity;
    for (const cand of inRange){
      let count = 0;
      for (const other of inRange) if (angleBetween(cand.dir, other.dir) <= GRAY_MOB_CLUSTER_RADIUS) count++;
      const dist = angleBetween(mob.dir, cand.dir);
      if (count > bestCount || (count === bestCount && dist < bestDist)){ best = cand; bestCount = count; bestDist = dist; }
    }
    return best;
  }
  function neutralGrayEnterAttack(mob, now){
    neutralGrayResetToSearch(mob);
    mob.grayState = 'attack';
    mob.lastAttackAt = now; // the charge itself counts as this cycle's hit
  }
  function neutralGrayLaunchCharge(mob, tDir, now){
    const axis = new THREE.Vector3().crossVectors(mob.dir, tDir);
    if (axis.lengthSq() < 1e-12){ neutralGrayEnterAttack(mob, now); return; }
    // The line is locked in at launch, so the charge is dead straight.
    mob.chargeAxis = axis.normalize();
    mob.chargeRemaining = angleBetween(mob.dir, tDir) + GRAY_MOB_CHARGE_OVERSHOOT;
    mob.chargeSpeed = GRAY_MOB_CHARGE_SPEED;
    mob.chargeHits = new Set();
    mob.chargeActive = true;
    mob.chargeSliding = false;
  }
  function neutralGrayAdvanceCharge(mob, now){
    const speedNow = mob.chargeSpeed * frameSpeedScale;
    const step = mob.chargeSliding ? speedNow : Math.min(speedNow, mob.chargeRemaining);
    if (step > 1e-9){
      mob.dir = mob.dir.clone().applyAxisAngle(mob.chargeAxis, step).normalize();
      if (!mob.chargeSliding){
        mob.chargeRemaining -= step;
        mob.rollAngle += step * R / mobVisualRadius(mob);
      }
    }
    if (mob.chargeSliding){
      // Missed: coast to a halt, then attack mode (same as the allied gray).
      mob.chargeSpeed *= Math.pow(GRAY_MOB_SLIDE_FRICTION, frameSpeedScale);
      if (mob.chargeSpeed <= GRAY_MOB_SPEED) neutralGrayEnterAttack(mob, now);
      return;
    }
    // Clip mobs caught in the corridor on the way through.
    for (const v of neutralGrayVictims(mob)){
      if (v.isChar || mob.chargeHits.has(v.ref)) continue;
      if (angleBetween(mob.dir, v.dir) > GRAY_MOB_CHARGE_LINE_WIDTH) continue;
      mob.chargeHits.add(v.ref);
      damageMobInList(v.list, v.ref, GRAY_MOB_CHARGE_LINE_DAMAGE);
      if (v.list.indexOf(v.ref) !== -1) applyKnockback(v.ref, mob.dir, GRAY_MOB_CHARGE_LINE_KNOCKBACK);
    }
    const tDir = neutralGrayTargetDir(mob);
    if (tDir && angleBetween(mob.dir, tDir) <= GRAY_MOB_HIT_RADIUS){
      // The impact: everyone around the target, flung outward and stunned.
      const from = mob.dir.clone(), center = tDir.clone();
      mob.spinT = MOB_SPIN_DURATION;
      for (const v of neutralGrayVictims(mob)){
        if (angleBetween(center, v.dir) > GRAY_MOB_BLAST_RADIUS) continue;
        if (v.isChar){
          damageCharacter(v.ref, GRAY_MOB_BLAST_DAMAGE);
          if (v.ref.alive) v.ref.stunUntil = Math.max(v.ref.stunUntil || 0, now + GRAY_MOB_BLAST_STUN_MS);
          continue;
        }
        damageMobInList(v.list, v.ref, GRAY_MOB_BLAST_DAMAGE);
        if (v.list.indexOf(v.ref) === -1) continue;
        applyKnockback(v.ref, from, GRAY_MOB_BLAST_KNOCKBACK_MIN + Math.random() * (GRAY_MOB_BLAST_KNOCKBACK_MAX - GRAY_MOB_BLAST_KNOCKBACK_MIN));
        stunMob(v.ref, now, GRAY_MOB_BLAST_STUN_MS);
      }
      neutralGrayEnterAttack(mob, now);
      return;
    }
    if (mob.chargeRemaining <= 1e-9) mob.chargeSliding = true; // dodged: coast to a halt
  }
  // Idle ambling while searching, always inside the crater.
  function neutralGrayAmble(mob, now){
    if (!mob.wanderTarget || now >= mob.nextWanderAt || angleBetween(mob.dir, mob.wanderTarget) < 0.01 || !neutralGrayInCrater(mob, mob.wanderTarget)){
      const homeDir = mob.home.dir;
      let axis = new THREE.Vector3().crossVectors(homeDir, new THREE.Vector3(0, 1, 0));
      if (axis.lengthSq() < 1e-4) axis.set(1, 0, 0);
      axis.normalize();
      const bit = new THREE.Vector3().crossVectors(homeDir, axis).normalize();
      const ang = Math.random() * Math.PI * 2;
      const rad = Math.random() * mob.home.radius * 0.7;
      mob.wanderTarget = homeDir.clone().add(axis.multiplyScalar(Math.cos(ang) * rad)).add(bit.multiplyScalar(Math.sin(ang) * rad)).normalize();
      mob.nextWanderAt = now + NEUTRAL_WANDER_INTERVAL_MS;
    }
    const d = angleBetween(mob.dir, mob.wanderTarget);
    const step = Math.min(d, GRAY_MOB_SPEED * 0.6 * frameSpeedScale);
    if (d > 1e-6) mob.dir = slerpVec(mob.dir, mob.wanderTarget, step / d);
  }
  // Handles all of the neutral gray's movement every frame (always true).
  function updateNeutralGray(mob, now){
    // A charge already rolling always finishes its roll first.
    if (mob.chargeActive){ neutralGrayAdvanceCharge(mob, now); return true; }

    // TOP PRIORITY: outside the crater -> walk back in, forced search mode.
    if (mob.grayReturning || !neutralGrayInCrater(mob)){
      if (!mob.grayReturning){ neutralGrayResetToSearch(mob); mob.grayReturning = true; }
      const d = angleBetween(mob.dir, mob.home.dir);
      if (d > mob.home.radius * 0.7){
        mob.dir = computeMobStep(mob, mob.home.dir, GRAY_MOB_SPEED * frameSpeedScale);
        return true;
      }
      mob.grayReturning = false;
      mob.nextScanAt = now; // back inside: start searching straight away
    }

    if (mob.grayState === 'search'){
      if (now >= (mob.nextScanAt || 0)){
        mob.nextScanAt = now + GRAY_MOB_SCAN_INTERVAL_MS;
        const found = neutralGrayPickTarget(mob);
        if (found){
          mob.grayTarget = { ref: found.ref, isChar: found.isChar, list: found.list };
          mob.grayState = 'charge';
          mob.chargeWindupUntil = 0;
        }
      }
      if (mob.grayState === 'search'){ neutralGrayAmble(mob, now); return true; }
    }

    if (mob.grayState === 'charge'){
      const tDir = neutralGrayTargetDir(mob);
      if (!tDir || angleBetween(mob.dir, tDir) > GRAY_MOB_SCAN_RANGE){
        neutralGrayResetToSearch(mob);
        mob.nextScanAt = now + GRAY_MOB_SCAN_INTERVAL_MS;
        return true;
      }
      if (angleBetween(mob.dir, tDir) > GRAY_MOB_CHARGE_TRIGGER_RANGE){
        // Walks toward it, but never walks out of the crater on foot.
        const next = computeMobStep(mob, tDir, GRAY_MOB_SPEED * frameSpeedScale);
        if (!neutralGrayInCrater(mob, next)){
          neutralGrayResetToSearch(mob);
          mob.nextScanAt = now + GRAY_MOB_SCAN_INTERVAL_MS;
          return true;
        }
        mob.dir = next;
        mob.chargeWindupUntil = 0;
        return true;
      }
      // Close enough: stand dead still through the wind-up, then launch.
      if (!mob.chargeWindupUntil) mob.chargeWindupUntil = now + GRAY_MOB_CHARGE_WINDUP_MS;
      if (now >= mob.chargeWindupUntil) neutralGrayLaunchCharge(mob, tDir, now);
      return true;
    }

    // attack mode
    let nearest = null, nearestD = Infinity;
    for (const v of neutralGrayVictims(mob)){
      const d = angleBetween(mob.dir, v.dir);
      if (d <= GRAY_MOB_ATTACK_SEARCH_RANGE && d < nearestD){ nearestD = d; nearest = v; }
    }
    if (!nearest){
      neutralGrayResetToSearch(mob);
      mob.nextScanAt = now + GRAY_MOB_SCAN_INTERVAL_MS;
      return true;
    }
    if (nearestD > GRAY_MOB_RANGE){
      const next = computeMobStep(mob, nearest.dir, GRAY_MOB_SPEED * frameSpeedScale);
      if (!neutralGrayInCrater(mob, next)){
        // Can't reach it without leaving the crater: back to search mode.
        neutralGrayResetToSearch(mob);
        mob.nextScanAt = now + GRAY_MOB_SCAN_INTERVAL_MS;
        return true;
      }
      mob.dir = next;
    } else if (now - mob.lastAttackAt >= GRAY_MOB_COOLDOWN_MS){
      mob.lastAttackAt = now;
      mob.spinT = MOB_SPIN_DURATION;
      if (nearest.isChar) damageCharacter(nearest.ref, GRAY_MOB_ATTACK_DAMAGE);
      else damageMobInList(nearest.list, nearest.ref, GRAY_MOB_ATTACK_DAMAGE);
    }
    return true;
  }

  function spawnGreenLaser(fromDir, toDir, visualOnly){
    if (!visualOnly) netPushEvent('l' + encDir(fromDir) + encDir(toDir));
    const fromWorld = sphereGroup.localToWorld(fromDir.clone().multiplyScalar(R * 1.05));
    const toWorld = sphereGroup.localToWorld(toDir.clone().multiplyScalar(R * 1.02));
    const mid = fromWorld.clone().add(toWorld).multiplyScalar(0.5);
    const dist = fromWorld.distanceTo(toWorld);
    const geo = new THREE.CylinderGeometry(0.015, 0.015, Math.max(dist, 0.01), 6, 1, true);
    const mat = new THREE.MeshBasicMaterial({
      color: 0x6bffb0, transparent: true, opacity: 0.9,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(mid);
    mesh.quaternion.setFromUnitVectors(MOB_UP, toWorld.clone().sub(fromWorld).normalize());
    scene.add(mesh);
    meteorEffects.push({ type: 'laser', laserMesh: mesh, t: 0, duration: 0.18 });
  }

  function updateNeutralMobs(dt, now){
    // Black / green mobs no longer trickle out on a timer — they spawn
    // exactly once, when their crater / crystal is created (see
    // fireGiantMeteor / fireLightPillar).

    // Iterate a snapshot: neutral mobs can now kill each other mid-loop,
    // which would shift indices in the live array.
    const neutralSnapshot = neutralMobs.slice();
    for (let si = neutralSnapshot.length - 1; si >= 0; si--){
      const mob = neutralSnapshot[si];
      if (neutralMobs.indexOf(mob) === -1) continue; // already killed this frame
      if (mob.spinT > 0) mob.spinT -= dt;
      if (mob.laserT > 0) mob.laserT -= dt;
      // Being flung by a moon meteor overrides everything else.
      if (updateMobKnockback(mob)){
        updateAuraRingTransform(mob.auraRing, mob.dir, neutralAttackRange(mob));
        if (mob.hpBar) mob.hpBar.position.copy(mob.dir).multiplyScalar(R * 1.02 + mob.visualRadius + 0.12);
        continue;
      }
      // The crater's gray guardian runs its own charge brain; it only falls
      // through to ordinary ambling/returning home when nobody is near.
      if (mob.kind === 'gray' && updateNeutralGray(mob, now)){
        mob.dir = pushFreeEntityOutOfObstacles(mob.dir, 0);
        mob.mesh.position.copy(mob.dir).multiplyScalar(R * 1.02);
        applyGrayOrientation(mob);
        if (mob.spinT > 0) applyMobSpin(mob.mesh, mob.spinT);
        updateAuraRingTransform(mob.auraRing, mob.dir, neutralAttackRange(mob));
        if (mob.hpBar) mob.hpBar.position.copy(mob.dir).multiplyScalar(R * 1.02 + mob.visualRadius + 0.12);
        if (mob.hp <= 0){ const ri = neutralMobs.indexOf(mob); if (ri !== -1) removeNeutralMob(ri); }
        continue;
      }

      const hadTarget = !!mob.target;
      if (mob.kind === 'gray') mob.target = null; // it only ever fights by charging
      else {
        if (mob.target && !isNeutralTargetGone(mob.target)){
          // Ran too far away: stop chasing and go back to the landmark.
          const dT = angleBetween(mob.dir, refOf(mob.target));
          // (Never while the target is still standing inside the landmark itself.)
          const inHome = angleBetween(mob.home.dir, refOf(mob.target)) <= mob.home.radius;
          if (!inHome && dT > Math.max(NEUTRAL_CHASE_GIVEUP_RANGE, neutralAttackRange(mob))) mob.target = null;
        }
        if (!mob.target || isNeutralTargetGone(mob.target)) mob.target = findNeutralTarget(mob, mob.returning || hadTarget);
      }
      if (hadTarget && !mob.target) mob.returning = true; // lost it — head home

      let holdPosition = false;
      if (mob.target){
        mob.returning = false;
        const targetDir = refOf(mob.target);
        const d = angleBetween(mob.dir, targetDir);
        const range = neutralAttackRange(mob);
        if (d <= range){
          holdPosition = true;
        } else {
          const step = Math.min(d, neutralMoveSpeed(mob) * frameSpeedScale);
          mob.dir = slerpVec(mob.dir, targetDir, d > 1e-6 ? step / d : 0);
        }
      } else if (mob.returning){
        // Head straight back into the home zone before doing anything else.
        const d = angleBetween(mob.dir, mob.home.dir);
        if (d <= mob.home.radius){
          mob.returning = false; // arrived — settle into normal ambling
        } else {
          const step = Math.min(d, neutralMoveSpeed(mob) * frameSpeedScale);
          mob.dir = slerpVec(mob.dir, mob.home.dir, d > 1e-6 ? step / d : 0);
        }
      } else {
        // No intruder: wander lazily within the leash, never straying far.
        if (!mob.wanderTarget || now >= mob.nextWanderAt || angleBetween(mob.dir, mob.wanderTarget) < 0.02){
          pickNeutralWanderTarget(mob);
        }
        const d = angleBetween(mob.dir, mob.wanderTarget);
        const step = Math.min(d, neutralMoveSpeed(mob) * 0.6 * frameSpeedScale); // ambles, doesn't march
        if (d > 1e-6) mob.dir = slerpVec(mob.dir, mob.wanderTarget, step / d);
      }

      mob.dir = pushFreeEntityOutOfObstacles(mob.dir, 0);
      mob.mesh.position.copy(mob.dir).multiplyScalar(R * 1.02);
      mob.mesh.quaternion.setFromUnitVectors(MOB_UP, mob.dir);
      if (mob.spinT > 0) applyMobSpin(mob.mesh, mob.spinT);
      updateAuraRingTransform(mob.auraRing, mob.dir, neutralAttackRange(mob));

      if (mob.hpBar) mob.hpBar.position.copy(mob.dir).multiplyScalar(R * 1.02 + mob.visualRadius + 0.12);
      if (holdPosition && now - mob.lastAttackAt >= neutralCooldown(mob)){
        mob.lastAttackAt = now;
        if (mob.kind === 'gray'){
          // The crater's gray guardian: a slow, heavy single-target blow.
          mob.spinT = MOB_SPIN_DURATION;
          damageNeutralTargetRef(mob.target, GRAY_MOB_ATTACK_DAMAGE);
        } else if (mob.kind === 'black'){
          // Attack motion: the same spin every other mob uses.
          mob.spinT = MOB_SPIN_DURATION;
          // Area attack: hits everyone currently in range at once, not just
          // the one tracked target.
          const range = neutralAttackRange(mob);
          const dmg = BLACK_MOB_DAMAGE_MIN + Math.random() * (BLACK_MOB_DAMAGE_MAX - BLACK_MOB_DAMAGE_MIN);
          damageEntitiesNear(mob.dir, range, dmg, mob);
        } else {
          // Attack motion: firing the laser itself, not the generic spin.
          const dmg = GREEN_MOB_DAMAGE_MIN + Math.random() * (GREEN_MOB_DAMAGE_MAX - GREEN_MOB_DAMAGE_MIN);
          damageNeutralTargetRef(mob.target, dmg);
          mob.laserT = 0.18;
          spawnGreenLaser(mob.dir, refOf(mob.target));
        }
      }

      if (mob.hp <= 0){ const ri = neutralMobs.indexOf(mob); if (ri !== -1) removeNeutralMob(ri); continue; }
    }
  }

  // ---------- obstacle collision: keep mobs and characters/blue dot from
  // sitting inside a landmark or ice wall's "no territory" zone, which also
  // doubles as the pass/no-pass boundary (see updateCharacterMovement and
  // updateMobList) ----------
  // Nearest obstacle surface to `dir`, if `dir` is inside it (within
  // entityRadius + the obstacle's own radius) — otherwise null.
  function findObstaclePush(dir, entityRadius){
    let best = null;
    // Landmarks are no longer obstacles at all — just special-colored,
    // freely-walkable territory (see spawnLandmark) — so only ice walls
    // are checked here now.
    for (const wall of iceWalls){
      let nearestD = Infinity, nearestPt = null;
      for (const pt of wall.points){
        const dd = angleBetween(dir, pt);
        if (dd < nearestD){ nearestD = dd; nearestPt = pt; }
      }
      const minDist = wall.collisionRadius + entityRadius;
      if (nearestPt && nearestD < minDist && (!best || minDist - nearestD > best.overlap)){
        best = { center: nearestPt, overlap: minDist - nearestD, d: nearestD };
      }
    }
    return best;
  }
  // Free-roaming entities (mobs) just get shoved directly away from
  // whatever they're overlapping, continuously, every frame.
  function pushFreeEntityOutOfObstacles(dir, entityRadius){
    const push = findObstaclePush(dir, entityRadius);
    if (!push || push.d < 1e-6) return dir;
    return rotateAwayAlongArc(dir, push.center, push.overlap);
  }

  function isDirCollidingWithObstacle(dir, entityRadius){
    return !!findObstaclePush(dir, entityRadius);
  }

  const CHAR_COLLISION_RADIUS = CHAR_LOCAL_R;
  // Grid-vertex-locked entities (red dots, blue dot) instead jump straight
  // to the nearest open vertex — "pushed out along the lat/lon lines".
  // Uses the same collision-radius test as movement's stop check (not the
  // coarser territory-grid cell), so a character never gets parked exactly
  // on the boundary and then immediately re-blocked the instant it tries
  // to take a single step in any direction.
  function findNearestUnblockedVertex(lat, lon, entityRadius){
    const startV = { lat: nearestLat(lat), lon: nearestLon(lon) };
    const isSafe = (v) => !isDirCollidingWithObstacle(latLonDegToDir(v.lat, v.lon), entityRadius);
    if (isSafe(startV)) return startV;
    const li0 = latIndex(startV.lat), lo0 = lonIndex(startV.lon);
    const maxR = Math.max(ALLOWED_LATS.length, ALLOWED_LONS.length);
    for (let r = 1; r <= maxR; r++){
      for (let dli = -r; dli <= r; dli++){
        const li = li0 + dli;
        if (li < 0 || li >= ALLOWED_LATS.length) continue;
        if (Math.abs(dli) === r){
          for (let dlo = -r; dlo <= r; dlo++){
            const lo = ((lo0 + dlo) % ALLOWED_LONS.length + ALLOWED_LONS.length) % ALLOWED_LONS.length;
            const v = { lat: ALLOWED_LATS[li], lon: ALLOWED_LONS[lo] };
            if (isSafe(v)) return v;
          }
        } else {
          let lo = ((lo0 + r) % ALLOWED_LONS.length + ALLOWED_LONS.length) % ALLOWED_LONS.length;
          let v = { lat: ALLOWED_LATS[li], lon: ALLOWED_LONS[lo] };
          if (isSafe(v)) return v;
          lo = ((lo0 - r) % ALLOWED_LONS.length + ALLOWED_LONS.length) % ALLOWED_LONS.length;
          v = { lat: ALLOWED_LATS[li], lon: ALLOWED_LONS[lo] };
          if (isSafe(v)) return v;
        }
      }
    }
    return startV; // fully boxed in — shouldn't happen in practice
  }
  function pushCharacterOutIfBlocked(ch){
    if (!ch.alive) return;
    if (!isDirCollidingWithObstacle(ch.dir, CHAR_COLLISION_RADIUS)) return;
    const safe = findNearestUnblockedDir(ch.dir, CHAR_COLLISION_RADIUS);
    if (ch.moving) stopCharacterRun(ch, false); // its drawn path may cut through the new obstacle
    ch.dir = safe.clone();
    ch.mesh.position.copy(ch.dir).multiplyScalar(R * 1.02);
    ch.hpBar.position.copy(ch.dir).multiplyScalar(R * 1.02 + CHAR_LOCAL_R + 0.1);
    ch.label.position.copy(ch.dir).multiplyScalar(R * 1.02 + CHAR_LOCAL_R + 0.24);
  }
  function pushBlueDotOutIfBlocked(){
    if (!isDirCollidingWithObstacle(blueDot.dir, DOT_COLLISION_RADIUS)) return;
    const safe = findNearestUnblockedDir(blueDot.dir, DOT_COLLISION_RADIUS);
    blueDot.segFromDir = safe.clone();
    blueDot.dir = safe.clone();
    blueDot.mesh.position.copy(blueDot.dir).multiplyScalar(R * 1.02);
    if (blueDot.hpBar) blueDot.hpBar.position.copy(blueDot.dir).multiplyScalar(R * 1.02 + DOT_LOCAL_R + 0.1);

  // sitting inside it.

  // A mob's one-step move toward targetDir, steering around a landmark or
  // ice wall in the way instead of just stopping dead at it.
  function computeMobStep(mob, targetDir, maxStep){
    const d = angleBetween(mob.dir, targetDir);
    if (d < 1e-6) return mob.dir.clone();
    const baseStep = Math.min(d, maxStep);
    const direct = slerpVec(mob.dir, targetDir, baseStep / d);
    if (!isCellBlocked(dirToGridIdx(direct))) return direct;
    // Blocked — try swinging progressively wider around the current
    // position, alternating left/right, until a clear step is found.
    const detourAngles = [25, 50, 75, 100, 130, 160];
    for (const degAngle of detourAngles){
      const ang = degAngle * Math.PI / 180;
      for (const sign of [1, -1]){
        const candidate = direct.clone().applyAxisAngle(mob.dir, sign * ang).normalize();
        if (!isCellBlocked(dirToGridIdx(candidate))) return candidate;
      }
    }
    return mob.dir.clone(); // boxed in on all sides — hold position
  }

  const pillarEffects = [];
  const PILLAR_COLORS = [0x4da6ff, 0xff4d4d, 0xffe14d, 0x4dff88]; // blue, red, yellow, green
  function spawnLightPillarEffect(localDir, damage, onSettle, visualColorIdx){
    const visualOnly = visualColorIdx !== undefined;
    if (!visualOnly) damageEntitiesNear(localDir, 0.12, damage);
    const worldPos = sphereGroup.localToWorld(localDir.clone().multiplyScalar(R));
    const dirN = worldPos.clone().normalize();
    const geo = new THREE.CylinderGeometry(0.05, 0.1, 1.5, 14, 1, true);
    const colorIdx = visualOnly ? visualColorIdx : Math.floor(Math.random() * PILLAR_COLORS.length);

    if (!visualOnly) netPushEvent('p' + encDir(localDir) + enc1(colorIdx));
    const mat = new THREE.MeshBasicMaterial({
      color, transparent: true, opacity: 0.85, side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(worldPos).add(dirN.clone().multiplyScalar(0.55));
    mesh.quaternion.setFromUnitVectors(MOB_UP, dirN);
    scene.add(mesh);
    pillarEffects.push({ mesh, t: 0, duration: 0.5 });
    if (onSettle) setTimeout(onSettle, 480);
  }
  function updatePillarEffects(dt){
    for (let i = pillarEffects.length - 1; i >= 0; i--){
      const fx = pillarEffects[i];
      fx.t += dt;
      const p = Math.min(fx.t / fx.duration, 1);
      fx.mesh.material.opacity = 0.85 * (1 - p);
      fx.mesh.scale.set(1 + p * 0.35, 1, 1 + p * 0.35);
      if (p >= 1){
        scene.remove(fx.mesh);
        fx.mesh.geometry.dispose(); fx.mesh.material.dispose();
        pillarEffects.splice(i, 1);
      }
    }
  }

  // ---------- geometry helpers (angular / great-circle) ----------
  function angleBetween(a, b){
    return Math.acos(THREE.MathUtils.clamp(a.dot(b), -1, 1));
  }
  function buildAngularCum(dirs){
    const cum = [0];
    for (let i = 1; i < dirs.length; i++) cum.push(cum[i-1] + angleBetween(dirs[i-1], dirs[i]));
    return cum;
  }
  function slerpVec(a, b, t){
    const dot = THREE.MathUtils.clamp(a.dot(b), -1, 1);
    if (dot > 0.9995) return a.clone().lerp(b, t).normalize();
    const theta = Math.acos(dot) * t;
    const relative = b.clone().sub(a.clone().multiplyScalar(dot)).normalize();
    return a.clone().multiplyScalar(Math.cos(theta)).add(relative.multiplyScalar(Math.sin(theta)));
  }
  function pointAtAngularDistance(dirs, cum, d){
    if (d <= 0) return dirs[0].clone();
    const total = cum[cum.length - 1];
    if (d >= total) return dirs[dirs.length - 1].clone();
    let lo = 0, hi = cum.length - 1;
    while (lo < hi){
      const mid = (lo + hi) >> 1;
      if (cum[mid] < d) lo = mid + 1; else hi = mid;
    }
    const i = Math.max(1, lo);
    const segLen = cum[i] - cum[i-1];
    const t = segLen > 0 ? (d - cum[i-1]) / segLen : 0;
    return slerpVec(dirs[i-1], dirs[i], t);
  }
  function getRemainingPathPoints(ch){
    if (!ch.activePathLocal) return null;
    const startPt = pointAtAngularDistance(ch.activePathLocal, ch.cumAngular, ch.traveledAngular);
    let idx = ch.cumAngular.findIndex(c => c > ch.traveledAngular);
    if (idx === -1) return null;
    const pts = [startPt];
    for (let k = idx; k < ch.activePathLocal.length; k++) pts.push(ch.activePathLocal[k]);
    return pts;
  }

  // Closest point on the great-circle arc a→b to p, all unit vectors. Used
  // to find exactly where a route's yellow line passes under a character.
  const _arcN = new THREE.Vector3();
  const _arcProj = new THREE.Vector3();
  const _arcTmp = new THREE.Vector3();
  function closestPointOnArc(p, a, b){
    _arcN.crossVectors(a, b);
    const nLen = _arcN.length();
    if (nLen < 1e-9) return a.clone(); // a and b coincide — the arc is a point
    _arcN.divideScalar(nLen);
    // Drop p onto the arc's own great-circle plane.
    _arcProj.copy(p).addScaledVector(_arcN, -p.dot(_arcN));
    if (_arcProj.lengthSq() < 1e-12) return a.clone(); // p sits on that plane's pole
    _arcProj.normalize();
    // Inside the a→b span only if it's on the correct side of both ends.
    const insideA = _arcTmp.crossVectors(a, _arcProj).dot(_arcN) >= 0;
    const insideB = _arcTmp.crossVectors(_arcProj, b).dot(_arcN) >= 0;
    if (insideA && insideB) return _arcProj.clone();
    return angleBetween(p, a) <= angleBetween(p, b) ? a.clone() : b.clone();
  }

  // ---------- 2D screen-space helpers (for touch hit-testing only) ----------
  function dist2D(a, b){ const dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }
  function toScreen(worldVec){
    const v = worldVec.clone().project(camera);
    return { x: (v.x*0.5+0.5)*W, y: (1-(v.y*0.5+0.5))*H };
  }
  function worldPositionOf(mesh){
    const v = new THREE.Vector3();
    mesh.getWorldPosition(v);
    return v;
  }

  const raycaster = new THREE.Raycaster();
  function ndcFromScreen(x, y){
    return new THREE.Vector2((x / W) * 2 - 1, -(y / H) * 2 + 1);
  }
  function raycastSpherePoint(x, y){
    raycaster.setFromCamera(ndcFromScreen(x, y), camera);
    const hits = raycaster.intersectObject(sphereMesh);
    return hits.length ? hits[0].point.clone() : null;
  }
  function raycastSphereHit(x, y){
    raycaster.setFromCamera(ndcFromScreen(x, y), camera);
    const hits = raycaster.intersectObject(sphereMesh);
    return hits.length ? hits[0] : null;
  }

  // Extends `pathArr` in place, one grid step at a time, toward
  // (targetLat, targetLon) — always along a single grid line per step,
  // picking whichever axis (lat or lon) is further from the target.
  // Stepping back onto the vertex before the last one shrinks the path
  // instead of growing it, so dragging back over the path un-does it.
  // A landmark or ice wall doesn't stop the path from being *drawn*
  // through it — only from being *walked* through (see updateCharacterMovement).
  function growPathArray(pathArr, targetLat, targetLon){
    let guard = 0;
    while (guard++ < 64){
      const last = pathArr[pathArr.length - 1];
      if (last.lat === targetLat && last.lon === targetLon) break;
      const dLat = latIndex(targetLat) - latIndex(last.lat);
      const dLon = lonCircularDiffSteps(last.lon, targetLon);
      let next;
      if (Math.abs(dLat) >= Math.abs(dLon) && dLat !== 0){
        next = { lat: stepLat(last.lat, Math.sign(dLat)), lon: last.lon };
      } else if (dLon !== 0){
        next = { lat: last.lat, lon: stepLon(last.lon, Math.sign(dLon)) };
      } else break;
      const prev = pathArr[pathArr.length - 2];
      if (prev && prev.lat === next.lat && prev.lon === next.lon){
        pathArr.pop();
      } else {
        pathArr.push(next);
      }
    }
  }
  function growGridPathTo(targetLat, targetLon){
    growPathArray(drawingGridPath, targetLat, targetLon);
  }

  // Same single-step-at-a-time walk as growGridPathTo, but builds a whole
  // path between two known endpoints in one go (for "send character here").
  function buildGridPathBetween(fromV, toV){
    const path = [fromV];
    let guard = 0;
    while (guard++ < 400){
      const last = path[path.length - 1];
      if (last.lat === toV.lat && last.lon === toV.lon) break;
      const dLat = latIndex(toV.lat) - latIndex(last.lat);
      const dLon = lonCircularDiffSteps(last.lon, toV.lon);
      let next;
      if (Math.abs(dLat) >= Math.abs(dLon) && dLat !== 0){
        next = { lat: stepLat(last.lat, Math.sign(dLat)), lon: last.lon };
      } else if (dLon !== 0){
        next = { lat: last.lat, lon: stepLon(last.lon, Math.sign(dLon)) };
      } else break;
      path.push(next);
    }

  }

  // ---------- free-form routes: dots go anywhere, not just along the
  // lat/lon lines. A route is just an ordered list of unit vectors. ----------
  const ROUTE_MAX_SEG = 1.5 * Math.PI / 180;   // long legs are subdivided so the tube hugs the sphere
  const ROUTE_CMD_MAX_POINTS = 150;            // points sent with a drawn route (player 2 -> host)
  const ROUTE_NET_MAX_POINTS = 70;             // points echoed back in the snapshot
  function densifyRoute(pts){
    if (!pts || !pts.length) return [];
    const out = [pts[0].clone()];
    for (let i = 1; i < pts.length; i++){
      const a = pts[i-1], b = pts[i];
      const n = Math.max(1, Math.ceil(angleBetween(a, b) / ROUTE_MAX_SEG));
      for (let s = 1; s <= n; s++) out.push(slerpVec(a, b, s / n));
    }
    return out;
  }
  // Thins a route down to at most maxN points (always keeping both ends),
  // widening the minimum spacing until it fits.
  function simplifyRoute(pts, maxN){
    if (!pts || pts.length <= 2) return (pts || []).map(p => p.clone());
    let spacing = 0.6 * Math.PI / 180;
    for (let guard = 0; guard < 30; guard++){
      const kept = [pts[0]];
      for (let i = 1; i < pts.length - 1; i++){
        if (angleBetween(kept[kept.length - 1], pts[i]) >= spacing) kept.push(pts[i]);
      }
      kept.push(pts[pts.length - 1]);
      if (kept.length <= maxN) return kept.map(p => p.clone());
      spacing *= 1.5;
    }
    return [pts[0].clone(), pts[pts.length - 1].clone()];
  }
  // Starts `ch` walking along a free-form route. Shared by a drawn route
  // (either player's), and by "send here" from the radial menu.
  function commitFreeRoute(ch, pts){
    if (!ch || !ch.alive || !pts || !pts.length) return false;
    if (ch.moving) stopCharacterRun(ch, false);
    // The route always starts from wherever the dot actually is; if a
    // player's route arrives a moment late, bridge the gap straight across.
    let route = pts.map(p => p.clone().normalize());
    if (angleBetween(route[0], ch.dir) < 1 * Math.PI / 180) route[0] = ch.dir.clone();
    else route.unshift(ch.dir.clone());
    const densePts = densifyRoute(route);
    const cum = buildAngularCum(densePts);
    const total = cum[cum.length - 1] || 0;
    if (densePts.length < 2 || total < MIN_PATH_ANGULAR){
      ch.activePathLocal = null; ch.cumAngular = null;
      setCharPathTube(ch, null);
      ch.moving = false;
      return false;
    }
    ch.activePathLocal = densePts;
    ch.cumAngular = cum;
    ch.totalAngular = total;
    ch.traveledAngular = 0;

    ch.pathVer = ((ch.pathVer || 0) + 1) % 64;

  function setAbilityPathTube(points){
    if (abilityLineMesh){ sphereGroup.remove(abilityLineMesh); abilityLineMesh.geometry.dispose(); abilityLineMesh = null; }
    if (!points || points.length < 2) return;
    const scaled = points.map(p => p.clone().multiplyScalar(R * 1.017));
    const curve = new THREE.CatmullRomCurve3(scaled, false, 'catmullrom', 0.35);
    const tubularSegments = Math.max(12, scaled.length * 6);
    const geo = new THREE.TubeGeometry(curve, tubularSegments, PATH_TUBE_RADIUS * 0.9, 8, false);
    const mat = new THREE.MeshBasicMaterial({ color: ABILITY_LINE_COLOR, transparent: true, opacity: 0.9 });

  // The interior of whatever loop the drawn ability line closes, using the
  // same "wall vs. components" approach the territory-enclosure fill uses.
  function getAbilityEnclosedCells(ptsIn){
    const pts = ptsIn || abilityDrawDense;
    if (pts.length < 2) return null;
    const wall = new Set();
    for (const pt of pts) forEachCellInBrush(pt, BRUSH_ANGULAR, idx => wall.add(idx));
    if (wall.size === 0) return null;
    const components = computeGridComponents(wall);
    if (components.length < 2) return null; // line never closed a loop
    components.sort((a, b) => b.weight - a.weight);
    const outside = components[0];
    const totalWeight = components.reduce((s, c) => s + c.weight, 0);
    if (outside.weight < totalWeight * 0.5) return null;
    const cells = [];
    for (let i = 1; i < components.length; i++) for (const idx of components[i].cells) cells.push(idx);
    return cells.length ? cells : null;
  }

  // Somewhere nobody owns: an unclaimed cell whose whole impact circle is

  function pickMoonLandingDir(){
    let best = null, bestBad = Infinity;
    for (let k = 0; k < 80 && bestBad > 0; k++){
      const idx = dirToGridIdx(randomSphereDir());
      if (territoryGrid[idx] !== EMPTY || landmarkCellSet.has(idx)) continue;
      const d = cellIdxToDir(idx);
      let bad = 0;
      forEachCellInBrush(d, MOON_METEOR_CLEAR, (c) => { if (territoryGrid[c] !== EMPTY || landmarkCellSet.has(c)) bad++; });
      if (bad < bestBad){ best = d; bestBad = bad; }

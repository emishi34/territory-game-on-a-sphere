  const ABILITY_Z = new THREE.Vector3(0, 0, 1);
  const _abilityTmp = new THREE.Vector3();
  function isNightAtLocalDir(localDir){
    _abilityTmp.copy(localDir).applyMatrix4(sphereGroup.matrixWorld).normalize();
    return _abilityTmp.dot(sunDirNow) < 0; // same terminator the night shading uses (sunDirNow moves with the sun)
  }
  function placeCharacterAt(ch, dir){
    ch.dir.copy(dir);
    ch.mesh.position.copy(dir).multiplyScalar(R * 1.02);
    ch.hpBar.position.copy(dir).multiplyScalar(R * 1.02 + CHAR_LOCAL_R + 0.1);
    ch.label.position.copy(dir).multiplyScalar(R * 1.02 + CHAR_LOCAL_R + 0.24);
  }

  // ---------- A: farm outline (thin green border around A's farm ground) ----------
  const farmCanvas = document.createElement('canvas');
  farmCanvas.width = TERR_CANVAS_W; farmCanvas.height = TERR_CANVAS_H;
  const farmCtx = farmCanvas.getContext('2d');
  const farmTexture = new THREE.CanvasTexture(farmCanvas);
  farmTexture.generateMipmaps = false;
  farmTexture.minFilter = THREE.LinearFilter;
  farmTexture.magFilter = THREE.LinearFilter;
  const farmOutlineMesh = new THREE.Mesh(
    new THREE.SphereGeometry(R * 1.005, 64, 64),
    new THREE.MeshBasicMaterial({ map: farmTexture, transparent: true, depthWrite: false })
  );
  farmOutlineMesh.renderOrder = 1;
  sphereGroup.add(farmOutlineMesh);
  let lastFarmRebuildAt = 0;
  function rebuildFarmOutline(){
    farmCtx.clearRect(0, 0, TERR_CANVAS_W, TERR_CANVAS_H);
    const cw = TERR_CANVAS_W / GRID_W, chh = TERR_CANVAS_H / GRID_H;
    farmCtx.strokeStyle = '#27d13a';
    farmCtx.lineWidth = 2;
    farmCtx.beginPath();
    for (const idx of farmCells){
      if (!isFarmCell(idx)) continue;
      const gx = idx % GRID_W, gy = (idx / GRID_W) | 0;
      const x0 = gx * cw, y0 = gy * chh, x1 = x0 + cw, y1 = y0 + chh;
      const left = gy * GRID_W + (gx - 1 + GRID_W) % GRID_W;
      const right = gy * GRID_W + (gx + 1) % GRID_W;
      const up = gy > 0 ? idx - GRID_W : -1;
      const down = gy < GRID_H - 1 ? idx + GRID_W : -1;
      if (!isFarmCell(left)){ farmCtx.moveTo(x0, y0); farmCtx.lineTo(x0, y1); }
      if (!isFarmCell(right)){ farmCtx.moveTo(x1, y0); farmCtx.lineTo(x1, y1); }
      if (up < 0 || !isFarmCell(up)){ farmCtx.moveTo(x0, y0); farmCtx.lineTo(x1, y0); }
      if (down < 0 || !isFarmCell(down)){ farmCtx.moveTo(x0, y1); farmCtx.lineTo(x1, y1); }
    }
    farmCtx.stroke();
    farmTexture.needsUpdate = true;
  }

  // ---------- A: watermelon crops ----------
  const watermelonTexture = (() => {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 32;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#4fbf45';
    ctx.fillRect(0, 0, 64, 32);
    ctx.fillStyle = '#1c5a1e';
    for (let s = 0; s < 8; s++){
      for (let y = 0; y < 32; y++){
        const x = s * 8 + 2 + Math.sin(y * 0.55 + s) * 1.6;
        ctx.fillRect(x, y, 3, 1);
      }
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping;
    return tex;
  })();
  // Watermelons are rounded cubes (a square melon with soft corners).
  function makeRoundedBoxGeometry(half, round, seg){
    const g = new THREE.BoxGeometry(half * 2, half * 2, half * 2, seg, seg, seg);
    const p = g.attributes.position;
    const inner = half - round;
    const v = new THREE.Vector3(), c = new THREE.Vector3();
    for (let i = 0; i < p.count; i++){
      v.fromBufferAttribute(p, i);
      c.set(THREE.MathUtils.clamp(v.x, -inner, inner), THREE.MathUtils.clamp(v.y, -inner, inner), THREE.MathUtils.clamp(v.z, -inner, inner));
      v.sub(c);
      if (v.lengthSq() > 1e-12) v.normalize().multiplyScalar(round);
      v.add(c);
      p.setXYZ(i, v.x, v.y, v.z);
    }
    g.computeVertexNormals();
    return g;
  }
  const watermelonGeo = makeRoundedBoxGeometry(0.8, 0.28, 6);
  const watermelonMat = new THREE.MeshStandardMaterial({ map: watermelonTexture, roughness: 0.55, metalness: 0 });
  // Rainbow watermelon: a rare (1%) crop that heals far more.
  let RAINBOW_MELON_CHANCE = 0.01;
  let RAINBOW_MELON_HEAL = 250;
  let RAINBOW_MELON_MISSING = 100; // a rainbow melon goes to an ally down by at least this much HP
  const rainbowTexture = (() => {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 32;
    const ctx = c.getContext('2d');
    for (let x = 0; x < 64; x++){ ctx.fillStyle = 'hsl(' + Math.round(x / 64 * 360) + ',90%,58%)'; ctx.fillRect(x, 0, 1, 32); }
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    for (let s = 0; s < 8; s++){
      for (let y = 0; y < 32; y++){
        const x = s * 8 + 2 + Math.sin(y * 0.55 + s) * 1.6;
        ctx.fillRect(x, y, 2, 1);
      }
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping;
    return tex;
  })();
  const rainbowMelonMat = new THREE.MeshStandardMaterial({ map: rainbowTexture, roughness: 0.4, metalness: 0.1, emissive: 0x222222 });
  const crops = []; // { dir, cellIdx, mesh, progress, ripe }
  const MAX_CROPS = 200;
  function plantCrop(dir, cellIdx, team){
    const mesh = new THREE.Mesh(watermelonGeo, watermelonMat);
    mesh.quaternion.setFromUnitVectors(ABILITY_UP, dir);
    sphereGroup.add(mesh);
    const crop = { dir: dir.clone(), cellIdx, mesh, progress: 0, ripe: false, team: team || 0, rainbow: Math.random() < RAINBOW_MELON_CHANCE };
    crops.push(crop);
    layoutCrop(crop);
  }
  // Two stages only: a little sprout while it grows, then — the moment
  // it's ripe — a full-size watermelon ready to harvest.
  let sproutGeo = null, rainbowSproutGeo = null;
  const sproutMat = new THREE.MeshStandardMaterial({ color: 0x4ccf3a, roughness: 0.6, metalness: 0 });
  const rainbowSproutMat = new THREE.MeshStandardMaterial({ color: 0xffffff, vertexColors: true, roughness: 0.45, metalness: 0.05, emissive: 0x222222 });
  function getRainbowSproutGeo(){
    if (rainbowSproutGeo) return rainbowSproutGeo;
    const g = getSproutGeo().clone();
    const p = g.attributes.position;
    const cols = new Float32Array(p.count * 3);
    const c = new THREE.Color();
    for (let i = 0; i < p.count; i++){
      c.setHSL(((p.getX(i) + 0.55) / 1.1 + p.getY(i) * 0.6) % 1, 0.9, 0.58);
      cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
    }
    g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
    rainbowSproutGeo = g;
    return g;
  }
  function getSproutGeo(){
    if (sproutGeo) return sproutGeo;
    const stem = new THREE.CylinderGeometry(0.05, 0.07, 0.55, 8); stem.translate(0, 0.275, 0);
    const leafL = new THREE.SphereGeometry(1, 10, 8); leafL.scale(0.3, 0.06, 0.16); leafL.rotateZ(0.35); leafL.translate(-0.24, 0.55, 0);
    const leafR = new THREE.SphereGeometry(1, 10, 8); leafR.scale(0.3, 0.06, 0.16); leafR.rotateZ(-0.35); leafR.translate(0.24, 0.55, 0);
    sproutGeo = mergeGeometries([stem, leafL, leafR]);
    return sproutGeo;
  }
  function applyCropLook(mesh, dir, ripe, rainbow){
    const fullR = R * CROP_RADIUS * 0.85;
    if (ripe){
      const mat = rainbow ? rainbowMelonMat : watermelonMat;
      if (mesh.geometry !== watermelonGeo || mesh.material !== mat){ mesh.geometry = watermelonGeo; mesh.material = mat; }
      mesh.scale.setScalar(fullR);
      mesh.position.copy(dir).multiplyScalar(R * 1.02 + fullR * 0.55);
    } else {
      const g = rainbow ? getRainbowSproutGeo() : getSproutGeo();
      if (mesh.geometry !== g){ mesh.geometry = g; mesh.material = rainbow ? rainbowSproutMat : sproutMat; }
      mesh.scale.setScalar(fullR * 0.9);
      mesh.position.copy(dir).multiplyScalar(R * 1.02);
    }
  }
  function layoutCrop(crop){
    applyCropLook(crop.mesh, crop.dir, crop.ripe, crop.rainbow);
  }
  function removeCrop(i){
    sphereGroup.remove(crops[i].mesh);
    crops.splice(i, 1);
  }
  function updateCrops(dt){
    for (let i = crops.length - 1; i >= 0; i--){
      const crop = crops[i];
      // The farm ground under it was lost (eroded, cleared...) — so is the crop.
      if (farmTeam(crop.cellIdx) !== crop.team){ removeCrop(i); continue; }
      if (!crop.ripe){
        // Grows by a count: +1.2/sec by day, +0.8/sec by night (defaults),
        // ripe at 20. crop.progress stays the 0..1 fraction of that.
        const rate = isNightAtLocalDir(crop.dir) ? CROP_NIGHT_RATE : CROP_DAY_RATE;
        crop.progress += (dt * rate) / Math.max(0.1, CROP_GROW_COUNT);
        if (crop.progress >= 1){ crop.progress = 1; crop.ripe = true; layoutCrop(crop); }
      }
    }
  }

  // ---------- A: watermelon stock label ("スイカN個" above the HP bar) ----------
  function makeStockLabelSprite(){
    const c = document.createElement('canvas');
    c.width = 192; c.height = 48;
    const ctx = c.getContext('2d');
    const tex = new THREE.CanvasTexture(c);
    tex.generateMipmaps = false;
    tex.minFilter = THREE.LinearFilter;
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, depthWrite: false, transparent: true }));
    spr.scale.set(0.5, 0.125, 1);
    spr.renderOrder = 999;
    spr._canvas = c; spr._ctx = ctx; spr._tex = tex; spr._shown = -1;
    return spr;
  }
  function refreshStockLabel(ch){
    const spr = ch.stockLabel;
    const n = ch.watermelons || 0;
    spr.visible = ch.alive && n > 0;
    if (spr._shown === n) return;
    spr._shown = n;
    const c = spr._canvas, ctx = spr._ctx;
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.font = 'bold 26px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(0,0,0,0.75)';

    ctx.fillText('スイカ' + n + '個', c.width / 2, c.height / 2 + 1);

  // ---------- A: throwing watermelons to heal hurt allies ----------
  const watermelonThrows = []; // { mesh, from, target, t, duration }
  function isHealTargetAlive(target){
    return target.role ? target.alive : (pinkMobs.indexOf(target) !== -1 || blueMobs.indexOf(target) !== -1);
  }
  function pickHealTarget(farmer){
    let best = null, bestFrac = Infinity;
    const consider = (t) => {
      if (t.maxHp - t.hp < WATERMELON_HEAL_MISSING) return; // only allies down by 50+ HP
      if (angleBetween(farmer.dir, t.dir) > WATERMELON_THROW_RANGE) return;
      const frac = t.hp / t.maxHp; // lowest remaining HP gets priority
      if (frac < bestFrac){ bestFrac = frac; best = t; }
    };
    for (const ch of characters) if (ch !== farmer && ch.alive && ch.team === farmer.team) consider(ch);
    for (const m of teamMobs(farmer.team)) consider(m);
    return best;
  }
  function healTarget(target, amount){
    const healed = Math.min(target.maxHp - target.hp, amount);
    if (healed <= 0) return;
    target.hp += healed;
    if (target.role){
      updateHPBarSprite(target.hpBar, target.hp / target.maxHp);
      spawnFloatingNumber(target.dir, CHAR_LOCAL_R, healed, '#3dff6e');
    } else {
      target.mesh.material.color.copy(target.baseColor).lerp(MOB_DAMAGED_COLOR, 1 - target.hp / target.maxHp);
      if (target.hpBar) updateHPBarSprite(target.hpBar, target.hp / target.maxHp);
      spawnFloatingNumber(target.dir, mobVisualRadius(target), healed, '#3dff6e');
    }
  }
  function throwWatermelon(farmer, target, rainbow){
    const mesh = new THREE.Mesh(watermelonGeo, rainbow ? rainbowMelonMat : watermelonMat);
    mesh.scale.setScalar(R * CROP_RADIUS * 0.6);
    sphereGroup.add(mesh);
    netPushEvent('w' + encDir(farmer.dir) + encDir(target.dir) + (rainbow ? '1' : '0'));
    watermelonThrows.push({ mesh, from: farmer.dir.clone(), target, t: 0, duration: 0.45, heal: rainbow ? RAINBOW_MELON_HEAL : WATERMELON_HEAL });
  }
  // Rainbow melons go to allies hurt badly enough to use them (or when
  // it's all that's left in stock).
  function shouldUseRainbow(total, rainbow, target){
    if (rainbow <= 0) return false;
    return rainbow >= total || (target.maxHp - target.hp) >= RAINBOW_MELON_MISSING;
  }
  function updateWatermelonThrows(dt){
    for (let i = watermelonThrows.length - 1; i >= 0; i--){
      const w = watermelonThrows[i];
      if (!isHealTargetAlive(w.target)){
        sphereGroup.remove(w.mesh); watermelonThrows.splice(i, 1); continue;
      }
      w.t += dt;
      const p = Math.min(1, w.t / w.duration);
      const d = slerpVec(w.from, w.target.dir, p).normalize();
      w.mesh.position.copy(d).multiplyScalar(R * 1.04 + Math.sin(Math.PI * p) * 0.35);
      w.mesh.rotation.x += dt * 10;
      if (p >= 1){
        healTarget(w.target, w.heal || WATERMELON_HEAL);
        sphereGroup.remove(w.mesh);
        watermelonThrows.splice(i, 1);
      }
    }
  }

  function updateFarmer(ch, dt, now){
    if (!ch.stockLabel){
      ch.stockLabel = makeStockLabelSprite();
      ch.watermelons = 0;
      ch.nextThrowAt = 0;
      sphereGroup.add(ch.stockLabel);
    }
    if (!ch.alive){ ch.stockLabel.visible = false; return; }
    // Harvest a ripe watermelon underfoot.
    if (ch.watermelons < WATERMELON_MAX_STOCK){
      for (let i = crops.length - 1; i >= 0; i--){
        const crop = crops[i];
        if (crop.team === ch.team && crop.ripe && angleBetween(crop.dir, ch.dir) <= CROP_RADIUS){
          if (crop.rainbow) ch.rainbowMelons = (ch.rainbowMelons || 0) + 1;
          removeCrop(i);
          ch.watermelons++;
          break;
        }
      }
    }
    // Plant a seed underfoot, on farm ground, where no other seed's circle overlaps.
    const idx = dirToGridIdx(ch.dir);
    if (farmTeam(idx) === ch.team && crops.reduce((n, c) => n + (c.team === ch.team ? 1 : 0), 0) < MAX_CROPS){
      let clear = true;
      for (const crop of crops){
        if (angleBetween(crop.dir, ch.dir) < CROP_RADIUS * 2){ clear = false; break; }
      }
      if (clear) plantCrop(ch.dir, idx, ch.team);
    }
    // Throw one to the most-hurt ally in range.
    if (ch.watermelons > 0 && now >= ch.nextThrowAt){
      const target = pickHealTarget(ch);
      if (target){
        const rb = shouldUseRainbow(ch.watermelons, ch.rainbowMelons || 0, target);
        if (rb) ch.rainbowMelons--;
        ch.watermelons--;
        throwWatermelon(ch, target, rb);
        ch.nextThrowAt = now + WATERMELON_THROW_INTERVAL_MS;
      }
    }
    ch.stockLabel.position.copy(ch.dir).multiplyScalar(R * 1.02 + CHAR_LOCAL_R + 0.38);
    refreshStockLabel(ch);
  }

  // ================= 畑陣地: farmer mobs and scarecrow mobs =================
  // Farm ground (A's reinforced ground, green-outlined) has its own spawn
  // table: farmer mob 99% / gold (silver) 1%. A new patch of farm also
  // brings one scarecrow that guards and tends that farm.
  let FARM_GOLD_CHANCE = 0.01;
  let FARM_FARMER_CHANCE = 0.80; // the rest (19%) is an ordinary pink / blue mob
  let WATERMELON_HEAL_MISSING = 50; // only allies missing at least this much HP get a melon
  let FARMER_MOB_HP = 100;
  let FARMER_MOB_SPEED = 0.08 * Math.PI / 180;
  let FARMER_MOB_SENSE = 10 * Math.PI / 180;
  let FARMER_MOB_THROW_MS = 1800;
  let FARMER_MOB_MASS = 1;
  let FARMER_MAX_STOCK = 3;  // harvests up to this many; once full it follows an ally and hands them out
  let SCARECROW_HP = 150;
  let SCARECROW_SPEED = 0.08 * Math.PI / 180;
  let SCARECROW_DMG_MIN = 11, SCARECROW_DMG_MAX = 18;
  let SCARECROW_COOLDOWN_MS = 1100;
  let SCARECROW_RANGE = 9 * Math.PI / 180;
  let SCARECROW_PLANT_MS = 1500; // plants at most once per this long
  let SCARECROW_MASS = 3;
  let SCARECROW_FARM_REGEN = 1; // HP per second while standing on its farm
  const SCARECROW_SIZE_MULT = 2.5; // between the big pink mob (2) and the black mob (3)

  // A fixed planting lattice over the whole globe, laid out as a square
  // grid: the globe is split into the 6 faces of a cube, and on each face
  // the points sit on two sets of straight lines (great circles) crossing
  // at right angles, one seed-width apart — so seeds line up both across
  // and down. (Spacing is exact near a face's middle and tightens slightly
  // toward its corners; points that would overlap a neighbour are simply
  // skipped there.)
  function cropLatticeSpacing(){ return CROP_RADIUS * 2 * 1.02; }
  const LATTICE_FACES = [
    [new THREE.Vector3( 1, 0, 0), new THREE.Vector3(0, 0, -1), new THREE.Vector3(0, 1, 0)],
    [new THREE.Vector3(-1, 0, 0), new THREE.Vector3(0, 0,  1), new THREE.Vector3(0, 1, 0)],
    [new THREE.Vector3(0,  1, 0), new THREE.Vector3(1, 0,  0), new THREE.Vector3(0, 0, -1)],
    [new THREE.Vector3(0, -1, 0), new THREE.Vector3(1, 0,  0), new THREE.Vector3(0, 0,  1)],
    [new THREE.Vector3(0, 0,  1), new THREE.Vector3(1, 0,  0), new THREE.Vector3(0, 1,  0)],
    [new THREE.Vector3(0, 0, -1), new THREE.Vector3(-1, 0, 0), new THREE.Vector3(0, 1,  0)],
  ];
  function snapToLattice(dir){
    const s = cropLatticeSpacing();
    const ax = Math.abs(dir.x), ay = Math.abs(dir.y), az = Math.abs(dir.z);
    const f = (ax >= ay && ax >= az) ? (dir.x > 0 ? 0 : 1) : (ay >= az ? (dir.y > 0 ? 2 : 3) : (dir.z > 0 ? 4 : 5));
    const [n, ea, eb] = LATTICE_FACES[f];
    const dn = dir.dot(n);
    const lim = Math.floor((Math.PI / 4) / s);
    const i = THREE.MathUtils.clamp(Math.round(Math.atan(dir.dot(ea) / dn) / s), -lim, lim);
    const j = THREE.MathUtils.clamp(Math.round(Math.atan(dir.dot(eb) / dn) / s), -lim, lim);
    return { key: f * 1000000 + (i + 500) * 1000 + (j + 500), dir: latticePointDir(f, i, j), f, i, j, lim };
  }
  function latticePointDir(f, i, j){
    const s = cropLatticeSpacing();
    const [n, ea, eb] = LATTICE_FACES[f];
    return n.clone().addScaledVector(ea, Math.tan(i * s)).addScaledVector(eb, Math.tan(j * s)).normalize();
  }
  // The lattice grouped into 2x2 squares (fixed, non-overlapping: each
  // starts on an even row and column). A scarecrow plants one whole square
  // — its four corners — at a time. Only squares whose four corners all lie
  // on this scarecrow's farm count.
  function farmLatticeBlocks(mob){
    const seen = new Map();
    for (const idx of mob.farm){
      const pt = snapToLattice(cellIdxToDir(idx));
      const bi = Math.floor(pt.i / 2) * 2, bj = Math.floor(pt.j / 2) * 2;
      const key = pt.f * 1000000 + (bi + 500) * 1000 + (bj + 500);
      if (seen.has(key)) continue;
      seen.set(key, null);
      if (bi + 1 > pt.lim || bi < -pt.lim || bj + 1 > pt.lim || bj < -pt.lim) continue;
      const corners = [[bi, bj], [bi + 1, bj], [bi, bj + 1], [bi + 1, bj + 1]].map(([i, j]) => latticePointDir(pt.f, i, j));
      if (!corners.every(d => mob.farm.has(dirToGridIdx(d)))) continue;
      const center = corners.reduce((a, d) => a.add(d), new THREE.Vector3()).normalize();
      seen.set(key, { center, corners });
    }
    return [...seen.values()].filter(Boolean);
  }
  function blockHasRoom(b){ return b.corners.some(isPlantableSpot); }
  function isPlantableSpot(dir){
    for (const crop of crops) if (angleBetween(crop.dir, dir) < CROP_RADIUS * 2) return false;
    return true;
  }
  function teamCropCount(t){ let n = 0; for (const c of crops) if (c.team === t) n++; return n; }

  // ---- farmer mob ----
  const farmerTextures = [0, 1].map(t => {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 32;
    const ctx = c.getContext('2d');
    ctx.fillStyle = t === 0 ? '#' + PINK_MOB_COLOR.getHexString() : '#' + BLUE_MOB_COLOR.getHexString();
    ctx.fillRect(0, 0, 64, 32);
    ctx.fillStyle = '#1c6a22';
    for (let s = 0; s < 6; s++){
      for (let y = 0; y < 32; y++){
        const x = s * 10.7 + 3 + Math.sin(y * 0.55 + s) * 1.8;
        ctx.fillRect(x, y, 3, 1);
      }
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping;
    return tex;
  });
  function makeFarmerMobMesh(t){
    return new THREE.Mesh(
      new THREE.ConeGeometry(MOB_LOCAL_R, MOB_LOCAL_R * 2.1, 3),
      new THREE.MeshBasicMaterial({ color: 0xffffff, map: farmerTextures[t] })
    );
  }
  function spawnFarmerMob(t, dir){
    const list = teamMobs(t);
    if (list.length >= MAX_MOBS_PER_TEAM) return;
    const mesh = makeFarmerMobMesh(t);
    mesh.position.copy(dir).multiplyScalar(R * 1.02);
    mesh.quaternion.setFromUnitVectors(MOB_UP, dir);
    sphereGroup.add(mesh);
    const auraRing = makeAuraRing(t === 0 ? 0xff5a9e : 0x5ad0ff);
    updateAuraRingTransform(auraRing, dir, FARMER_MOB_SENSE);
    sphereGroup.add(auraRing);
    list.push({
      team: t === 0 ? 'pink' : 'blue', isBig: false, isGold: false, isGray: false, isFarmer: true,
      mesh, auraRing, hpBar: null, baseColor: mesh.material.color.clone(), dir: dir.clone(),
      hp: FARMER_MOB_HP, maxHp: FARMER_MOB_HP, netId: takeMobNetId(),
      targetKind: null, target: null, nextRetargetAt: 0, lastAttackAt: -999, spinT: 0, erodeProgress: 0,
      kbRemaining: 0, kbCenter: null, stunUntil: 0,
      melons: 0, throwing: false, nextThrowAt: 0
    });
  }
  // Out of melons after handing them out: it's an ordinary pink / blue mob
  // from now on (keeps its HP).
  function farmerBecomesNormal(mob, t){
    mob.isFarmer = false;
    mob.melons = 0; mob.rainbow = 0;
    mob.mesh.material.dispose();
    mob.mesh.material = new THREE.MeshBasicMaterial({ color: (t === 0 ? PINK_MOB_COLOR : BLUE_MOB_COLOR).clone() });
    mob.baseColor = mob.mesh.material.color.clone();
    mob.mesh.material.color.copy(mob.baseColor).lerp(MOB_DAMAGED_COLOR, 1 - mob.hp / mob.maxHp);
    mob.targetKind = null; mob.target = null; mob.nextRetargetAt = 0;
  }
  function pickMobHealTarget(mob, t){
    let best = null, bestFrac = Infinity;
    for (const m of teamMobs(t)){
      if (m.maxHp - m.hp < WATERMELON_HEAL_MISSING) continue;
      if (angleBetween(mob.dir, m.dir) > FARMER_MOB_SENSE) continue;
      const f = m.hp / m.maxHp;
      if (f < bestFrac){ bestFrac = f; best = m; }
    }
    return best;
  }
  function updateFarmerMob(mob, list, i, isPink, dt, now){
    const t = isPink ? 0 : 1;
    // Harvesting phase: pick up a ripe melon it is standing on.
    if (!mob.throwing && mob.melons < FARMER_MAX_STOCK){
      for (let k = crops.length - 1; k >= 0; k--){
        const c = crops[k];
        if (c.team === t && c.ripe && angleBetween(c.dir, mob.dir) <= CROP_RADIUS){
          if (c.rainbow) mob.rainbow = (mob.rainbow || 0) + 1;
          removeCrop(k); mob.melons++;
          if (mob.melons >= FARMER_MAX_STOCK) mob.throwing = true;
          break;
        }
      }
    }
    // Full stack (3): hand melons out to hurt allies nearby.
    if (mob.throwing && mob.melons > 0 && now >= mob.nextThrowAt){
      const target = pickMobHealTarget(mob, t);
      if (target){
        const rb = shouldUseRainbow(mob.melons, mob.rainbow || 0, target);
        if (rb) mob.rainbow--;
        mob.melons--;
        throwWatermelon(mob, target, rb);
        mob.nextThrowAt = now + FARMER_MOB_THROW_MS;
        if (mob.melons <= 0){ farmerBecomesNormal(mob, t); return; }
      }
    }
    // Where to walk.
    let goal = null;
    if (!mob.throwing){
      // Below a full stack: go for the nearest ripe melon, however far.
      // (The sense range is only for choosing who to throw melons to.)
      let best = null, bestD = Infinity;
      for (const c of crops){
        if (c.team !== t || !c.ripe) continue;
        const d = angleBetween(mob.dir, c.dir);
        if (d < bestD){ bestD = d; best = c; }
      }
      if (best) goal = best.dir;
    }
    if (!goal && mob.throwing){
      // Tag along with the nearest ally that isn't a farmer or a scarecrow.
      let best = null, bestD = Infinity;
      for (const m of list){
        if (m === mob || m.isFarmer || m.isScarecrow) continue;
        const d = angleBetween(mob.dir, m.dir);
        if (d < bestD){ bestD = d; best = m; }
      }
      if (best && bestD > mobVisualRadius(best) / R + 3 * Math.PI / 180) goal = best.dir;
    }
    // (No melon in sight and not full yet: it just stays put.)
    if (goal) mob.dir = computeMobStep(mob, goal, FARMER_MOB_SPEED * frameSpeedScale);
    mob.dir = pushFreeEntityOutOfObstacles(mob.dir, 0);
    mob.mesh.position.copy(mob.dir).multiplyScalar(R * 1.02);
    mob.mesh.quaternion.setFromUnitVectors(MOB_UP, mob.dir);
    if (mob.spinT > 0) applyMobSpin(mob.mesh, mob.spinT);
    updateAuraRingTransform(mob.auraRing, mob.dir, FARMER_MOB_SENSE);
  }

  // ---- scarecrow mob ----
  // Cone hat, ball head, an upright post and a crossbar, all one mesh
  // (merged by hand) so it tints and spins like every other mob.
  function mergeGeometries(parts){
    let total = 0;
    const flat = parts.map(g => { const n = g.index ? g.toNonIndexed() : g; total += n.attributes.position.count; return n; });
    const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3);
    let o = 0;
    for (const g of flat){
      pos.set(g.attributes.position.array, o * 3);
      nor.set(g.attributes.normal.array, o * 3);
      o += g.attributes.position.count;
    }
    const out = new THREE.BufferGeometry();
    out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    return out;
  }
  function makeScarecrowMesh(t){
    const h = MOB_LOCAL_R * SCARECROW_SIZE_MULT * 2.4; // overall height
    const post = new THREE.CylinderGeometry(h * 0.045, h * 0.045, h * 0.62, 10); post.translate(0, h * 0.31, 0);
    const bar = new THREE.CylinderGeometry(h * 0.04, h * 0.04, h * 0.66, 10); bar.rotateZ(Math.PI / 2); bar.translate(0, h * 0.42, 0);
    const head = new THREE.SphereGeometry(h * 0.15, 16, 12); head.translate(0, h * 0.66, 0);
    const hat = new THREE.ConeGeometry(h * 0.2, h * 0.3, 16); hat.translate(0, h * 0.85, 0);
    const geo = mergeGeometries([post, bar, head, hat]);
    const col = t === 0 ? 0xe600c8 : 0x19b8e6;
    return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: col, roughness: 0.55, metalness: 0.05 }));
  }
  function spawnScarecrow(t, farmCellsNew){
    const list = teamMobs(t);
    if (list.length >= MAX_MOBS_PER_TEAM || !farmCellsNew.length) return;
    const idx = farmCellsNew[Math.floor(Math.random() * farmCellsNew.length)];
    const dir = cellIdxToDir(idx);
    const mesh = makeScarecrowMesh(t);
    mesh.position.copy(dir).multiplyScalar(R * 1.02);
    mesh.quaternion.setFromUnitVectors(MOB_UP, dir);
    sphereGroup.add(mesh);
    const auraRing = makeAuraRing(t === 0 ? 0xff5a9e : 0x5ad0ff);
    updateAuraRingTransform(auraRing, dir, SCARECROW_RANGE);
    sphereGroup.add(auraRing);
    const mob = {
      team: t === 0 ? 'pink' : 'blue', isBig: false, isGold: false, isGray: false, isScarecrow: true,
      mesh, auraRing, hpBar: null, baseColor: mesh.material.color.clone(), dir: dir.clone(),
      hp: SCARECROW_HP, maxHp: SCARECROW_HP, netId: takeMobNetId(),
      targetKind: null, target: null, nextRetargetAt: 0, lastAttackAt: -999, spinT: 0, erodeProgress: 0,
      kbRemaining: 0, kbCenter: null, stunUntil: 0,
      farm: new Set(), farmCheckAt: 0, wanderTarget: null, nextPlantAt: 0, lattice: [], plantSpot: null, plantBlock: null
    };
    scarecrowRefreshFarm(mob, t, idx);
    list.push(mob);
  }
  // The farm = the connected patch of this team's farm ground around `seed`.
  function farmComponentFrom(seed, t){
    const out = new Set();
    if (farmTeam(seed) !== t) return out;
    const stack = [seed];
    out.add(seed);
    while (stack.length){
      const idx = stack.pop();
      const gx = idx % GRID_W, gy = (idx / GRID_W) | 0;
      const nb = [gy * GRID_W + (gx + 1) % GRID_W, gy * GRID_W + (gx - 1 + GRID_W) % GRID_W];
      if (gy > 0) nb.push(idx - GRID_W);
      if (gy < GRID_H - 1) nb.push(idx + GRID_W);
      for (const n of nb){
        if (!out.has(n) && farmTeam(n) === t){ out.add(n); stack.push(n); }
      }
    }
    return out;
  }
  // Re-reads the scarecrow's farm. If it got split, it keeps the piece
  // nearest to itself; if none of it is left, returns false (it vanishes).
  function scarecrowRefreshFarm(mob, t, seed){
    if (seed !== undefined){ mob.farm = farmComponentFrom(seed, t); return mob.farm.size > 0; }
    let best = -1, bestD = Infinity;
    for (const idx of mob.farm){
      if (farmTeam(idx) !== t) continue;
      const d = angleBetween(mob.dir, cellIdxToDir(idx));
      if (d < bestD){ bestD = d; best = idx; }
    }
    if (best === -1){ mob.farm = new Set(); return false; }
    // Also takes in farm ground newly joined onto it.
    mob.farm = farmComponentFrom(best, t);
    return mob.farm.size > 0;
  }
  function randomFarmCell(mob){
    let k = Math.floor(Math.random() * mob.farm.size);
    for (const idx of mob.farm){ if (k-- <= 0) return idx; }
    return null;
  }
  function nearestFarmDir(mob){
    let best = null, bestD = Infinity;
    for (const idx of mob.farm){
      const d = cellIdxToDir(idx);
      const a = angleBetween(mob.dir, d);
      if (a < bestD){ bestD = a; best = d; }
    }
    return best;
  }
  // Farm ground taken by the enemy: remembered for a few seconds so the
  // scarecrow of that farm can rush over.
  const farmRaids = []; // { dir, team, at }
  function noteFarmRaid(idx, team){
    const now = performance.now();
    const dir = cellIdxToDir(idx);
    for (const r of farmRaids) if (r.team === team && angleBetween(r.dir, dir) < 3 * Math.PI / 180){ r.at = now; return; }
    farmRaids.push({ dir, idx, team, at: now });
    if (farmRaids.length > 40) farmRaids.shift();
  }
  function scarecrowEnemies(t, fn){
    const e = 1 - t;
    for (const m of teamMobs(e)) fn(m, false);
    for (const ch of charTargets()) if (ch.alive && ch.team === e) fn(ch, true);
  }
  function updateScarecrowMob(mob, list, i, isPink, dt, now){
    const t = isPink ? 0 : 1;
    if (now >= mob.farmCheckAt || farmDirty){
      mob.farmCheckAt = now + 500;
      if (!scarecrowRefreshFarm(mob, t)){ removeMob(list, i); return; } // its farm is gone
      mob.lattice = farmLatticeBlocks(mob);
      if (farmDirty) mob.skipSpots = null; // the farm changed: give every spot another chance
    }
    const hereIdx = dirToGridIdx(mob.dir);
    const inFarm = mob.farm.has(hereIdx);
    // On farm ground: +1 HP every second (only while hurt).
    if (farmTeam(hereIdx) === t && mob.hp < mob.maxHp){
      if (!mob.nextRegenAt) mob.nextRegenAt = now + 1000;
      else if (now >= mob.nextRegenAt){ mob.nextRegenAt += 1000; healTarget(mob, SCARECROW_FARM_REGEN); }
    } else mob.nextRegenAt = 0;
    // Spin attack: every enemy within range, whenever one is there.
    let enemyNear = false;
    scarecrowEnemies(t, (x) => { if (angleBetween(mob.dir, x.dir) <= SCARECROW_RANGE) enemyNear = true; });
    if (enemyNear && now - mob.lastAttackAt >= SCARECROW_COOLDOWN_MS){
      mob.lastAttackAt = now;
      mob.spinT = MOB_SPIN_DURATION;
      const hits = [];
      scarecrowEnemies(t, (x, isChar) => { if (angleBetween(mob.dir, x.dir) <= SCARECROW_RANGE) hits.push([x, isChar]); });
      for (const [x, isChar] of hits){
        const dmg = SCARECROW_DMG_MIN + Math.random() * (SCARECROW_DMG_MAX - SCARECROW_DMG_MIN);
        if (isChar) damageCharacter(x, dmg);
        else damageMobInList(teamMobs(1 - t), x, dmg);
      }
    }
    let goal = null;
    // A raid on its farm in the last few seconds: go there.
    for (let k = farmRaids.length - 1; k >= 0; k--){
      const r = farmRaids[k];
      if (now - r.at > 5000){ farmRaids.splice(k, 1); continue; }
      if (r.team !== t) continue;
      // Was it this farm? (a neighbouring cell still belongs to it)
      const gx = r.idx % GRID_W, gy = (r.idx / GRID_W) | 0;
      let mine = false;
      for (let dy = -2; dy <= 2 && !mine; dy++) for (let dx = -2; dx <= 2 && !mine; dx++){
        const y = gy + dy; if (y < 0 || y >= GRID_H) continue;
        if (mob.farm.has(y * GRID_W + (gx + dx + GRID_W) % GRID_W)) mine = true;
      }
      if (mine){ goal = r.dir; break; }
    }
    if (!inFarm && !goal) goal = nearestFarmDir(mob); // strayed out: head back in
    // Neat squares: walk to the middle of the nearest 2x2 lattice square
    // on the farm that still has room, and plant all four corners at once
    // (at most once every SCARECROW_PLANT_MS).
    if (!goal && teamCropCount(t) < MAX_CROPS){
      if (!mob.plantBlock || !blockHasRoom(mob.plantBlock) || !mob.farm.has(dirToGridIdx(mob.plantBlock.center))){

        for (const b of mob.lattice){
          if (!blockHasRoom(b)) continue;
          if (mob.skipSpots && mob.skipSpots.some(x => angleBetween(x, b.center) < 1e-3)) continue; // couldn't reach it earlier
          const a = angleBetween(mob.dir, b.center);
          if (a < bestD){ bestD = a; mob.plantBlock = b; mob.plantSpot = b.center; }
        }
      }
      if (mob.plantSpot){
        if (angleBetween(mob.dir, mob.plantSpot) < 0.3 * Math.PI / 180){
          if (now >= mob.nextPlantAt){
            for (const d of mob.plantBlock.corners){
              if (teamCropCount(t) >= MAX_CROPS) break;
              const idx = dirToGridIdx(d);
              if (farmTeam(idx) === t && isPlantableSpot(d)) plantCrop(d, idx, t);
            }

        }
        if (!goal){
          // standing on its spot: don't wander off
          mob.dir = pushFreeEntityOutOfObstacles(mob.dir, 0);
          mob.mesh.position.copy(mob.dir).multiplyScalar(R * 1.02);
          mob.mesh.quaternion.setFromUnitVectors(MOB_UP, mob.dir);
          if (mob.spinT > 0) applyMobSpin(mob.mesh, mob.spinT, MOB_UP);
          updateAuraRingTransform(mob.auraRing, mob.dir, SCARECROW_RANGE);

    }
    if (!goal){
      // Wander the farm, favouring spots with room for a seed.
      if (!mob.wanderTarget || !mob.farm.has(dirToGridIdx(mob.wanderTarget)) || angleBetween(mob.dir, mob.wanderTarget) < 0.01){
        mob.wanderTarget = null;
        for (let tries = 0; tries < 12; tries++){
          const idx = randomFarmCell(mob);
          if (idx === null) break;

    }

  // ---------- B: one-way ✕ marks. Stepping on one throws you to the exact

  // ✕ itself is used up in the process. ----------
  const tunnelHoles = []; // { dir, mesh, exempt: character|null }
  const holeTexture = (() => {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    const ctx = c.getContext('2d');

    ctx.lineWidth = 9;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(10, 10); ctx.lineTo(54, 54);

    const d = dir.clone().normalize();
    const mesh = new THREE.Mesh(holeGeo, holeMat);
    mesh.position.copy(d).multiplyScalar(R * 1.014);

    mesh.renderOrder = 4;
    sphereGroup.add(mesh);
    // If B is standing on it the moment it opens, B alone gets to step off
    // this new mark once without being sent through it.
    const standing = ch && angleBetween(ch.dir, d) <= HOLE_RADIUS;

  function digTunnelAt(ch, where){

    // just where anyone stepping on this mark comes out. Skipped if it
    // would overlap a mark that's already there (e.g. B just keeps standing
    // on the one it already opened).
    const here = where.clone().normalize();
    if (holeNear(here)) return;
    // Only MAX_TUNNEL_MARKS may exist at once; the oldest gives way so a
    // freshly closed loop always gets its mark.
    const team = ch ? ch.team : 0;

  // ---------- B's second way of opening a tunnel: walking a full loop, so

  // only the stretch B has ALREADY walked, so the ✕ lands on a loop it
  // genuinely closed rather than somewhere its route merely will go. ------
  // The part of `ch`'s committed route it has already covered, from the
  // start up to `upToArc` radians along it.
  function getTraveledPathPoints(ch, upToArc){
    if (!ch.activePathLocal || !ch.cumAngular || upToArc <= 0) return null;
    const pts = [];
    for (let k = 0; k < ch.activePathLocal.length; k++){

  // route that merely curves back alongside itself never returns a point,
  // however tightly it bends. The two must also meet at a decent angle —
  // near-parallel arcs are the path running alongside itself, not crossing.
  function arcsIntersect(a1, a2, b1, b2){
    const nA = new THREE.Vector3().crossVectors(a1, a2);
    const nB = new THREE.Vector3().crossVectors(b1, b2);
    if (nA.lengthSq() < 1e-14 || nB.lengthSq() < 1e-14) return null;
    nA.normalize(); nB.normalize();
    if (Math.abs(nA.dot(nB)) > Math.cos(PATH_CROSS_MIN_ANGLE)) return null; // too shallow to be a crossing
    const line = new THREE.Vector3().crossVectors(nA, nB);
    if (line.lengthSq() < 1e-14) return null;
    line.normalize();
    for (const q of [line, line.clone().negate()]){

  // Where B's route genuinely crosses the part of itself it already walked.
  // The step it took this frame is tested against every earlier segment; the

  // line, which is exactly the moment B passes over it.
  function findRouteCrossing(ch){
    if (!ch.moving || !ch.activePathLocal || !ch.cumAngular) return null;
    const prev = ch._prevCrossDir;
    if (!prev) return null;
    if (angleBetween(prev, ch.dir) < 1e-9) return null; // standing still
    const walked = getTraveledPathPoints(ch, ch.traveledAngular - PATH_CROSS_SELF_SKIP_ARC);
    if (!walked || walked.length < 2) return null;
    for (let i = 1; i < walked.length; i++){

  function updateTunnelerCrossings(ch){

    // same intersection is still reported on the following frame.
    if (crossPt && !ch._onRouteCrossing) digTunnelAt(ch, crossPt);

  function warpCharacter(ch, dir){

  }

      // side and makes its way back to its own landmark from there.

      else { mob.target = null; mob.wanderTarget = null; mob.returning = true; }

  }
  // Standing on the mark? Then the destination is the exact opposite point
  // of the globe (which carries no mark of its own).
  function holeDestination(hole, dir){
    return angleBetween(dir, hole.dir) <= HOLE_RADIUS ? hole.dir.clone().negate() : null;
  }
  function updateTunnelWarps(){

      if (hole.exempt && (!hole.exempt.alive || !holeDestination(hole, hole.exempt.dir))) hole.exempt = null;

      // every dot (both teams), the other team's mobs, and neutral mobs.
      let used = false;

  }

  // ---------- C: werewolf (night side only) ----------
  function isWerewolfActive(ch){

  }
  // One set of ears + aura per team (red for pink's C, blue for cyan's C).

  const _earPos = new THREE.Vector3(), _earUp = new THREE.Vector3(), _earRight = new THREE.Vector3(), _earFwd = new THREE.Vector3(), _earMat4 = new THREE.Matrix4();

  function updateWerewolfEars(ch){

  // ================= 赤い点B【リロードの能力】 =================

  let BSEG_HP = 300;

  let B_RELAY_MS = 3000;          // hand-off interval (= B1's attack frequency)
  let B_ATTACK_RANGE = 10 * Math.PI / 180;

  const BSEG_COUNT = 5;           // B2, B3, B4, B5, tail
  const BSEG_R = CHAR_LOCAL_R * 0.75;

    const first = (CHAR_LOCAL_R + BSEG_R + 0.035) / R;

  function makeAuraSprite(team){

    const rgb = team === 0 ? ['255,20,20', '230,0,0', '200,0,0'] : ['20,90,255', '0,60,230', '0,40,200'];
    const cv = document.createElement('canvas');

    const ctx = cv.getContext('2d');
    const g = ctx.createRadialGradient(64, 64, 6, 64, 64, 64);

    g.addColorStop(0.55, `rgba(${rgb[1]},0.6)`);
    g.addColorStop(0.8, `rgba(${rgb[2]},0.25)`);

  const bCordMat = new THREE.MeshBasicMaterial({ color: 0x1a1a1a });

  function makeBSegMesh(k, team){
    if (k === BSEG_COUNT - 1){

  }
  // Set up the chain for a B character (both on the host and on player 2's page).
  function ensureBChain(ch){
    if (ch.bsegs) return;
    ch.bHist = [];      // head positions, newest first
    ch.bHistLen = [];   // cumulative arc length from the newest
    ch.bBall = false;   // B1 holds a ball
    ch.bAura = makeAuraSprite(ch.team);
    ch.bRelayAt = 0;
    ch.bsegs = [];
    for (let k = 0; k < BSEG_COUNT; k++){
      const mesh = makeBSegMesh(k, ch.team);

      hpBar.scale.multiplyScalar(0.7);

        isBSeg: true, owner: ch, k, team: ch.team, role: 'Bseg',
        dir: ch.dir.clone(), hp: BSEG_HP, maxHp: BSEG_HP, alive: false,
        mesh, hpBar, aura: makeAuraSprite(ch.team), ball: false, reviveAt: 0, stunUntil: 0

    }
    ch.bCords = [];
    for (let k = 0; k < BSEG_COUNT; k++){
      const c = new THREE.Mesh(bCordGeo, bCordMat);

      ch.bCords.push(c);

  }
  // A straight line of history trailing behind the head, so the chain has
  // somewhere to stand before the head has walked anywhere.
  function resetBHistory(ch){
    const d = ch.dir.clone().normalize();
    let a = new THREE.Vector3().crossVectors(d, new THREE.Vector3(0, 1, 0));
    if (a.lengthSq() < 1e-6) a.set(1, 0, 0);

  function pushBHistory(ch){
    const head = ch.dir;

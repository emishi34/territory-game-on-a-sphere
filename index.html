    mob.kbRemaining -= step;
    mob.dir = rotateAwayAlongArc(mob.dir, mob.kbCenter, step);
    mob.dir = pushFreeEntityOutOfObstacles(mob.dir, 0);
    mob.mesh.position.copy(mob.dir).multiplyScalar(R * 1.02 + knockbackHopHeight(mob.kbTotal, mob.kbRemaining));
    mob.mesh.quaternion.setFromUnitVectors(MOB_UP, mob.dir);
    return true;
  }
  function damagePinkMobRef(target, dmg){
    const i = pinkMobs.indexOf(target);
    if (i === -1) return;
    spawnFloatingNumber(target.dir, mobVisualRadius(target), dmg, '#ff3030');
    target.hp -= dmg;
    if (target.hp <= 0){ removeMob(pinkMobs, i); return; }
    target.mesh.material.color.copy(target.baseColor).lerp(MOB_DAMAGED_COLOR, 1 - target.hp / target.maxHp);
    if (target.hpBar) updateHPBarSprite(target.hpBar, target.hp / target.maxHp);
  }

  // ---------- gray mob AI ----------
  // Everything the gray mob counts as an enemy: every pink-side mob (normal,
  // big, gold, and the allied black/green ones all live in pinkMobs) plus the
  // red dots. Iterates a copy, since callbacks routinely kill what they hit.
  // A gray mob fights for its own team: its enemies are every mob of the
  // other team plus the other team's dots. Iterates a copy, since
  // callbacks routinely kill what they hit.
  function grayEnemyList(mob){ return teamMobs(1 - mobTeamIdx(mob)); }
  function forEachGrayEnemy(mob, fn){
    const e = 1 - mobTeamIdx(mob);
    const mobs = teamMobs(e).slice();
    for (const m of mobs) fn(m.dir, m, false);
    for (const ch of charTargets()) if (ch.alive && ch.team === e) fn(ch.dir, ch, true);
  }
  function damageMobInList(list, target, dmg){
    const i = list.indexOf(target);
    if (i === -1) return;
    spawnFloatingNumber(target.dir, mobVisualRadius(target), dmg, '#ff3030');
    target.hp -= dmg;
    if (target.hp <= 0){ if (list === neutralMobs) removeNeutralMob(i); else removeMob(list, i); return; }
    target.mesh.material.color.copy(target.baseColor).lerp(MOB_DAMAGED_COLOR, 1 - target.hp / target.maxHp);
    if (target.hpBar) updateHPBarSprite(target.hpBar, target.hp / target.maxHp);
  }
  function grayTargetDir(mob){
    const t = mob.grayTarget;
    if (!t) return null;
    if (t.isChar) return t.ref.alive ? t.ref.dir : null;
    return grayEnemyList(mob).indexOf(t.ref) !== -1 ? t.ref.dir : null;
  }
  // Sweeps the scan radius and picks whoever is standing in the thickest
  // crowd — the denser the knot, the more the blast is worth. Distance only
  // breaks ties.
  function grayPickTarget(mob){
    const inRange = [];
    forEachGrayEnemy(mob, (dir, ref, isChar) => {
      if (angleBetween(mob.dir, dir) <= GRAY_MOB_SCAN_RANGE) inRange.push({ dir, ref, isChar });
    });
    if (!inRange.length) return null;
    let best = null, bestCount = -1, bestDist = Infinity;
    for (const cand of inRange){
      let count = 0;
      for (const other of inRange){
        if (angleBetween(cand.dir, other.dir) <= GRAY_MOB_CLUSTER_RADIUS) count++;
      }
      const dist = angleBetween(mob.dir, cand.dir);
      if (count > bestCount || (count === bestCount && dist < bestDist)){
        best = cand; bestCount = count; bestDist = dist;
      }
    }
    return best;
  }
  function grayLaunchCharge(mob, targetDir){
    const axis = new THREE.Vector3().crossVectors(mob.dir, targetDir);
    if (axis.lengthSq() < 1e-12){ grayEnterAttack(mob, performance.now()); return; }
    // The line is locked in at launch — rotating about this fixed axis is
    // what makes the charge dead straight even if the target sidesteps.
    mob.chargeAxis = axis.normalize();
    mob.chargeRemaining = angleBetween(mob.dir, targetDir) + GRAY_MOB_CHARGE_OVERSHOOT;
    mob.chargeSpeed = GRAY_MOB_CHARGE_SPEED;
    mob.chargeHits = new Set(); // each victim is clipped at most once per charge
    mob.chargeActive = true;
    mob.chargeSliding = false;
  }
  function grayEnterAttack(mob, now){
    mob.chargeActive = false;
    mob.chargeSliding = false;
    mob.chargeHits = null;
    mob.chargeWindupUntil = 0;
    mob.grayTarget = null;
    mob.grayState = 'attack';
    mob.lastAttackAt = now; // the charge itself counts as this cycle's hit
  }
  // Anything caught in the corridor on the way through: hurt, shoved aside,
  // and left behind as the gray mob rolls on.
  function grayClipAlongCharge(mob){
    const foes = grayEnemyList(mob);
    forEachGrayEnemy(mob, (dir, ref, isChar) => {
      if (mob.chargeHits.has(ref)) return;
      if (angleBetween(mob.dir, dir) > GRAY_MOB_CHARGE_LINE_WIDTH) return;
      mob.chargeHits.add(ref);
      if (isChar) return; // the spec's line damage is against mobs only
      damageMobInList(foes, ref, GRAY_MOB_CHARGE_LINE_DAMAGE);
      if (foes.indexOf(ref) !== -1) applyKnockback(ref, mob.dir, GRAY_MOB_CHARGE_LINE_KNOCKBACK);
    });
  }
  // The impact: the target and everyone around it, flung radially outward
  // from the gray mob and locked up briefly.
  function grayBlast(mob, centerDir, now){
    const from = mob.dir.clone();
    const foes = grayEnemyList(mob);
    forEachGrayEnemy(mob, (dir, ref, isChar) => {
      if (angleBetween(centerDir, dir) > GRAY_MOB_BLAST_RADIUS) return;
      if (isChar){
        // Red dots plant their feet — no knockback, but still stunned.
        damageCharacter(ref, GRAY_MOB_BLAST_DAMAGE);
        if (ref.alive) ref.stunUntil = Math.max(ref.stunUntil || 0, now + GRAY_MOB_BLAST_STUN_MS);
        return;
      }
      damageMobInList(foes, ref, GRAY_MOB_BLAST_DAMAGE);
      if (foes.indexOf(ref) === -1) return; // it died to the blast
      const kb = GRAY_MOB_BLAST_KNOCKBACK_MIN + Math.random() * (GRAY_MOB_BLAST_KNOCKBACK_MAX - GRAY_MOB_BLAST_KNOCKBACK_MIN);
      applyKnockback(ref, from, kb);
      stunMob(ref, now, GRAY_MOB_BLAST_STUN_MS);
    });
  }
  function grayAdvanceCharge(mob, now){
    const speedNow = mob.chargeSpeed * frameSpeedScale;
    const step = mob.chargeSliding ? speedNow : Math.min(speedNow, mob.chargeRemaining);
    if (step > 1e-9){
      mob.dir = mob.dir.clone().applyAxisAngle(mob.chargeAxis, step).normalize();
      mob.dir = pushFreeEntityOutOfObstacles(mob.dir, 0);
      if (!mob.chargeSliding){
        mob.chargeRemaining -= step;
        // Rolling, not sliding: a body this size turns this much over that arc.
        mob.rollAngle += step * R / mobVisualRadius(mob);
      }
    }
    if (mob.chargeSliding){
      // Missed — it stops rolling and coasts to a halt.
      mob.chargeSpeed *= Math.pow(GRAY_MOB_SLIDE_FRICTION, frameSpeedScale);
      if (mob.chargeSpeed <= GRAY_MOB_SPEED) grayEnterAttack(mob, now);
      return;
    }
    grayClipAlongCharge(mob);
    const tDir = grayTargetDir(mob);
    if (tDir && angleBetween(mob.dir, tDir) <= GRAY_MOB_HIT_RADIUS){
      grayBlast(mob, tDir, now);
      grayEnterAttack(mob, now);
      return;
    }
    if (mob.chargeRemaining <= 1e-9) mob.chargeSliding = true; // dodged
  }
  // Returns true when the gray mob has handled its own movement this frame.
  // Only search mode returns false, letting it fall through to the ordinary
  // blue-mob behaviour (wander, erode, swipe at whatever is close).
  function updateGrayMob(mob, dt, now){
    if (mob.grayState === 'charge' && mob.chargeActive){ grayAdvanceCharge(mob, now); return true; }

    if (mob.grayState === 'search'){
      if (now < mob.nextScanAt) return false;
      mob.nextScanAt = now + GRAY_MOB_SCAN_INTERVAL_MS;
      const found = grayPickTarget(mob);
      if (!found) return false;
      mob.grayTarget = { ref: found.ref, isChar: found.isChar };
      mob.grayState = 'charge';
      mob.chargeWindupUntil = 0;
      return false; // walks normally until the next frame picks up the chase
    }

    if (mob.grayState === 'charge'){
      const tDir = grayTargetDir(mob);
      if (!tDir){ // target died or vanished before it could connect
        mob.grayState = 'search';
        mob.grayTarget = null;
        mob.rollAngle = 0; // search mode draws it upright, so don't leave a roll hanging
        mob.nextScanAt = now + GRAY_MOB_SCAN_INTERVAL_MS;
        return false;
      }
      if (angleBetween(mob.dir, tDir) > GRAY_MOB_CHARGE_TRIGGER_RANGE){
        mob.dir = computeMobStep(mob, tDir, GRAY_MOB_SPEED * frameSpeedScale);
        mob.chargeWindupUntil = 0;
        return true;
      }
      // Close enough: stand dead still through the wind-up, then launch.
      if (!mob.chargeWindupUntil) mob.chargeWindupUntil = now + GRAY_MOB_CHARGE_WINDUP_MS;
      if (now >= mob.chargeWindupUntil) grayLaunchCharge(mob, tDir);
      return true;
    }

    // attack mode
    let nearest = null, nearestD = Infinity;
    forEachGrayEnemy(mob, (dir, ref, isChar) => {
      const d = angleBetween(mob.dir, dir);
      if (d <= GRAY_MOB_ATTACK_SEARCH_RANGE && d < nearestD){ nearestD = d; nearest = { dir, ref, isChar }; }
    });
    if (!nearest){
      mob.grayState = 'search';
      mob.rollAngle = 0;
      mob.nextScanAt = now + GRAY_MOB_SCAN_INTERVAL_MS;
      return false;
    }
    if (nearestD > GRAY_MOB_RANGE){
      mob.dir = computeMobStep(mob, nearest.dir, GRAY_MOB_SPEED * frameSpeedScale);
    } else if (now - mob.lastAttackAt >= GRAY_MOB_COOLDOWN_MS){
      mob.lastAttackAt = now;
      mob.spinT = MOB_SPIN_DURATION;
      if (nearest.isChar) damageCharacter(nearest.ref, GRAY_MOB_ATTACK_DAMAGE);
      else damageMobInList(grayEnemyList(mob), nearest.ref, GRAY_MOB_ATTACK_DAMAGE);
    }
    return true;
  }
  // Standing upright on the surface, with the roll of a charge on top.
  function applyGrayOrientation(mob){
    mob.mesh.quaternion.setFromUnitVectors(MOB_UP, mob.dir);
    if (mob.rollAngle && mob.chargeAxis){
      mob.mesh.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(mob.chargeAxis, mob.rollAngle));
    }
  }

  function updateMobList(list, isPink, dt, now){
    const enemyList = isPink ? blueMobs : pinkMobs;
    const isEnemyColor = isTeamTerritory[isPink ? 1 : 0];
    for (let i = list.length - 1; i >= 0; i--){
      const mob = list[i];

      if (mob.spinT > 0) mob.spinT -= dt;

      // Being flung takes precedence over anything the mob wants to do, and
      // a stunned mob does nothing at all until it wears off.
      const sliding = updateMobKnockback(mob);
      if (sliding || now < (mob.stunUntil || 0)){
        updateAuraRingTransform(mob.auraRing, mob.dir, mobAuraRange(mob));
        if (mob.hpBar) mob.hpBar.position.copy(mob.dir).multiplyScalar(R * 1.02 + mobVisualRadius(mob) + 0.12);
        if (mob.spinT > 0) applyMobSpin(mob.mesh, mob.spinT);
        continue;
      }
      // The gray mob runs its own brain. It only falls through to the
      // ordinary blue-mob behaviour below while it's searching and hasn't
      // locked onto a crowd yet.
      if (mob.isPurple){ updatePurpleMob(mob, list, i, isPink, dt, now); continue; }
      if (mob.isFarmer){ updateFarmerMob(mob, list, i, isPink, dt, now); continue; }
      if (mob.isScarecrow){ updateScarecrowMob(mob, list, i, isPink, dt, now); continue; }
      if (mob.isGray && updateGrayMob(mob, dt, now)){
        mob.dir = pushFreeEntityOutOfObstacles(mob.dir, 0);
        mob.mesh.position.copy(mob.dir).multiplyScalar(R * 1.02);
        applyGrayOrientation(mob);
        if (mob.spinT > 0) applyMobSpin(mob.mesh, mob.spinT);
        updateAuraRingTransform(mob.auraRing, mob.dir, mobAuraRange(mob));
        if (mob.hpBar) mob.hpBar.position.copy(mob.dir).multiplyScalar(R * 1.02 + mobVisualRadius(mob) + 0.12);
        continue;
      }

      // An enemy unit within range takes over as the target once the mob
      // is free to react — but an erosion already in progress is allowed
      // to finish first, rather than being cut off mid-way.
      const isBusyEroding = mob.targetKind === 'territory' && mob.erodeProgress > 0;
      const aggro = isBusyEroding ? null : findAggroTarget(mob);
      if (aggro){
        mob.targetKind = aggro.kind;
        mob.target = aggro.target;
      } else if (!isBusyEroding){
        const targetGone =
          (mob.targetKind === 'mob' && enemyList.indexOf(mob.target) === -1) ||
          (mob.targetKind === 'char' && !mob.target.alive) ||
          (mob.targetKind === 'dot' && !blueDot.active) ||
          (mob.targetKind === 'neutral' && neutralMobs.indexOf(mob.target) === -1);
        if (mob.targetKind === null || targetGone || now >= mob.nextRetargetAt){
          retargetMob(mob);
          mob.nextRetargetAt = now + MOB_RETARGET_INTERVAL_MS;
        }
      }

      const targetDir = targetDirOf(mob);
      const range = mobAuraRange(mob);
      let holdPosition = false;
      if (targetDir){
        const d = mob.targetKind === 'neutral' ? neutralEdgeDist(mob, mob.target) : angleBetween(mob.dir, targetDir);
        if ((mob.targetKind === 'mob' || mob.targetKind === 'char' || mob.targetKind === 'dot' || mob.targetKind === 'neutral') && d <= range) holdPosition = true;
        if (mob.targetKind === 'territory' && d <= range * 0.6) holdPosition = true;
        if (!holdPosition){
          mob.dir = computeMobStep(mob, targetDir, mobSpeed(mob) * frameSpeedScale);
        }
        // Continuously shove the mob back out if it's still overlapping a
        // landmark or ice wall (e.g. one just appeared under it).
        // Same boundary as characters: no extra padding for the mob's own
        // size, so "can't walk here" lines up exactly with "can't be
        // anyone's territory here".
        mob.dir = pushFreeEntityOutOfObstacles(mob.dir, 0);
        mob.mesh.position.copy(mob.dir).multiplyScalar(R * 1.02);
        // Base "standing on the surface" orientation first; a spin in
        // progress is then composed on top of it, not instead of it.
        mob.mesh.quaternion.setFromUnitVectors(MOB_UP, mob.dir);
      }
      if (mob.spinT > 0) applyMobSpin(mob.mesh, mob.spinT);
      updateAuraRingTransform(mob.auraRing, mob.dir, range);
      if (mob.hpBar) mob.hpBar.position.copy(mob.dir).multiplyScalar(R * 1.02 + mobVisualRadius(mob) + 0.12);

      if (holdPosition && (mob.targetKind === 'mob' || mob.targetKind === 'char' || mob.targetKind === 'dot' || mob.targetKind === 'neutral') && now - mob.lastAttackAt >= mobAttackCooldown(mob)){
        mob.lastAttackAt = now;
        mob.spinT = MOB_SPIN_DURATION;
        const dmg = mobDamageRoll(mob);
        if (mob.targetKind === 'neutral'){
          damageNeutralMobRef(mob.target, dmg);
        } else if (mob.isBoss){
          // Area attack: hits every red dot and pink mob within range at
          // once, not just the one tracked target.
          damageEnemiesNear(mobTeamIdx(mob), mob.dir, mobAuraRange(mob), dmg);
        } else if (mob.targetKind === 'char'){
          damageCharacter(mob.target, dmg);
        } else if (mob.targetKind === 'dot'){
          damageBlueDot(dmg);
        } else {
          const oi = enemyList.indexOf(mob.target);
          if (oi !== -1){
            const enemy = enemyList[oi];
            spawnFloatingNumber(enemy.dir, mobVisualRadius(enemy), dmg, '#ff3030');
            enemy.hp -= dmg;
            if (enemy.hp <= 0){
              removeMob(enemyList, oi);
            } else {
              enemy.mesh.material.color.copy(enemy.baseColor).lerp(MOB_DAMAGED_COLOR, 1 - enemy.hp / enemy.maxHp);
              if (enemy.hpBar) updateHPBarSprite(enemy.hpBar, enemy.hp / enemy.maxHp);
            }
          }
        }
      }

      // Erode nearby enemy territory over time, then reset and repeat —
      // an enemy unit only ever interrupts this once it's no longer busy
      // (see isBusyEroding above), so a cycle already underway finishes.
      if (aggro){
        mob.erodeProgress = 0;
      } else {
        let anyEnemyNearby = false;
        forEachCellInBrush(mob.dir, range, (idx) => {
          if (isEnemyColor(territoryGrid[idx])) anyEnemyNearby = true;
        });
        if (anyEnemyNearby){
          mob.erodeProgress += dt;
          if (mob.erodeProgress >= mobErodeDuration(mob)){
            // Only clear cells that are actually the enemy color — a naive
            // "clear everything in range" also ate into the mob's own
            // territory when it stood near the border.
            forEachCellInBrush(mob.dir, range, (idx) => {
              if (isEnemyColor(territoryGrid[idx])){
                paintCell(idx % GRID_W, (idx / GRID_W) | 0, EMPTY);
              }
            });
            mob.erodeProgress = 0;
            mob.spinT = MOB_SPIN_DURATION;
          }
        } else {
          mob.erodeProgress = 0;
        }
      }
    }
  }

  // Rotates `aDir` further away from `bDir`, along the great circle joining
  // them, by exactly `angle` radians. (Same shape as slerpVec's formula,
  // but a fixed absolute angle in the "away" direction instead of a
  // fraction of the way toward the other point.)
  function rotateAwayAlongArc(aDir, bDir, angle){
    const dot = THREE.MathUtils.clamp(aDir.dot(bDir), -1, 1);
    let relative;
    if (dot > 0.9999){
      // Coincident (or nearly so): any perpendicular direction will do.
      const arbitrary = Math.abs(aDir.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
      relative = new THREE.Vector3().crossVectors(aDir, arbitrary).normalize();
    } else {
      relative = bDir.clone().sub(aDir.clone().multiplyScalar(dot)).normalize();
    }
    return aDir.clone().multiplyScalar(Math.cos(angle)).add(relative.multiplyScalar(-Math.sin(angle))).normalize();
  }
  function mobVisualRadius(mob){
    if (mob.visualRadius !== undefined) return mob.visualRadius;
    if (mob.isPurple) return MOB_LOCAL_R * BIG_MOB_SIZE_MULT;
    if (mob.isScarecrow) return MOB_LOCAL_R * SCARECROW_SIZE_MULT;
    if (mob.isFarmer) return MOB_LOCAL_R;
    if (mob.isGray) return MOB_LOCAL_R * GRAY_MOB_SIZE_MULT;
    if (mob.isBoss) return MOB_LOCAL_R * BOSS_BLUE_MOB_SIZE_MULT;
    if (mob.isAlliedBlack) return MOB_LOCAL_R * 3;
    if (mob.isAlliedGreen) return MOB_LOCAL_R * 1.5;
    if (mob.isBig) return MOB_LOCAL_R * (mob.team === 'pink' ? BIG_MOB_SIZE_MULT : BIG_BLUE_MOB_SIZE_MULT);
    return mob.isGold ? MOB_LOCAL_R * GOLD_MOB_SIZE_MULT : MOB_LOCAL_R;
  }
  // Simple pairwise separation so mobs never fully overlap (which used to
  // render as a dark, muddy blob where two triangles sat on top of each
  // other) — anyone crowding too close gets nudged apart a little.
  // How much a mob resists being shoved around by another one it's
  // overlapping — heavier mobs barely budge, lighter ones get pushed aside
  // to make room instead.
  let NORMAL_MOB_MASS = 1;
  let BIG_MOB_MASS = 3;
  let BIG_BLUE_MOB_MASS = 3;
  let GOLD_MOB_MASS = 7;
  let BLACK_MOB_MASS = 5;
  let GREEN_MOB_MASS = 1;
  let BOSS_BLUE_MOB_MASS = 10;
  function mobMass(mob){
    if (mob.isFarmer) return FARMER_MOB_MASS;
    if (mob.isScarecrow) return SCARECROW_MASS;
    if (mob.isPurple) return PURPLE_MOB_MASS;
    if (mob.isGray) return GRAY_MOB_MASS;
    if (mob.isBoss) return BOSS_BLUE_MOB_MASS;
    if (mob.isAlliedBlack) return BLACK_MOB_MASS;
    if (mob.isAlliedGreen) return GREEN_MOB_MASS;
    if (mob.isBig) return mob.team === 'pink' ? BIG_MOB_MASS : BIG_BLUE_MOB_MASS;
    if (mob.isGold) return GOLD_MOB_MASS;
    if (mob.kind === 'gray') return GRAY_MOB_MASS;
    if (mob.kind === 'black') return BLACK_MOB_MASS;
    if (mob.kind === 'green') return GREEN_MOB_MASS;
    return NORMAL_MOB_MASS;
  }
  const collisionScratch = []; // reused each frame instead of allocating a fresh concat() every time
  function resolveMobCollisions(){
    collisionScratch.length = 0;
    for (const m of pinkMobs) collisionScratch.push(m);
    for (const m of blueMobs) collisionScratch.push(m);
    for (const m of neutralMobs) collisionScratch.push(m);
    const all = collisionScratch;
    const n = all.length;
    // mobVisualRadius() branches on a handful of flags — cheap once, but
    // this loop calls it O(n^2) times if left inline. Computing it once
    // per mob up front turns that into O(n) calls instead.
    for (let i = 0; i < n; i++) all[i]._collisionR = mobVisualRadius(all[i]);
    for (let i = 0; i < n; i++){
      const a = all[i];
      for (let j = i + 1; j < n; j++){
        const b = all[j];
        const minSepAngular = ((a._collisionR + b._collisionR) * (2/3) + 0.015) / R;
        // Cheap pre-check before the expensive acos in angleBetween: this
        // loop is O(n^2) and runs every single frame, so skipping straight
        // past pairs that are obviously nowhere near each other — the
        // large majority, once mob counts climb — matters a lot. A plain
        // dot product comparison is monotonic with angular distance, so
        // it's a safe stand-in for the "are these even close" check.
        const dot = a.dir.dot(b.dir);
        if (dot <= Math.cos(minSepAngular)) continue;
        const d = angleBetween(a.dir, b.dir);
        if (d < minSepAngular && d > 1e-6){
          const overlap = minSepAngular - d;
          const massA = mobMass(a), massB = mobMass(b);
          const totalMass = massA + massB;
          // The heavier one claims most of the ground: it moves by the
          // other's mass share, not a flat 50/50 split.
          const moveA = overlap * (massB / totalMass);
          const moveB = overlap * (massA / totalMass);
          a.dir = rotateAwayAlongArc(a.dir, b.dir, moveA);
          b.dir = rotateAwayAlongArc(b.dir, a.dir, moveB);
          a.mesh.position.copy(a.dir).multiplyScalar(R * 1.02);
          b.mesh.position.copy(b.dir).multiplyScalar(R * 1.02);
        }
      }
    }
  }

  function updateMobs(dt, now){
    for (let t = 0; t < 2; t++){
      if (now >= nextMobSpawnAt[t]){
        spawnMob(t === 0 ? 'pink' : 'blue');
        nextMobSpawnAt[t] = now + MOB_SPAWN_MIN_MS + Math.random() * (MOB_SPAWN_MAX_MS - MOB_SPAWN_MIN_MS);
      }
      if (!bossMobSpawned[t] && gameElapsedMs() >= BOSS_BLUE_MOB_SPAWN_DELAY_MS){
        bossMobSpawned[t] = spawnBossMob(t);
      }
    }
    // Once unlocked by a first delivery, allied black/green mobs keep
    // getting a periodic *chance* to spawn on this same cadence — not a
    // guaranteed spawn every cycle, which is what made them feel like they
    // never stopped coming. See updateAlliedMobSpawns.
    updateAlliedMobSpawns(now);
    updateMobList(pinkMobs, true, dt, now);
    updateMobList(blueMobs, false, dt, now);
    resolveMobCollisions();
  }

  // Standing on your own color of ground slowly heals you: red dots on
  // pink territory, the blue dot on cyan territory.
  let PASSIVE_REGEN_PER_SEC = 3;
  function updatePassiveRegen(dt, now){
    for (const ch of characters){
      if (!ch.alive || ch.hp >= ch.maxHp) continue;
      if (territoryGrid[dirToGridIdx(ch.dir)] === LIGHT_OF[ch.team]){
        const healed = Math.min(ch.maxHp - ch.hp, PASSIVE_REGEN_PER_SEC * dt);
        ch.hp += healed;
        updateHPBarSprite(ch.hpBar, ch.hp / ch.maxHp);
        ch.regenAccum = (ch.regenAccum || 0) + healed;
        if (!ch.nextRegenPopupAt || now >= ch.nextRegenPopupAt){
          if (ch.regenAccum > 0.05) spawnFloatingNumber(ch.dir, CHAR_LOCAL_R, ch.regenAccum, '#3dff6e');
          ch.regenAccum = 0;
          ch.nextRegenPopupAt = now + 1000;
        }
      }
    }
    if (blueDot.active && blueDot.hp < blueDot.maxHp){
      if (territoryGrid[dirToGridIdx(blueDot.dir)] === CYAN){
        const healed = Math.min(blueDot.maxHp - blueDot.hp, PASSIVE_REGEN_PER_SEC * dt);
        blueDot.hp += healed;
        updateHPBarSprite(blueDot.hpBar, blueDot.hp / blueDot.maxHp);
        blueDot.regenAccum = (blueDot.regenAccum || 0) + healed;
        if (!blueDot.nextRegenPopupAt || now >= blueDot.nextRegenPopupAt){
          if (blueDot.regenAccum > 0.05) spawnFloatingNumber(blueDot.dir, DOT_LOCAL_R, blueDot.regenAccum, '#3dff6e');
          blueDot.regenAccum = 0;
          blueDot.nextRegenPopupAt = now + 1000;
        }
      }
    }
  }

  // ---------- path line (continuous tube; trimmed to only the un-walked part) ----------
  const PATH_TUBE_RADIUS = 0.045;
  function setCharPathTube(ch, points){
    if (ch.pathTubeMesh){ sphereGroup.remove(ch.pathTubeMesh); ch.pathTubeMesh.geometry.dispose(); ch.pathTubeMesh = null; }
    if (!points || points.length < 2) return;
    // Each player sees only their own dots' routes (spectators see both).
    if (myTeam !== -1 && ch.team !== myTeam) return;
    const scaled = points.map(p => p.clone().multiplyScalar(R * 1.015));
    const curve = new THREE.CatmullRomCurve3(scaled, false, 'catmullrom', 0.35);
    const tubularSegments = Math.max(12, scaled.length * 6);
    const geo = new THREE.TubeGeometry(curve, tubularSegments, PATH_TUBE_RADIUS, 8, false);
    const mat = new THREE.MeshBasicMaterial({ color: ROUTE_LINE_COLORS[ch.role] || 0xffd166 });
    ch.pathTubeMesh = new THREE.Mesh(geo, mat);
    sphereGroup.add(ch.pathTubeMesh);
  }

  // ---------- meteors (tap the sphere to drop one) ----------
  function makeGlowTexture(){
    const s = 128;
    const c = document.createElement('canvas');
    c.width = c.height = s;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.35, 'rgba(255,255,255,0.75)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, s, s);
    return new THREE.CanvasTexture(c);
  }
  const glowTex = makeGlowTexture();

  const meteors = [];
  const meteorEffects = [];
  const METEOR_HEAD_COLOR = new THREE.Color(0xfff2c4);
  const METEOR_TAIL_COLOR = new THREE.Color(0xff5a2e);
  const METEOR_TRAIL_N = 10;
  let METEOR_CLEAR_ANGULAR = 0.15; // radius of territory wiped white on impact
  let meteorImpactCount = 0;
  const meteorCountEl = document.getElementById('meteorCount');
  const shake = { t: 0, duration: 0, strength: 0 };

  function meteorBezier(p0, p1, p2, t){
    const a = p0.clone().multiplyScalar((1 - t) * (1 - t));
    const b = p1.clone().multiplyScalar(2 * (1 - t) * t);
    const c = p2.clone().multiplyScalar(t * t);
    return a.add(b).add(c);
  }

  // localDir: normalized impact direction in the sphere's own local space
  // (so the target tracks the sphere's current rotation as it falls).
  // uv: texture uv of the impact point, for the scorch mark.
  // opts: { damage, sizeMult, onLanded(localDir) } — all optional, used by
  // the ability cards; a plain tapped meteor omits them (damage 0, size 1x).
  // Curved fall around the outside of the globe (centred on the origin):
  // the direction swings from the start toward the target while the height
  // shrinks from the start's down to the surface, reaching it only at u=1.
  function meteorOrbitPos(m, endWorld, u){
    const r0 = m.start.length();
    const ds = m.start.clone().normalize();
    const de = endWorld.clone().normalize();
    let theta = angleBetween(ds, de);
    let axis = new THREE.Vector3().crossVectors(ds, de);
    if (axis.lengthSq() < 1e-6){
      // Start and target (nearly) opposite: keep going around the same side.
      axis = m.orbitAxis ? m.orbitAxis.clone() : new THREE.Vector3().crossVectors(ds, new THREE.Vector3(0, 1, 0));
      if (axis.lengthSq() < 1e-6) axis.set(1, 0, 0);
      axis.sub(ds.clone().multiplyScalar(axis.dot(ds)));
    }
    axis.normalize();
    if (m.orbitAxis && axis.dot(m.orbitAxis) < 0){
      // Don't flip to the other side mid-flight as the globe turns.
      axis.negate();
      theta = Math.PI * 2 - theta;
    }
    m.orbitAxis = axis.clone();
    const dir = ds.applyAxisAngle(axis, theta * u);
    const h = Math.max(0, r0 - R) * Math.pow(1 - u, 1.3);
    return dir.multiplyScalar(R + h);
  }
  function launchMeteor(localDir, uv, opts){
    opts = opts || {};
    const sizeMult = opts.sizeMult || 1; // drives damage/territory-clear radius
    const visualMult = opts.visualMult !== undefined ? opts.visualMult : sizeMult; // drives only how big it looks
    const worldEnd = sphereGroup.localToWorld(localDir.clone().multiplyScalar(R));
    const dir = worldEnd.clone().normalize();

    let tangent = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0));
    if (tangent.lengthSq() < 1e-4) tangent.set(1, 0, 0);
    tangent.normalize();
    const bitangent = new THREE.Vector3().crossVectors(dir, tangent).normalize();

    const lat1 = (Math.random() - 0.5) * R * 2.2;
    const lat2 = (Math.random() - 0.5) * R * 2.2;
    const lateral = tangent.clone().multiplyScalar(lat1).add(bitangent.clone().multiplyScalar(lat2));

    let start, control;
    if (opts.startWorld){
      // Falls from a given point in space (the moon): arcs up and over
      // from there toward the surface.
      start = opts.startWorld.clone();
      const mid = start.clone().add(worldEnd).multiplyScalar(0.5);
      control = mid.clone().normalize().multiplyScalar(Math.max(mid.length(), R) + R * 0.6);
    } else {
      start = dir.clone().multiplyScalar(R * 4.2).add(lateral);
      control = dir.clone().multiplyScalar(R * 2.1).add(lateral.clone().multiplyScalar(0.45));
    }

    // Moon meteors aimed at the far side of the globe: if the ordinary arc
    // would pass through the globe, it instead swings around the outside,
    // as if pulled along by gravity, and comes down on the target.
    let orbit = false;
    if (opts.startWorld){
      for (let k = 1; k <= 24; k++){
        const tt = k / 25;
        if (tt > 0.92) break; // the last stretch is supposed to reach the surface
        if (meteorBezier(start, control, worldEnd, tt).length() < R * 1.03){ orbit = true; break; }
      }
    }

    const headGeo = new THREE.SphereGeometry(0.065 * visualMult, 10, 10);
    const headMat = new THREE.MeshBasicMaterial({ color: 0xffe0a8 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.copy(start);
    scene.add(head);

    const halo = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex, color: 0xffb35c, transparent: true, opacity: 0.55,
      depthWrite: false, blending: THREE.AdditiveBlending
    }));
    halo.scale.set(0.36 * visualMult, 0.36 * visualMult, 1);
    head.add(halo);

    const light = new THREE.PointLight(0xff9a52, 1.0 * visualMult, 4 * visualMult, 2);
    light.position.copy(start);
    scene.add(light);

    const trailSprites = [];
    const history = [];
    for (let i = 0; i < METEOR_TRAIL_N; i++){
      const age = i / (METEOR_TRAIL_N - 1);
      const col = METEOR_HEAD_COLOR.clone().lerp(METEOR_TAIL_COLOR, age);
      const mat = new THREE.SpriteMaterial({
        map: glowTex, color: col, transparent: true,
        opacity: 0.78 * (1 - age * 0.92), depthWrite: false, blending: THREE.AdditiveBlending
      });
      const spr = new THREE.Sprite(mat);
      const sc = (0.2 - age * 0.15) * visualMult;
      spr.scale.set(sc, sc, 1);
      spr.position.copy(start);
      scene.add(spr);
      trailSprites.push(spr);
      history.push(start.clone());
    }

    const duration = opts.duration || (0.8 + Math.random() * 0.3);
    // Let the other players' screens show the same meteor falling.
    if (!opts.visualOnly && opts.startWorld) netPushEvent('n' + encDir(localDir) + enc1(Math.round(duration * 20)));
    else if (!opts.visualOnly) netPushEvent('m' + encDir(localDir) + enc1(Math.round(sizeMult)) + enc1(Math.round(visualMult)) + enc1(Math.round(duration * 50)));
    meteors.push({
      head, light, trailSprites, history,
      start, control, localDir, uv,
      orbit, orbitAxis: null,
      t: 0,
      duration,
      visualOnly: !!opts.visualOnly,
      clearRadius: opts.clearRadius,
      damage: opts.damage || 0,
      sizeMult,
      visualMult,
      onLanded: opts.onLanded || null
    });
  }

  function meteorImpact(m){
    scene.remove(m.head);
    scene.remove(m.light);
    m.trailSprites.forEach(s => scene.remove(s));

    const endPos = sphereGroup.localToWorld(m.localDir.clone().multiplyScalar(R));
    drawScorchMark(m.uv.x, m.uv.y);
    const clearRadius = m.clearRadius !== undefined ? m.clearRadius : METEOR_CLEAR_ANGULAR * m.sizeMult;
    if (!m.visualOnly && simRunning()){
      paintDirAsColor(m.localDir, EMPTY, clearRadius); // scorched ground belongs to no one
      if (m.damage > 0) damageEntitiesNear(m.localDir, clearRadius, m.damage);
    }

    const flashMat = new THREE.SpriteMaterial({
      map: glowTex, color: 0xfff3d0, transparent: true, opacity: 1,
      depthWrite: false, blending: THREE.AdditiveBlending
    });
    const flash = new THREE.Sprite(flashMat);
    flash.position.copy(endPos);
    flash.scale.set(0.01, 0.01, 1);
    scene.add(flash);
    meteorEffects.push({ type: 'flash', sprite: flash, t: 0, duration: 0.3, sizeMult: m.visualMult });

    const dirN = endPos.clone().normalize();
    let tangent = new THREE.Vector3().crossVectors(dirN, new THREE.Vector3(0, 1, 0));
    if (tangent.lengthSq() < 1e-4) tangent.set(1, 0, 0);
    tangent.normalize();
    const bitangent = new THREE.Vector3().crossVectors(dirN, tangent).normalize();

    const burstCount = 5;
    for (let i = 0; i < burstCount; i++){
      const ang = (i / burstCount) * Math.PI * 2 + Math.random() * 0.5;
      const vel = tangent.clone().multiplyScalar(Math.cos(ang)).add(bitangent.clone().multiplyScalar(Math.sin(ang)))
        .multiplyScalar(0.8 + Math.random() * 0.4)
        .add(dirN.clone().multiplyScalar(0.3));
      const mat = new THREE.SpriteMaterial({
        map: glowTex, color: 0xff8a48, transparent: true, opacity: 0.8,
        depthWrite: false, blending: THREE.AdditiveBlending
      });
      const spr = new THREE.Sprite(mat);
      spr.scale.set(0.1 * m.visualMult, 0.1 * m.visualMult, 1);
      spr.position.copy(endPos);
      scene.add(spr);
      meteorEffects.push({ type: 'burst', sprite: spr, pos: endPos.clone(), vel, t: 0, duration: 0.35 + Math.random() * 0.15, sizeMult: m.visualMult });
    }

    const flashLight = new THREE.PointLight(0xffab6a, 1.3 * m.visualMult, 3.4 * m.visualMult, 2);
    flashLight.position.copy(endPos);
    scene.add(flashLight);
    meteorEffects.push({ type: 'light', light: flashLight, t: 0, duration: 0.26 });

    shake.t = 0; shake.duration = 0.2; shake.strength = 0.04 * m.sizeMult;

    if (!m.visualOnly){
      meteorImpactCount++;
      if (meteorCountEl) meteorCountEl.textContent = meteorImpactCount;
    }

    if (m.onLanded && !m.visualOnly && simRunning()) m.onLanded(m.localDir);
  }

  function updateMeteors(dt){
    for (let i = meteors.length - 1; i >= 0; i--){
      const m = meteors[i];
      m.t += dt / m.duration;
      if (m.t >= 1){
        meteorImpact(m);
        meteors.splice(i, 1);
        continue;
      }
      const currentEnd = sphereGroup.localToWorld(m.localDir.clone().multiplyScalar(R));
      const te = m.t * m.t;
      const pos = m.orbit ? meteorOrbitPos(m, currentEnd, te) : meteorBezier(m.start, m.control, currentEnd, te);
      m.head.position.copy(pos);
      m.light.position.copy(pos);
      m.history.unshift(pos.clone());
      m.history.pop();
      for (let k = 0; k < METEOR_TRAIL_N; k++) m.trailSprites[k].position.copy(m.history[k]);
    }

    for (let i = meteorEffects.length - 1; i >= 0; i--){
      const fx = meteorEffects[i];
      fx.t += dt;
      const p = Math.min(fx.t / fx.duration, 1);
      if (fx.type === 'flash'){
        const s = (0.75 * Math.sin(Math.PI * p) + 0.02) * (fx.sizeMult || 1);
        fx.sprite.scale.set(s, s, 1);
        fx.sprite.material.opacity = 1 - p;
        if (p >= 1){ scene.remove(fx.sprite); meteorEffects.splice(i, 1); }
      } else if (fx.type === 'burst'){
        fx.vel.multiplyScalar(0.92);
        fx.pos.add(fx.vel.clone().multiplyScalar(dt));
        fx.sprite.position.copy(fx.pos);
        fx.sprite.material.opacity = 0.8 * (1 - p);
        const s = 0.1 * (1 - p * 0.5) * (fx.sizeMult || 1);
        fx.sprite.scale.set(s, s, 1);
        if (p >= 1){ scene.remove(fx.sprite); meteorEffects.splice(i, 1); }
      } else if (fx.type === 'light'){
        fx.light.intensity = 1.3 * (1 - p);
        if (p >= 1){ scene.remove(fx.light); meteorEffects.splice(i, 1); }
      } else if (fx.type === 'laser'){
        fx.laserMesh.material.opacity = 0.9 * (1 - p);
        if (p >= 1){
          scene.remove(fx.laserMesh);
          fx.laserMesh.geometry.dispose(); fx.laserMesh.material.dispose();
          meteorEffects.splice(i, 1);
        }
      }
    }

    if (shake.t < shake.duration){
      shake.t += dt;
      const decay = 1 - (shake.t / shake.duration);
      camera.position.set(
        camBasePos.x + (Math.random() - 0.5) * shake.strength * decay,
        camBasePos.y + (Math.random() - 0.5) * shake.strength * decay,
        camBasePos.z + (Math.random() - 0.5) * shake.strength * decay
      );
    } else {
      camera.position.copy(camBasePos);
    }
  }

  // ---------- ability cards: landmarks, damage helper ----------
  // (blocked-cell tracking itself lives right after paintCell, below —
  // it must exist before any top-level code paints initial territory)
  function isGridVertexBlocked(vertex){
    return isCellBlocked(dirToGridIdx(latLonDegToDir(vertex.lat, vertex.lon)));
  }

  // The uv a real raycast hit would report for this direction, derived from
  // the same lat/lon <-> pixel relationship the ground texture's own grid
  // lines (and drawScorchMark) already use — so a programmatically chosen
  // impact point scorches in exactly the right spot.
  function dirToUV(dir){
    const ll = dirToLatLonDeg(dir);
    return { x: ll.lon / 360, y: (90 + ll.lat) / 180 };
  }

  // For a boss mob's area attack: only its team's actual enemies (the
  // other team's dots and mobs) — never its own side.
  function damageEnemiesNear(team, dir, range, damage){
    for (const ch of charTargets()){
      if (ch.team !== team && ch.alive && angleBetween(ch.dir, dir) <= range) damageCharacter(ch, damage);
    }
    const foes = teamMobs(1 - team);
    for (let i = foes.length - 1; i >= 0; i--){
      const mob = foes[i];
      if (angleBetween(mob.dir, dir) <= range){
        spawnFloatingNumber(mob.dir, mobVisualRadius(mob), damage, '#ff3030');
        mob.hp -= damage;
        if (mob.hp <= 0){ removeMob(foes, i); continue; }
        else mob.mesh.material.color.copy(mob.baseColor).lerp(MOB_DAMAGED_COLOR, 1 - mob.hp / mob.maxHp);
        if (mob.hpBar) updateHPBarSprite(mob.hpBar, mob.hp / mob.maxHp);
      }
    }
  }
  function damageEntitiesNear(localDir, radius, damage, excludeNeutral){
    for (const ch of charTargets()){
      if (ch.alive && angleBetween(ch.dir, localDir) <= radius) damageCharacter(ch, damage);
    }
    if (blueDot.active && angleBetween(blueDot.dir, localDir) <= radius) damageBlueDot(damage);
    for (let i = pinkMobs.length - 1; i >= 0; i--){
      const mob = pinkMobs[i];
      if (angleBetween(mob.dir, localDir) <= radius){
        spawnFloatingNumber(mob.dir, mobVisualRadius(mob), damage, '#ff3030');
        mob.hp -= damage;
        if (mob.hp <= 0){
          removeMob(pinkMobs, i);
        } else {
          mob.mesh.material.color.copy(mob.baseColor).lerp(MOB_DAMAGED_COLOR, 1 - mob.hp / mob.maxHp);
          if (mob.hpBar) updateHPBarSprite(mob.hpBar, mob.hp / mob.maxHp);
        }
      }
    }
    for (let i = blueMobs.length - 1; i >= 0; i--){
      const mob = blueMobs[i];
      if (angleBetween(mob.dir, localDir) <= radius){
        spawnFloatingNumber(mob.dir, mobVisualRadius(mob), damage, '#ff3030');
        mob.hp -= damage;
        if (mob.hp <= 0){
          removeMob(blueMobs, i);
        } else {
          mob.mesh.material.color.copy(mob.baseColor).lerp(MOB_DAMAGED_COLOR, 1 - mob.hp / mob.maxHp);
          if (mob.hpBar) updateHPBarSprite(mob.hpBar, mob.hp / mob.maxHp);
        }
      }
    }
    for (let i = neutralMobs.length - 1; i >= 0; i--){
      const mob = neutralMobs[i];
      // e.g. the black mob's own area attack hits neither itself nor other black mobs
      if (excludeNeutral && (mob === excludeNeutral || mob.kind === excludeNeutral.kind)) continue;
      if (angleBetween(mob.dir, localDir) <= radius){
        spawnFloatingNumber(mob.dir, mobVisualRadius(mob), damage, '#ff3030');
        mob.hp -= damage;
        if (mob.hp <= 0){
          removeNeutralMob(i);
        } else {
          mob.mesh.material.color.copy(mob.baseColor).lerp(MOB_DAMAGED_COLOR, 1 - mob.hp / mob.maxHp);
          if (mob.hpBar) updateHPBarSprite(mob.hpBar, mob.hp / mob.maxHp);
        }
      }
    }
  }

  // ---------- landmarks: no longer solid obstacles — a strong skill card
  // leaves a permanent, walkable patch of special-colored territory where
  // it landed instead. Nothing (character, blue dot, mob) is blocked by
  // this ground at all; it's purely a marker, sized the same as the old
  // "no-territory zone" used to be. ----------
  const landmarks = [];
  let METEOR_CRATER_RADIUS = 18 * Math.PI / 180;
  let CRYSTAL_ZONE_RADIUS = 12 * Math.PI / 180; // was 2/3 the meteor crater's size; now independently adjustable
  // Small black (red under 10s) countdown-seconds label, floating just
  // above a landmark's spot.
  function makeLandmarkCountdownSprite(){
    const c = document.createElement('canvas');
    c.width = 64; c.height = 40;
    const ctx = c.getContext('2d');
    const tex = new THREE.CanvasTexture(c);
    tex.generateMipmaps = false;
    tex.minFilter = THREE.LinearFilter;
    const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, depthWrite: false, transparent: true });
    const spr = new THREE.Sprite(mat);
    spr.scale.set(0.26, 0.16, 1);
    spr.renderOrder = 999;
    spr._canvas = c; spr._ctx = ctx; spr._tex = tex; spr._lastSec = null;
    return spr;
  }
  function updateLandmarkCountdownSprite(spr, remainingSec, alwaysBlack){
    const sec = Math.max(0, Math.ceil(remainingSec));
    if (spr._lastSec === sec) return; // only redraw when the shown number actually changes
    spr._lastSec = sec;
    const c = spr._canvas, ctx = spr._ctx;
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.fillStyle = (alwaysBlack || sec >= 10) ? '#000000' : '#ff2b2b';
    ctx.font = 'bold 26px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(sec), c.width / 2, c.height / 2 + 1);
    spr._tex.needsUpdate = true;
  }

  let METEOR_CRATER_LIFETIME_MS = 60000;
  let CRYSTAL_ZONE_LIFETIME_MS = 40000; // shorter-lived — light pillar can drop several of these at once
  // ---- small meteors from the moon (3 per match, at random times) ----
  const MOON_METEOR_COUNT = 3;
  const MOON_METEOR_WINDOW_MS = [30000, 300000]; // between 0:30 and 5:00 after kick-off
  let MOON_METEOR_CLEAR = 5 * Math.PI / 180; // impact radius: territory wiped + damage + knockback
  let MOON_METEOR_DAMAGE = 100;
  let MOON_METEOR_KNOCKBACK_MIN = 3.9 * Math.PI / 180;
  let MOON_METEOR_KNOCKBACK_MAX = 4.3 * Math.PI / 180;
  let MOON_CRATER_RADIUS = 4 * Math.PI / 180;
  let MOON_CRATER_LIFETIME_MS = 20000;
  function spawnLandmark(type, localDir, radiusOverride){
    const isCrystal = type === 'spirit_crystal';
    const isMoon = type === 'moon_crater';
    const isPoison = type === 'poison_pool';
    const isToxic = type === 'toxic_pool';
    const isPool = isPoison || isToxic;
    const radius = radiusOverride || (isToxic ? TOXIC_POOL_RADIUS : isPoison ? POISON_POOL_RADIUS_MIN : isMoon ? MOON_CRATER_RADIUS : isCrystal ? CRYSTAL_ZONE_RADIUS : METEOR_CRATER_RADIUS);
    const colorId = isToxic ? TOXIC_POOL : isPoison ? POISON_POOL : isMoon ? MOON_CRATER : isCrystal ? CRYSTAL_ZONE : METEOR_CRATER;
    const lifetime = isToxic ? TOXIC_POOL_LIFETIME_MS : isPoison ? POISON_POOL_LIFETIME_MS : isMoon ? MOON_CRATER_LIFETIME_MS : isCrystal ? CRYSTAL_ZONE_LIFETIME_MS : METEOR_CRATER_LIFETIME_MS;
    const cells = [];
    const prev = [];
    const collectAndPaint = (idx) => {
      // Multiple light-pillar zones can land close enough to overlap —
      // whichever one claimed a cell first keeps it, so a shorter-lived
      // neighbor expiring later doesn't erase ground that's actually still
      // owned by another still-active zone.
      if (landmarkCellSet.has(idx)) return;
      cells.push(idx);
      prev.push(territoryGrid[idx] | (farmCells.has(idx) ? 256 : 0));
      paintCell(idx % GRID_W, (idx / GRID_W) | 0, colorId);
    };
    // Paint first, *then* mark the cells protected — otherwise the
    // protection would block the landmark from ever painting itself in.
    if (isCrystal) forEachCellInDiamond(localDir, radius, collectAndPaint);
    else forEachCellInBrush(localDir, radius, collectAndPaint);
    cells.forEach(idx => landmarkCellSet.add(idx));

    // Meteor crater, spirit crystal zone and moon crater are permanent: no
    // countdown and no expiry. Poison pools dry up, with a black countdown.
    const permanent = !isPool;
    let label = null;
    if (!permanent){
      label = makeLandmarkCountdownSprite();
      label.position.copy(localDir).multiplyScalar(R * 1.02 + 0.16);
      sphereGroup.add(label);
      updateLandmarkCountdownSprite(label, lifetime / 1000, true);
    }

    const lm = {
      id: takeMobNetId(),
      type, dir: localDir.clone(), cells, label, radius, permanent,
      // 毒溜まり hands the ground back as it was when it dries up;
      // 猛毒溜まり wipes it to EMPTY like every other landmark.
      prev: isPoison ? prev : null,
      blackCountdown: isPool,
      expiresAt: permanent ? Infinity : performance.now() + lifetime
    };
    landmarks.push(lm);
    return lm;
  }
  function updateLandmarks(now){
    for (let i = landmarks.length - 1; i >= 0; i--){
      const lm = landmarks[i];
      if (lm.permanent) continue; // crater / crystal: never expires
      const remainMs = lm.expiresAt - now;
      if (remainMs <= 0){
        // Un-protect first, so painting it back actually sticks. Pools give
        // the ground back as it was; anything else is wiped to EMPTY.
        lm.cells.forEach((idx, k) => {
          landmarkCellSet.delete(idx);
          const gx = idx % GRID_W, gy = (idx / GRID_W) | 0;
          if (lm.prev){
            const pv = lm.prev[k];
            paintCell(gx, gy, EMPTY);
            if ((pv & 255) !== EMPTY) paintCell(gx, gy, pv & 255);
            if ((pv & 256) && territoryGrid[idx] === (pv & 255)){ farmCells.add(idx); farmDirty = true; }
          } else {
            paintCell(gx, gy, EMPTY);
          }
        });
        sphereGroup.remove(lm.label);
        lm.label.material.map.dispose();
        lm.label.material.dispose();
        landmarks.splice(i, 1);
        // Its guardian mob loses its home along with it.
        for (let j = neutralMobs.length - 1; j >= 0; j--){
          if (neutralMobs[j].home === lm) removeNeutralMob(j);
        }
        continue;
      }
      updateLandmarkCountdownSprite(lm.label, remainMs / 1000, !!lm.blackCountdown);
    }
  }

  // ================= poison: 毒の雨 / 毒溜まり / 猛毒溜まり / 毒液 / パープルモブ =================
  // POISON_POOL / TOXIC_POOL are short-lived landmark ground (see
  // spawnLandmark). Mobs standing on one get poisoned / badly poisoned;
  // dots (characters) standing on one pick up 毒液, which keeps them
  // poisoned until they carry it onto their own ground. Delivering 毒液
  // unlocks (and escalates) allied purple mob spawns, like the fragments.
  let POISON_RAIN_DURATION_MS = 30000;
  let POISON_RAIN_INTERVAL_MIN_MS = 400, POISON_RAIN_INTERVAL_MAX_MS = 1200;
  let POISON_POOL_RADIUS_MIN = 2.5 * Math.PI / 180, POISON_POOL_RADIUS_MAX = 4 * Math.PI / 180;
  let POISON_POOL_LIFETIME_MS = 1000;
  let TOXIC_POOL_RADIUS = 3 * Math.PI / 180;
  let TOXIC_POOL_LIFETIME_MS = 5000;
  let POISON_DPS = 10, POISON_DURATION_MS = 15000;
  let TOXIC_DPS = 15, TOXIC_DURATION_MS = 25000;
  let POISON_LIQUID_DPS = 10; // 毒液 = a poison that never wears off
  let POISON_LIQUID_PURPLE_BASE_CHANCE = 0.05; // 5% -> 10% -> 15% ... per delivery
  const poisonLiquidDeliveryCount = [0, 0];
  const nextAlliedPurpleSpawnAt = [0, 0];
  let PURPLE_MOB_HP = 225;
  let PURPLE_MOB_SPEED = 0.07 * Math.PI / 180;
  let PURPLE_MOB_RANGE = 8 * Math.PI / 180;
  let PURPLE_MOB_COOLDOWN_MS = 9000;
  let PURPLE_MOB_MASS = 1;
  let PURPLE_ORB_SCATTER = 2.5 * Math.PI / 180; // the three thrown orbs land spread around the target
  let PURPLE_BURST_MIN = 3, PURPLE_BURST_MAX = 5;
  const POISON_NUM_COLOR = '#c061ff';
  const PURPLE_MOB_COLOR = new THREE.Color(0x8e3ad6);

  // A random point within maxAng of dir (uniform over the disc).
  function randomDirNear(dir, maxAng){
    const d = dir.clone().normalize();
    let a = new THREE.Vector3().crossVectors(d, new THREE.Vector3(0, 1, 0));
    if (a.lengthSq() < 1e-6) a.set(1, 0, 0);
    a.normalize();
    const b = new THREE.Vector3().crossVectors(d, a).normalize();
    const th = Math.random() * Math.PI * 2;
    const r = maxAng * Math.sqrt(Math.random());
    const axis = a.multiplyScalar(Math.cos(th)).add(b.multiplyScalar(Math.sin(th))).normalize();
    // rotate d toward the tangent direction by r
    const rotAxis = new THREE.Vector3().crossVectors(d, axis).normalize();
    return d.applyAxisAngle(rotAxis, r).normalize();
  }

  // ---- visuals shared by host and player 2: rain drops and thrown orbs ----
  const poisonDrops = []; // { mesh, dir, t, dur, onLand }
  const poisonOrbs = [];  // { mesh, from, to, t, dur, arc, onLand }
  const poisonDropGeo = new THREE.SphereGeometry(0.03, 8, 8);
  const poisonDropMat = new THREE.MeshBasicMaterial({ color: 0xb45cff, transparent: true, opacity: 0.9 });
  const poisonOrbGeo = new THREE.SphereGeometry(0.05, 12, 10);
  const poisonOrbMat = new THREE.MeshStandardMaterial({ color: 0x9b3cf0, emissive: 0x6a1fb0, emissiveIntensity: 0.6, roughness: 0.35 });
  function spawnPoisonDropVisual(dir, onLand){
    const mesh = new THREE.Mesh(poisonDropGeo, poisonDropMat);
    mesh.scale.set(1, 2.2, 1);
    sphereGroup.add(mesh);
    poisonDrops.push({ mesh, dir: dir.clone().normalize(), t: 0, dur: 0.45, onLand: onLand || null });
    if (onLand) netPushEvent('r' + encDir(dir));
  }
  function spawnPoisonOrbVisual(from, to, onLand){
    const mesh = new THREE.Mesh(poisonOrbGeo, poisonOrbMat);
    sphereGroup.add(mesh);
    const dist = angleBetween(from, to);
    poisonOrbs.push({ mesh, from: from.clone().normalize(), to: to.clone().normalize(), t: 0,
      dur: 0.55 + dist * 2.2, arc: 0.18 + dist * 1.6, onLand: onLand || null });
    if (onLand) netPushEvent('v' + encDir(from) + encDir(to));
  }
  function updatePoisonVisuals(dt){
    for (let i = poisonDrops.length - 1; i >= 0; i--){
      const p = poisonDrops[i];
      p.t += dt;
      const k = Math.min(1, p.t / p.dur);
      p.mesh.position.copy(p.dir).multiplyScalar(R * 1.02 + (1 - k * k) * 0.9);
      p.mesh.quaternion.setFromUnitVectors(MOB_UP, p.dir);
      if (k >= 1){
        sphereGroup.remove(p.mesh);
        poisonDrops.splice(i, 1);
        if (p.onLand && simRunning()) p.onLand(p.dir);
      }
    }
    for (let i = poisonOrbs.length - 1; i >= 0; i--){
      const o = poisonOrbs[i];
      o.t += dt;
      const k = Math.min(1, o.t / o.dur);
      const d = slerpVec(o.from, o.to, k).normalize();
      o.mesh.position.copy(d).multiplyScalar(R * 1.04 + Math.sin(Math.PI * k) * o.arc);
      if (k >= 1){
        sphereGroup.remove(o.mesh);
        poisonOrbs.splice(i, 1);
        if (o.onLand && simRunning()) o.onLand(o.to);
      }
    }
  }

  // ---- 毒の雨 (host) ----
  const poisonRains = []; // { team, cells, endAt, nextDropAt }
  function firePoisonRain(team, path){
    if (teamCardUsed(team, 'poison_rain')) return;
    if (!path || path.length < 2) return;
    const pts = path.map(p => p.clone().normalize());
    pts.push(pts[0].clone()); // close the loop
    const cells = getAbilityEnclosedCells(densifyRoute(pts));
    if (!cells || !cells.length) return;
    cardUsed[team].poison_rain = true;
    const now = performance.now();
    poisonRains.push({ team, cells, endAt: now + POISON_RAIN_DURATION_MS, nextDropAt: now });
  }
  function updatePoisonRains(now){
    for (let i = poisonRains.length - 1; i >= 0; i--){
      const rain = poisonRains[i];
      while (now >= rain.nextDropAt && rain.nextDropAt < rain.endAt){
        const idx = rain.cells[Math.floor(Math.random() * rain.cells.length)];
        const dir = cellIdxToDir(idx);
        spawnPoisonDropVisual(dir, (d) => {
          const r = POISON_POOL_RADIUS_MIN + Math.random() * Math.max(0, POISON_POOL_RADIUS_MAX - POISON_POOL_RADIUS_MIN);
          spawnLandmark('poison_pool', d, r);
        });
        rain.nextDropAt += POISON_RAIN_INTERVAL_MIN_MS + Math.random() * Math.max(0, POISON_RAIN_INTERVAL_MAX_MS - POISON_RAIN_INTERVAL_MIN_MS);
      }
      if (rain.nextDropAt >= rain.endAt) poisonRains.splice(i, 1);
    }
  }

  // ---- 毒液 (the purple ball over a dot's head) ----
  const LIQUID_MESH_R = 0.05;
  function attachLiquidMesh(ch){
    if (ch.liquidMesh) return;
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(LIQUID_MESH_R, 12, 10),
      new THREE.MeshStandardMaterial({ color: 0x9b3cf0, emissive: 0x5a1a9a, emissiveIntensity: 0.5, roughness: 0.3 }));
    sphereGroup.add(mesh);
    ch.liquidMesh = mesh;
    placeLiquidMesh(ch);
  }
  function detachLiquidMesh(ch){
    if (!ch.liquidMesh) return;
    sphereGroup.remove(ch.liquidMesh);
    ch.liquidMesh.geometry.dispose();
    ch.liquidMesh.material.dispose();
    ch.liquidMesh = null;
  }
  function placeLiquidMesh(ch){
    if (!ch.liquidMesh) return;
    // Sits above a carried fragment if there is one.
    const h = FRAGMENT_HEIGHT_OFFSET + (ch.fragmentMesh ? 0.13 : 0);
    ch.liquidMesh.position.copy(ch.dir).multiplyScalar(R * 1.02 + h);
  }
  function deliverPoisonLiquid(ch, now){
    ch.poisonLiquid = false;
    detachLiquidMesh(ch);
    const t = ch.team;
    const first = poisonLiquidDeliveryCount[t] === 0;
    poisonLiquidDeliveryCount[t]++;
    if (Math.random() < alliedMobChance(POISON_LIQUID_PURPLE_BASE_CHANCE, poisonLiquidDeliveryCount[t])) spawnAlliedPurpleMob(t);
    if (first) nextAlliedPurpleSpawnAt[t] = now + MOB_SPAWN_MIN_MS + Math.random() * (MOB_SPAWN_MAX_MS - MOB_SPAWN_MIN_MS);
  }

  // ---- poison damage ----
  function poisonDamageCharacter(ch, dmg){
    if (!ch.alive) return;
    spawnFloatingNumber(ch.dir, CHAR_LOCAL_R, dmg, POISON_NUM_COLOR);
    ch.hp = Math.max(0, ch.hp - dmg);
    updateHPBarSprite(ch.hpBar, ch.hp / ch.maxHp);
    if (ch.hp <= 0) killCharacter(ch);
  }
  function poisonDamageMob(list, mob, dmg){
    const i = list.indexOf(mob);
    if (i === -1) return;
    spawnFloatingNumber(mob.dir, mobVisualRadius(mob), dmg, POISON_NUM_COLOR);
    mob.hp -= dmg;
    if (mob.hp <= 0){ if (list === neutralMobs) removeNeutralMob(i); else removeMob(list, i); return; }
    mob.mesh.material.color.copy(mob.baseColor).lerp(MOB_DAMAGED_COLOR, 1 - mob.hp / mob.maxHp);
    if (mob.hpBar) updateHPBarSprite(mob.hpBar, mob.hp / mob.maxHp);
  }
  // Mob poison: standing on a pool (re)starts the status; the stronger one
  // wins while both are active (they don't stack). Ticks once a second.
  function updateMobPoison(list, now){
    for (const mob of list.slice()){
      if (list.indexOf(mob) === -1) continue;
      const cell = territoryGrid[dirToGridIdx(mob.dir)];
      if (cell === POISON_POOL) mob.poisonUntil = Math.max(mob.poisonUntil || 0, now + POISON_DURATION_MS);
      else if (cell === TOXIC_POOL) mob.toxicUntil = Math.max(mob.toxicUntil || 0, now + TOXIC_DURATION_MS);
      const dps = now < (mob.toxicUntil || 0) ? TOXIC_DPS : now < (mob.poisonUntil || 0) ? POISON_DPS : 0;
      if (dps <= 0){ mob.nextPoisonTickAt = 0; continue; }
      if (!mob.nextPoisonTickAt){ mob.nextPoisonTickAt = now + 1000; continue; }
      if (now >= mob.nextPoisonTickAt){
        mob.nextPoisonTickAt += 1000;
        poisonDamageMob(list, mob, dps);
      }
    }
  }
  function updatePoisonSystem(dt, now){
    updatePoisonRains(now);
    updateMobPoison(pinkMobs, now);
    updateMobPoison(blueMobs, now);
    updateMobPoison(neutralMobs, now);
    for (const ch of characters){
      if (!ch.alive){ if (ch.liquidMesh) detachLiquidMesh(ch); ch.poisonLiquid = false; continue; }
      const cell = territoryGrid[dirToGridIdx(ch.dir)];
      if (!ch.poisonLiquid && (cell === POISON_POOL || cell === TOXIC_POOL)){
        ch.poisonLiquid = true;
        ch.nextLiquidTickAt = now + 1000;
        attachLiquidMesh(ch);
      } else if (ch.poisonLiquid && isTeamTerritory[ch.team](cell)){
        deliverPoisonLiquid(ch, now); // normal or dark own ground both count
      }
      if (ch.poisonLiquid && now >= ch.nextLiquidTickAt){
        ch.nextLiquidTickAt += 1000;
        poisonDamageCharacter(ch, POISON_LIQUID_DPS);
      }
      placeLiquidMesh(ch);
    }
    for (let t = 0; t < 2; t++){
      if (poisonLiquidDeliveryCount[t] > 0 && now >= nextAlliedPurpleSpawnAt[t]){
        if (Math.random() < alliedMobChance(POISON_LIQUID_PURPLE_BASE_CHANCE, poisonLiquidDeliveryCount[t])) spawnAlliedPurpleMob(t);
        nextAlliedPurpleSpawnAt[t] = now + MOB_SPAWN_MIN_MS + Math.random() * (MOB_SPAWN_MAX_MS - MOB_SPAWN_MIN_MS);
      }
    }
  }

  // ---- allied purple mob ----
  // A dome (flat side down), purple, with the left half fading into the
  // team's colour. Same size as the big pink mob.
  function makePurpleMobMesh(team){
    const r = MOB_LOCAL_R * BIG_MOB_SIZE_MULT;
    const geo = new THREE.SphereGeometry(r, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2);
    const pos = geo.attributes.position;
    const colors = new Float32Array(pos.count * 3);
    const teamCol = ALLIED_BOTTOM_COLORS[team === 1 ? 1 : 0];
    const c = new THREE.Color();
    for (let i = 0; i < pos.count; i++){
      const k = Math.max(0, Math.min(1, (pos.getX(i) + r) / r)); // 0 at the left edge -> 1 at the middle
      c.copy(teamCol).lerp(PURPLE_MOB_COLOR, k);
      colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xffffff, vertexColors: true, roughness: 0.45, metalness: 0.1, side: THREE.DoubleSide }));
  }
  function spawnAlliedPurpleMob(t){
    const list = teamMobs(t);
    if (list.length >= MAX_MOBS_PER_TEAM) return;
    const idx = randomCellOfColor(isTeamTerritory[t]); // normal or dark own ground
    if (idx === null) return;
    const dir = cellIdxToDir(idx);
    const mesh = makePurpleMobMesh(t);
    mesh.position.copy(dir).multiplyScalar(R * 1.02);
    mesh.quaternion.setFromUnitVectors(MOB_UP, dir);
    sphereGroup.add(mesh);
    const auraRing = makeAuraRing(t === 0 ? 0xff5a9e : 0x5ad0ff);
    updateAuraRingTransform(auraRing, dir, PURPLE_MOB_RANGE);
    sphereGroup.add(auraRing);
    list.push({
      team: t === 0 ? 'pink' : 'blue', isBig: false, isGold: false, isPurple: true,
      mesh, auraRing, hpBar: null, baseColor: mesh.material.color.clone(), dir: dir.clone(),
      hp: PURPLE_MOB_HP, maxHp: PURPLE_MOB_HP,
      netId: takeMobNetId(),
      targetKind: null, target: null, nextRetargetAt: 0, lastAttackAt: -1e9, spinT: 0, erodeProgress: 0
    });
  }
  // The purple mob's death burst: 3-5 orbs scattered at random spots inside
  // its attack range. Fires once, whether it reached enemy ground or its HP
  // ran out (see removeMob).
  function purpleBurst(mob){
    if (mob.burst) return;
    mob.burst = true;
    const n = PURPLE_BURST_MIN + Math.floor(Math.random() * (Math.max(PURPLE_BURST_MIN, PURPLE_BURST_MAX) - PURPLE_BURST_MIN + 1));
    for (let k = 0; k < n; k++) throwToxicOrb(mob.dir, randomDirNear(mob.dir, PURPLE_MOB_RANGE));
  }
  function throwToxicOrb(from, to){
    spawnPoisonOrbVisual(from, to, (d) => spawnLandmark('toxic_pool', d, TOXIC_POOL_RADIUS));
  }
  // Heads for the enemy's ground; lobs 3 orbs at the nearest enemy in range
  // every 20s; bursts the moment it stands on enemy ground.
  function updatePurpleMob(mob, list, i, isPink, dt, now){
    const e = isPink ? 1 : 0;
    const enemyGround = isTeamTerritory[e];
    if (enemyGround(territoryGrid[dirToGridIdx(mob.dir)])){
      purpleBurst(mob);
      removeMob(list, i);
      return;
    }
    // Nearest enemy (mob or dot) inside the attack range.
    let target = null, bestD = Infinity;
    for (const m of teamMobs(e)){ const d = angleBetween(mob.dir, m.dir); if (d <= PURPLE_MOB_RANGE && d < bestD){ bestD = d; target = m; } }
    for (const ch of characters){
      if (!ch.alive || ch.team !== e) continue;
      const d = angleBetween(mob.dir, ch.dir);
      if (d <= PURPLE_MOB_RANGE && d < bestD){ bestD = d; target = ch; }
    }
    if (target && now - mob.lastAttackAt >= PURPLE_MOB_COOLDOWN_MS){
      mob.lastAttackAt = now;
      mob.spinT = MOB_SPIN_DURATION;
      // All three go the enemy's way, but each lands somewhere different.
      for (let k = 0; k < 3; k++) throwToxicOrb(mob.dir, randomDirNear(target.dir, PURPLE_ORB_SCATTER));
    }
    if (now >= mob.nextRetargetAt){
      mob.nextRetargetAt = now + MOB_RETARGET_INTERVAL_MS;
      let idx = findNearestCellOfColor(mob.dir, enemyGround, 60);
      if (idx === null) idx = randomCellOfColor(enemyGround);
      mob.targetKind = idx === null ? null : 'territory';
      mob.target = idx;
    }
    const td = mob.targetKind === 'territory' ? cellIdxToDir(mob.target) : (target ? target.dir : null);
    if (td) mob.dir = computeMobStep(mob, td, PURPLE_MOB_SPEED * frameSpeedScale);
    mob.dir = pushFreeEntityOutOfObstacles(mob.dir, 0);
    mob.mesh.position.copy(mob.dir).multiplyScalar(R * 1.02);
    mob.mesh.quaternion.setFromUnitVectors(MOB_UP, mob.dir);
    if (mob.spinT > 0) applyMobSpin(mob.mesh, mob.spinT);
    updateAuraRingTransform(mob.auraRing, mob.dir, PURPLE_MOB_RANGE);
  }

  // ---------- fragments: role C picks one up by walking over a meteor
  // crater or spirit crystal zone, carries it (at an altered move speed)
  // until it steps onto its own pink-team territory, and delivering it has
  // a chance to spawn a pink-allied black/green mob — same look and stats
  // as the neutral guardian version, but fighting for pink like a normal
  // pink mob instead of guarding a landmark. ----------
  let METEOR_FRAGMENT_SPEED_MULT = 2 / 3;
  let CRYSTAL_FRAGMENT_SPEED_MULT = 2;
  let METEOR_FRAGMENT_BLACK_MOB_BASE_CHANCE = 0.005; // +0.5% per delivery
  let CRYSTAL_FRAGMENT_GREEN_MOB_BASE_CHANCE = 0.02;
  // Per team: [pink, cyan].
  const meteorFragmentDeliveryCount = [0, 0];
  const crystalFragmentDeliveryCount = [0, 0];
  const moonFragmentDeliveryCount = [0, 0];
  let MOON_FRAGMENT_GRAY_MOB_BASE_CHANCE = 0.01; // 1% -> 2% -> 3% ... per delivery
  // Once the first delivery of each kind happens, a second, ongoing spawn
  // source unlocks alongside the existing instant roll-at-delivery: an
  // allied mob then also spawns regularly on its own timer, at the same
  // cadence as normal pink mob spawns, from then on — with no further
  // dependency on landmarks or carrying another fragment.
  const nextAlliedBlackSpawnAt = [0, 0];
  const nextAlliedGreenSpawnAt = [0, 0];
  const nextAlliedGraySpawnAt = [0, 0];
  const FRAGMENT_MESH_SIZE = 0.09;
  const FRAGMENT_HEIGHT_OFFSET = CHAR_LOCAL_R + 0.34; // above the head, clear of the HP bar and label

  function attachFragmentMesh(ch, kind){
    const color = kind === 'meteor' ? 0x4a0e0e : kind === 'moon' ? 0xc8ccd6 : 0x2ecc71; // reddish-black / moon-gray / green
    const geo = new THREE.BoxGeometry(FRAGMENT_MESH_SIZE, FRAGMENT_MESH_SIZE, FRAGMENT_MESH_SIZE);
    const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.25 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(ch.dir).multiplyScalar(R * 1.02 + FRAGMENT_HEIGHT_OFFSET);
    sphereGroup.add(mesh);
    ch.fragmentMesh = mesh;
  }
  function detachFragmentMesh(ch){
    if (!ch.fragmentMesh) return;
    sphereGroup.remove(ch.fragmentMesh);
    ch.fragmentMesh.geometry.dispose();
    ch.fragmentMesh.material.dispose();
    ch.fragmentMesh = null;
  }

  // A pink-allied black or green mob: same mesh/stats as the neutral
  // landmark-guardian version, but joins pinkMobs and fights exactly like
  // any other pink mob (see updateMobList) rather than guarding a home spot.
  function spawnAlliedMob(kind, t){
    t = t || 0;
    const list = teamMobs(t);
    if (list.length >= MAX_MOBS_PER_TEAM) return;
    if (kind === 'gray'){ spawnAlliedGrayMob(t); return; }
    const isBlack = kind === 'black';
    const idx = randomCellOfColor(isBlack ? ((c, i) => (c === DARK_OF[t] && !farmCells.has(i)) || c === RED_OF[t]) : (c => c === LIGHT_OF[t])); // 畑陣地 isn't dark ground
    if (idx === null) return;
    const dir = cellIdxToDir(idx);
    const mesh = makeAlliedMobMesh(isBlack, t);
    mesh.position.copy(dir).multiplyScalar(R * 1.02);
    mesh.quaternion.setFromUnitVectors(MOB_UP, dir);
    sphereGroup.add(mesh);
    // Ringed in the team's colour, so allies read apart from the neutral guardians.
    const auraRing = makeAuraRing(t === 0 ? 0xff5a9e : 0x5ad0ff);
    const hp = isBlack ? BLACK_MOB_HP : GREEN_MOB_HP;
    updateAuraRingTransform(auraRing, dir, isBlack ? BLACK_MOB_RANGE : GREEN_MOB_RANGE);
    sphereGroup.add(auraRing);
    const mob = {
      team: t === 0 ? 'pink' : 'blue', isBig: false, isGold: false,
      isAlliedBlack: isBlack, isAlliedGreen: !isBlack,
      mesh, auraRing, baseColor: mesh.material.color.clone(), dir: dir.clone(),
      hp, maxHp: hp,
      netId: takeMobNetId(),
      targetKind: null, target: null,
      nextRetargetAt: 0,
      lastAttackAt: -999,
      spinT: 0,
      erodeProgress: 0
    };
    list.push(mob);
  }
  // Allied black/green mobs keep their own colour on top and fade into
  // their team's colour toward the bottom (the side facing the ground), so
  // it's clear at a glance whose side they're on.
  const ALLIED_BOTTOM_COLORS = [new THREE.Color(0xff5a9e), new THREE.Color(0x5ad0ff)];
  function applyVerticalGradient(geo, topColor, bottomColor){
    const pos = geo.attributes.position;
    let minY = Infinity, maxY = -Infinity;
    for (let i = 0; i < pos.count; i++){ const y = pos.getY(i); if (y < minY) minY = y; if (y > maxY) maxY = y; }
    const span = Math.max(1e-6, maxY - minY);
    const colors = new Float32Array(pos.count * 3);
    const c = new THREE.Color();
    for (let i = 0; i < pos.count; i++){
      const t = (pos.getY(i) - minY) / span; // 0 = bottom, 1 = top
      c.copy(bottomColor).lerp(topColor, t);
      colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  }
  // Allied gray mob: the gray mob's crowd-hunting charge AI (updateGrayMob),
  // fighting for its own team. Spawns from any of that team's ground.
  function makeAlliedGrayMesh(team){
    const geo = new THREE.DodecahedronGeometry(MOB_LOCAL_R * GRAY_MOB_SIZE_MULT, 0);
    applyVerticalGradient(geo, GRAY_MOB_COLOR, ALLIED_BOTTOM_COLORS[team === 1 ? 1 : 0]);
    return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xffffff, vertexColors: true, roughness: 0.62, metalness: 0.28 }));
  }
  function spawnAlliedGrayMob(t){
    const idx = randomCellOfColor(isTeamTerritory[t]);
    if (idx === null) return;
    const dir = cellIdxToDir(idx);
    const mesh = makeAlliedGrayMesh(t);
    mesh.position.copy(dir).multiplyScalar(R * 1.02);
    mesh.quaternion.setFromUnitVectors(MOB_UP, dir);
    sphereGroup.add(mesh);
    const auraRing = makeAuraRing(t === 0 ? 0xff5a9e : 0x5ad0ff);
    updateAuraRingTransform(auraRing, dir, GRAY_MOB_RANGE);
    sphereGroup.add(auraRing);
    const hpBar = null; // gray mobs have no HP bar
    teamMobs(t).push({
      team: t === 0 ? 'pink' : 'blue', isBig: false, isGold: false, isGray: true, isAlliedGray: true,
      mesh, auraRing, hpBar, baseColor: mesh.material.color.clone(), dir: dir.clone(),
      hp: GRAY_MOB_HP, maxHp: GRAY_MOB_HP,
      netId: takeMobNetId(),
      targetKind: null, target: null, nextRetargetAt: 0, lastAttackAt: -999, spinT: 0, erodeProgress: 0,
      grayState: 'search', grayTarget: null, nextScanAt: 0,
      chargeActive: false, chargeSliding: false, chargeWindupUntil: 0, rollAngle: 0,
      kbRemaining: 0, kbCenter: null, kbTotal: 0, stunUntil: 0
    });
  }
  function makeAlliedMobMesh(isBlack, team){
    const bottom = ALLIED_BOTTOM_COLORS[team === 1 ? 1 : 0];
    if (isBlack){
      const geo = new THREE.ConeGeometry(MOB_LOCAL_R * 3, MOB_LOCAL_R * 2.1 * 3, 3);
      applyVerticalGradient(geo, new THREE.Color(0x0c0c0c), bottom);
      // White base colour: the vertex colours carry the look, and the usual
      // "darken with damage" tint still works by scaling this.
      return new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xffffff, vertexColors: true }));
    }
    const geo = new THREE.OctahedronGeometry(MOB_LOCAL_R * 1.5, 0);
    applyVerticalGradient(geo, new THREE.Color(0x35ff8a), bottom);
    const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, vertexColors: true, emissive: 0xffffff, emissiveIntensity: 0.45, roughness: 0.3, metalness: 0.15 });
    // Make the glow follow the gradient too, instead of washing the whole
    // gem in one flat green.
    mat.onBeforeCompile = (shader) => {
      shader.fragmentShader = shader.fragmentShader.replace(
        'vec3 totalEmissiveRadiance = emissive;',
        'vec3 totalEmissiveRadiance = emissive * vColor;'
      );
    };
    return new THREE.Mesh(geo, mat);
  }

  // Chance is a flat per-delivery step (no doubling): 1.5%, 3%, 4.5%... for
  // black; 2%, 4%, 6%... for green. Shared by both the instant roll at
  // delivery and the recurring timer-based roll below.
  function alliedMobChance(base, deliveryCount){
    return Math.min(1, base * deliveryCount);
  }

  function deliverFragment(ch){
    const kind = ch.carryingFragment;
    const t = ch.team;
    ch.carryingFragment = null;
    detachFragmentMesh(ch);
    const now = performance.now();
    if (kind === 'meteor'){
      const wasFirstDelivery = meteorFragmentDeliveryCount[t] === 0;
      meteorFragmentDeliveryCount[t]++;
      const chance = alliedMobChance(METEOR_FRAGMENT_BLACK_MOB_BASE_CHANCE, meteorFragmentDeliveryCount[t]);
      if (Math.random() < chance) spawnAlliedMob('black', t);
      // From here on, ally black mobs also get a periodic roll of this
      // same chance — see updateAlliedMobSpawns — regardless of whether a
      // landmark or a carried fragment exists.
      if (wasFirstDelivery) nextAlliedBlackSpawnAt[t] = now + MOB_SPAWN_MIN_MS + Math.random() * (MOB_SPAWN_MAX_MS - MOB_SPAWN_MIN_MS);
    } else if (kind === 'crystal'){
      const wasFirstDelivery = crystalFragmentDeliveryCount[t] === 0;
      crystalFragmentDeliveryCount[t]++;
      const chance = alliedMobChance(CRYSTAL_FRAGMENT_GREEN_MOB_BASE_CHANCE, crystalFragmentDeliveryCount[t]);
      if (Math.random() < chance) spawnAlliedMob('green', t);
      if (wasFirstDelivery) nextAlliedGreenSpawnAt[t] = now + MOB_SPAWN_MIN_MS + Math.random() * (MOB_SPAWN_MAX_MS - MOB_SPAWN_MIN_MS);
    } else if (kind === 'moon'){
      const wasFirstDelivery = moonFragmentDeliveryCount[t] === 0;
      moonFragmentDeliveryCount[t]++;
      const chance = alliedMobChance(MOON_FRAGMENT_GRAY_MOB_BASE_CHANCE, moonFragmentDeliveryCount[t]);
      if (Math.random() < chance) spawnAlliedMob('gray', t);
      if (wasFirstDelivery) nextAlliedGraySpawnAt[t] = now + MOB_SPAWN_MIN_MS + Math.random() * (MOB_SPAWN_MAX_MS - MOB_SPAWN_MIN_MS);
    }
  }

  // Runs every frame (called from updateMobs). Once unlocked by a first
  // delivery, keeps rolling for a fresh ally black/green mob on the same
  // spawn cadence as normal mobs, straight from that team's dark/light
  // territory — entirely independent of any landmark still being up. This
  // is a chance each time, at the same escalating rate as the instant
  // roll-at-delivery, not a guaranteed spawn every cycle.
  function updateAlliedMobSpawns(now){
    for (let t = 0; t < 2; t++){
      if (meteorFragmentDeliveryCount[t] > 0 && now >= nextAlliedBlackSpawnAt[t]){
        const chance = alliedMobChance(METEOR_FRAGMENT_BLACK_MOB_BASE_CHANCE, meteorFragmentDeliveryCount[t]);
        if (Math.random() < chance) spawnAlliedMob('black', t);
        nextAlliedBlackSpawnAt[t] = now + MOB_SPAWN_MIN_MS + Math.random() * (MOB_SPAWN_MAX_MS - MOB_SPAWN_MIN_MS);
      }
      if (crystalFragmentDeliveryCount[t] > 0 && now >= nextAlliedGreenSpawnAt[t]){
        const chance = alliedMobChance(CRYSTAL_FRAGMENT_GREEN_MOB_BASE_CHANCE, crystalFragmentDeliveryCount[t]);
        if (Math.random() < chance) spawnAlliedMob('green', t);
        nextAlliedGreenSpawnAt[t] = now + MOB_SPAWN_MIN_MS + Math.random() * (MOB_SPAWN_MAX_MS - MOB_SPAWN_MIN_MS);
      }
      if (moonFragmentDeliveryCount[t] > 0 && now >= nextAlliedGraySpawnAt[t]){
        const chance = alliedMobChance(MOON_FRAGMENT_GRAY_MOB_BASE_CHANCE, moonFragmentDeliveryCount[t]);
        if (Math.random() < chance) spawnAlliedMob('gray', t);
        nextAlliedGraySpawnAt[t] = now + MOB_SPAWN_MIN_MS + Math.random() * (MOB_SPAWN_MAX_MS - MOB_SPAWN_MIN_MS);
      }
    }
  }

  // Checked every frame regardless of whether C is actively moving, so
  // standing still on a crater/crystal/own-colour cell still works.
  function updateCharacterFragments(){
    for (const ch of characters){
      if (ch.role !== 'C' || !ch.alive) continue;
      const idx = dirToGridIdx(ch.dir);
      const cell = territoryGrid[idx];
      if (!ch.carryingFragment){
        if (cell === METEOR_CRATER){ ch.carryingFragment = 'meteor'; attachFragmentMesh(ch, 'meteor'); }
        else if (cell === CRYSTAL_ZONE){ ch.carryingFragment = 'crystal'; attachFragmentMesh(ch, 'crystal'); }
        else if (cell === MOON_CRATER){ ch.carryingFragment = 'moon'; attachFragmentMesh(ch, 'moon'); }
      } else if (ch.carryingFragment === 'meteor' && ((cell === DARK_OF[ch.team] && !farmCells.has(idx)) || cell === RED_OF[ch.team])){
        deliverFragment(ch);
      } else if (ch.carryingFragment === 'crystal' && cell === LIGHT_OF[ch.team]){
        deliverFragment(ch);
      } else if (ch.carryingFragment === 'moon' && isTeamTerritory[ch.team](cell)){
        deliverFragment(ch); // the moon fragment counts on any of your own ground
      }
      if (ch.fragmentMesh) ch.fragmentMesh.position.copy(ch.dir).multiplyScalar(R * 1.02 + FRAGMENT_HEIGHT_OFFSET);
    }
  }

  // ---------- 月のかけら: a dot carrying one charges like the gray mob ----------
  // While the carrier stands still (no route), it keeps charging nearby
  // enemies — the other team's mobs and dots, and neutral mobs — with the
  // gray mob's charge exactly (wind-up, dead-straight roll, clipping mobs in
  // the corridor, blast + stun on a hit, coast to a halt on a miss). There
  // is no search / attack mode: as soon as one charge ends it winds up the
  // next one from wherever it stopped. Drawing a route cancels it.
  function moonChargeVictims(ch){
    const out = [];
    const e = 1 - ch.team;
    for (const m of teamMobs(e).slice()) out.push({ dir: m.dir, ref: m, isChar: false, list: teamMobs(e) });
    for (const m of neutralMobs.slice()) out.push({ dir: m.dir, ref: m, isChar: false, list: neutralMobs });
    for (const c of charTargets()) if (c.alive && c.team === e) out.push({ dir: c.dir, ref: c, isChar: true, list: null });
    return out;
  }
  function moonChargeTargetDir(t){
    if (!t) return null;
    if (t.isChar) return t.ref.alive ? t.ref.dir : null;
    return t.list.indexOf(t.ref) !== -1 ? t.ref.dir : null;
  }
  // Same pick as the gray mob: thickest crowd within reach, distance breaks ties.
  function moonChargePickTarget(ch){
    const inRange = moonChargeVictims(ch).filter(v => angleBetween(ch.dir, v.dir) <= GRAY_MOB_CHARGE_TRIGGER_RANGE);
    if (!inRange.length) return null;
    let best = null, bestCount = -1, bestDist = Infinity;
    for (const cand of inRange){
      let count = 0;
      for (const other of inRange) if (angleBetween(cand.dir, other.dir) <= GRAY_MOB_CLUSTER_RADIUS) count++;
      const dist = angleBetween(ch.dir, cand.dir);
      if (count > bestCount || (count === bestCount && dist < bestDist)){ best = cand; bestCount = count; bestDist = dist; }
    }
    return best;
  }
  function updateMoonCharges(now){
    for (const ch of characters){
      const able = ch.alive && ch.carryingFragment === 'moon' && !ch.moving && !(ch.stunUntil && now < ch.stunUntil);
      if (!able){ ch.moonCharge = null; continue; }
      let mc = ch.moonCharge;
      if (!mc || mc.state === 'idle'){
        const found = moonChargePickTarget(ch);
        if (!found){ ch.moonCharge = { state: 'idle' }; continue; }
        mc = ch.moonCharge = { state: 'windup', target: { ref: found.ref, isChar: found.isChar, list: found.list }, windupUntil: now + GRAY_MOB_CHARGE_WINDUP_MS };
      }
      if (mc.state === 'windup'){
        const tDir = moonChargeTargetDir(mc.target);
        if (!tDir){ ch.moonCharge = { state: 'idle' }; continue; }
        if (now < mc.windupUntil) continue; // standing dead still through the wind-up
        const axis = new THREE.Vector3().crossVectors(ch.dir, tDir);
        if (axis.lengthSq() < 1e-12){ ch.moonCharge = { state: 'idle' }; continue; }
        mc.axis = axis.normalize();
        mc.remaining = angleBetween(ch.dir, tDir) + GRAY_MOB_CHARGE_OVERSHOOT;
        mc.speed = GRAY_MOB_CHARGE_SPEED;
        mc.hits = new Set();
        mc.state = 'charge';
      }
      // charge / slide
      const speedNow = mc.speed * frameSpeedScale;
      const step = mc.state === 'slide' ? speedNow : Math.min(speedNow, mc.remaining);
      if (step > 1e-9){
        let d = ch.dir.clone().applyAxisAngle(mc.axis, step).normalize();
        d = pushFreeEntityOutOfObstacles(d, 0);
        placeCharacterAt(ch, d);
        if (mc.state === 'charge') mc.remaining -= step;
      }
      if (mc.state === 'slide'){
        mc.speed *= Math.pow(GRAY_MOB_SLIDE_FRICTION, frameSpeedScale);
        if (mc.speed <= GRAY_MOB_SPEED) ch.moonCharge = { state: 'idle' }; // stopped: next charge from here
        continue;
      }
      // Clip mobs caught in the corridor.
      for (const v of moonChargeVictims(ch)){
        if (v.isChar || mc.hits.has(v.ref)) continue;
        if (angleBetween(ch.dir, v.dir) > GRAY_MOB_CHARGE_LINE_WIDTH) continue;
        mc.hits.add(v.ref);
        damageMobInList(v.list, v.ref, GRAY_MOB_CHARGE_LINE_DAMAGE);
        if (v.list.indexOf(v.ref) !== -1) applyKnockback(v.ref, ch.dir, GRAY_MOB_CHARGE_LINE_KNOCKBACK);
      }
      const tDir = moonChargeTargetDir(mc.target);
      if (tDir && angleBetween(ch.dir, tDir) <= GRAY_MOB_HIT_RADIUS){
        // The blast: everyone around the target, flung outward and stunned.
        const from = ch.dir.clone(), center = tDir.clone();
        for (const v of moonChargeVictims(ch)){
          if (angleBetween(center, v.dir) > GRAY_MOB_BLAST_RADIUS) continue;
          if (v.isChar){
            damageCharacter(v.ref, GRAY_MOB_BLAST_DAMAGE);
            if (v.ref.alive) v.ref.stunUntil = Math.max(v.ref.stunUntil || 0, now + GRAY_MOB_BLAST_STUN_MS);
            continue;
          }
          damageMobInList(v.list, v.ref, GRAY_MOB_BLAST_DAMAGE);
          if (v.list.indexOf(v.ref) === -1) continue;
          applyKnockback(v.ref, from, GRAY_MOB_BLAST_KNOCKBACK_MIN + Math.random() * (GRAY_MOB_BLAST_KNOCKBACK_MAX - GRAY_MOB_BLAST_KNOCKBACK_MIN));
          stunMob(v.ref, now, GRAY_MOB_BLAST_STUN_MS);
        }
        ch.moonCharge = { state: 'idle' }; // hit: next charge from right here
        continue;
      }
      if (mc.remaining <= 1e-9) mc.state = 'slide'; // dodged: coast to a halt
    }
  }

  // ================= per-character abilities =================
  // A: farmer (plants/harvests watermelons on its own dark-pink "farm"
  // ground, throws them to heal hurt allies), B: tunneler (digs a hole
  // through to the far side of the globe after standing still), C:
  // werewolf (stronger and faster on the night side).
  const ABILITY_UP = new THREE.Vector3(0, 1, 0);

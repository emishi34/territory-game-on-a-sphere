  // This screen's own card use: work out the target from the drawn loop,
  // then hand it to the host (or apply it directly when this is the host).
  // 毒の雨: needs a closed loop, like the giant meteor. The loop's outline
  // travels to the host, which works out the enclosed ground itself.
  function usePoisonRain(){
    const cells = getAbilityEnclosedCells();
    if (cells) netAction({ type: 'rain', path: abilityDrawDense.slice() });
    clearAbilityLine();
  }
  function useGiantMeteor(){
    const cells = getAbilityEnclosedCells();
    if (cells){
      const centroid = new THREE.Vector3();
      for (const idx of cells) centroid.add(cellIdxToDir(idx));
      centroid.normalize();
      netAction({ type: 'giant', dir: centroid });
    }
    clearAbilityLine();
  }

  // Lasers fall ON the drawn line: LIGHT_PILLAR_COUNT of them, evenly
  // spaced, the first exactly at the line's start and the last exactly at
  // its end. Spacing = length / (count - 1), so it scales with the line
  // automatically (6 lasers: length 10 -> 2 apart, length 30 -> 6 apart).
  function useLightPillar(){
    const pts = abilityDrawDense;
    if (pts.length >= 2){
      const cum = buildAngularCum(pts);
      const total = cum[cum.length - 1] || 0;
      if (total > 0){
        const n = Math.max(1, Math.round(LIGHT_PILLAR_COUNT));
        const targets = [];
        for (let i = 0; i < n; i++){
          const dist = n === 1 ? total / 2 : total * i / (n - 1);
          const d = pointAtAngularDistance(pts, cum, dist);
          targets.push(dirToGridIdx(d));
        }
        netAction({ type: 'pillar', cells: targets });
      }
    }
    clearAbilityLine();
  }

  // ---------- arm -> draw -> release-to-fire ----------
  // Swiping a card up doesn't fire it immediately: it "arms" that ability
  // and hands control of the next sphere drag over to targeting. Lifting
  // the finger fires the armed ability with whatever was just drawn (or
  // does nothing, for a card that needed an enclosed loop and didn't get
  // one) and disarms.
  let armedCardId = null;
  const armedCardBadge = document.getElementById('armedCardBadge');
  const CARD_LABELS = {
    giant_meteor: '巨大隕石', light_pillar: '光の柱', poison_rain: '毒の雨'
  };
  function armCard(id){
    armedCardId = id;
    if (armedCardBadge){
      armedCardBadge.textContent = CARD_LABELS[id] + ' 〉なぞって発動(タップ / カードを下にスワイプで解除)';
      armedCardBadge.classList.remove('hidden');
      armedCardBadge.style.pointerEvents = 'auto';
    }
  }
  function disarmCard(){
    armedCardId = null;
    if (armedCardBadge){
      armedCardBadge.classList.add('hidden');
      armedCardBadge.style.pointerEvents = 'none';
    }
  }
  if (armedCardBadge){
    armedCardBadge.addEventListener('click', () => { disarmCard(); clearAbilityLine(); abilityDrawing = false; });
  }
  function executeArmedCard(){
    const id = armedCardId;
    disarmCard();
    if (id === 'giant_meteor') useGiantMeteor();
    else if (id === 'light_pillar') useLightPillar();
    else if (id === 'poison_rain') usePoisonRain();
    else clearAbilityLine();
  }

  // ---------- spawn-rate info panel: read-only, shows the current pink /
  // dark-pink spawn breakdown so it's easy to check what the settings menu
  // numbers actually add up to. ----------
  let lastSpawnInfoRefreshAt = 0;
  function buildSpawnInfoPanel(){
    const root = document.getElementById('spawnInfoScroll');
    root.innerHTML = '';
    const team = myTeam === 1 ? 1 : 0;
    const bigPct = (team === 0 ? BIG_PINK_MOB_CHANCE : BIG_BLUE_MOB_CHANCE) * 100;
    const darkGoldPct = DARK_PINK_GOLD_CHANCE * 100;
    const darkNormalPct = Math.max(0, 100 - bigPct - darkGoldPct);
    const plainGoldPct = PLAIN_PINK_GOLD_CHANCE * 100;
    const plainNormalPct = Math.max(0, 100 - plainGoldPct);
    const fmt = v => (Math.round(v * 10) / 10) + '%';
    function makeGroup(title, rows){
      const g = document.createElement('div');
      g.className = 'spawnInfoGroup';
      const t = document.createElement('div');
      t.className = 'spawnInfoTitle';
      t.textContent = title;
      g.appendChild(t);
      rows.forEach(([label, value]) => {
        const row = document.createElement('div');
        row.className = 'spawnInfoRow';
        const l = document.createElement('span'); l.textContent = label;
        const v = document.createElement('span'); v.textContent = value;
        row.appendChild(l); row.appendChild(v);
        g.appendChild(row);
      });
      root.appendChild(g);
    }
    const counts = fragmentCountsFor(team);
    const meteorCount = counts[0], crystalCount = counts[1], moonCount = counts[2] || 0;
    // "now" = the rate the latest delivery rolled and the automatic spawns
    // use (base x deliveries); "next" = what the next delivery will roll.
    const meteorNowPct = Math.min(100, METEOR_FRAGMENT_BLACK_MOB_BASE_CHANCE * 100 * meteorCount);
    const meteorNextPct = Math.min(100, METEOR_FRAGMENT_BLACK_MOB_BASE_CHANCE * 100 * (meteorCount + 1));
    const crystalNowPct = Math.min(100, CRYSTAL_FRAGMENT_GREEN_MOB_BASE_CHANCE * 100 * crystalCount);
    const crystalNextPct = Math.min(100, CRYSTAL_FRAGMENT_GREEN_MOB_BASE_CHANCE * 100 * (crystalCount + 1));
    // Note: these two are a separate, instantaneous roll made only at the
    // moment role C delivers a fragment — not part of the regular spawn
    // timer above — but shown alongside it here since it's still "what can
    // spawn from this territory color", just via a different trigger.
    const plainRows = [
      ['通常モブ', fmt(plainNormalPct)],
      ['ゴールドモブ', fmt(plainGoldPct)],
    ];
    if (crystalCount > 0){
      plainRows.push(['グリーンモブ(現在の確率・納品' + crystalCount + '個)', fmt(crystalNowPct)]);
      plainRows.push(['グリーンモブ(次の納品時)', fmt(crystalNextPct)]);
    }
    const darkRows = [
      ['通常モブ', fmt(darkNormalPct)],
      [team === 0 ? 'ビッグピンクモブ' : 'ビッグブルーモブ', fmt(bigPct)],
      ['ゴールドモブ', fmt(darkGoldPct)],
    ];
    if (meteorCount > 0){
      darkRows.push(['ブラックモブ(現在の確率・納品' + meteorCount + '個)', fmt(meteorNowPct)]);
      darkRows.push(['ブラックモブ(次の納品時)', fmt(meteorNextPct)]);
    }
    const light = team === 0 ? 'ピンク' : '水色';
    makeGroup('通常の' + light + '陣地から', plainRows);
    makeGroup('濃い' + light + '陣地から', darkRows);
    const moonNowPct = Math.min(100, MOON_FRAGMENT_GRAY_MOB_BASE_CHANCE * 100 * moonCount);
    const moonNextPct = Math.min(100, MOON_FRAGMENT_GRAY_MOB_BASE_CHANCE * 100 * (moonCount + 1));
    makeGroup('月のかけら(どちらの' + light + '陣地にも納品可)', moonCount > 0 ? [
      ['味方グレーモブ(現在の確率・納品' + moonCount + '個)', fmt(moonNowPct)],
      ['味方グレーモブ(次の納品時)', fmt(moonNextPct)]
    ] : [
      ['味方グレーモブ(未納品)', '0%'],
      ['味方グレーモブ(1個目の納品時)', fmt(moonNextPct)]
    ]);
    makeGroup('畑陣地(' + (team === 0 ? 'ピンク' : '水色') + ')', [
      [team === 0 ? 'ピンクモブ' : 'ブルーモブ', fmt(Math.max(0, 100 - FARM_FARMER_CHANCE * 100 - FARM_GOLD_CHANCE * 100))],
      ['ファーマーモブ', fmt(FARM_FARMER_CHANCE * 100)],
      [team === 0 ? 'ゴールドモブ' : 'シルバーモブ', fmt(FARM_GOLD_CHANCE * 100)],
    ]);
    makeGroup((team === 0 ? '赤い色' : '青い色') + 'の陣地', [
      [team === 0 ? 'ピンクモブ' : 'ブルーモブ', fmt(Math.max(0, 100 - RED_BIG_CHANCE * 100 - RED_GOLD_CHANCE * 100))],
      [team === 0 ? 'ビッグピンクモブ' : 'ビッグブルーモブ', fmt(RED_BIG_CHANCE * 100)],
      [team === 0 ? 'ゴールドモブ' : 'シルバーモブ', fmt(RED_GOLD_CHANCE * 100)],
    ]);
    const liquidCount = counts[3] || 0;
    const liquidNowPct = Math.min(100, POISON_LIQUID_PURPLE_BASE_CHANCE * 100 * liquidCount);
    const liquidNextPct = Math.min(100, POISON_LIQUID_PURPLE_BASE_CHANCE * 100 * (liquidCount + 1));
    makeGroup('毒液(どちらの' + light + '陣地にも納品可)', liquidCount > 0 ? [
      ['味方パープルモブ(現在の確率・納品' + liquidCount + '回)', fmt(liquidNowPct)],
      ['味方パープルモブ(次の納品時)', fmt(liquidNextPct)]
    ] : [
      ['味方パープルモブ(未納品)', '0%'],
      ['味方パープルモブ(1回目の納品時)', fmt(liquidNextPct)]
    ]);
  }
  function fragmentCountsFor(team){
    if (isSimHost()) return [meteorFragmentDeliveryCount[team], crystalFragmentDeliveryCount[team], moonFragmentDeliveryCount[team], poisonLiquidDeliveryCount[team]];
    return netFragmentCounts();
  }

  // ---------- panel toggle (settings <-> ability cards <-> spawn-rate info) ----------
  const settingsPanelEl = document.getElementById('settingsPanel');
  const abilityPanelEl = document.getElementById('abilityPanel');
  const spawnInfoPanelEl = document.getElementById('spawnInfoPanel');
  const tabSlidersEl = document.getElementById('tabSliders');
  const tabAbilitiesEl = document.getElementById('tabAbilities');
  const tabSpawnInfoEl = document.getElementById('tabSpawnInfo');
  let activePanel = 'settings'; // 'settings' | 'ability' | 'spawnInfo'
  function setActivePanel(panel){
    const wasAbility = activePanel === 'ability';
    activePanel = panel;
    abilityMode = panel === 'ability'; // kept for anything still reading this flag
    settingsPanelEl.classList.toggle('hidden', panel !== 'settings');
    abilityPanelEl.classList.toggle('hidden', panel !== 'ability');
    spawnInfoPanelEl.classList.toggle('hidden', panel !== 'spawnInfo');
    tabSlidersEl.classList.toggle('active', panel === 'settings');
    tabAbilitiesEl.classList.toggle('active', panel === 'ability');
    tabSpawnInfoEl.classList.toggle('active', panel === 'spawnInfo');
    if (wasAbility && panel !== 'ability') clearAbilityLine();
    if (panel === 'spawnInfo') buildSpawnInfoPanel();
  }
  tabSlidersEl.addEventListener('click', () => setActivePanel('settings'));
  tabAbilitiesEl.addEventListener('click', () => setActivePanel('ability'));
  tabSpawnInfoEl.addEventListener('click', () => setActivePanel('spawnInfo'));

  // ---------- card swipe-up gesture ----------
  function setupCardSwipe(cardEl, cardId, onActivate){
    let startY = null, dragging = false, activePointerId = null;
    const threshold = 55;
    cardEl.style.touchAction = 'none';
    function down(e){
      if (dragging) return;
      startY = e.clientY; dragging = true; activePointerId = e.pointerId;
      cardEl.style.transition = 'none';
      if (cardEl.setPointerCapture){
        try { cardEl.setPointerCapture(e.pointerId); } catch(err){}
      }
    }
    function move(e){
      if (!dragging || e.pointerId !== activePointerId) return;
      const dy = e.clientY - startY;
      if (dy < 0) cardEl.style.transform = `translateY(${dy}px)`;
      else if (armedCardId) cardEl.style.transform = `translateY(${Math.min(dy, 60)}px)`; // pull down to cancel
    }
    function up(e){
      if (!dragging || e.pointerId !== activePointerId) return;
      dragging = false; activePointerId = null;
      const dy = e.clientY - startY;
      cardEl.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
      if (dy > threshold && armedCardId){
        // Swiped down while a card is armed: cancel it (the card isn't used).
        disarmCard();
        clearAbilityLine();
        abilityDrawing = false;
        cardEl.style.transform = '';
        return;
      }
      if (dy < -threshold && strongCardUsed(cardId)){
        // Already used this match — snap back without arming.
        cardEl.style.transform = '';
        return;
      }
      if (dy < -threshold){
        // Arm immediately — the fly-away below is cosmetic only. Gating
        // the actual activation behind that animation's timeout meant a
        // fast real swipe-then-drag could start dragging the sphere
        // before the card had actually armed, so the drag fell through
        // to plain rotation instead of targeting.
        onActivate();
        cardEl.style.transform = 'translateY(-160px)';
        cardEl.style.opacity = '0';
        setTimeout(() => {
          cardEl.style.transition = 'none';
          cardEl.style.transform = '';
          cardEl.style.opacity = '';
          requestAnimationFrame(() => { cardEl.style.transition = 'transform 0.2s ease, opacity 0.2s ease'; });
        }, 180);
      } else {
        cardEl.style.transform = '';
      }
    }
    cardEl.addEventListener('pointerdown', down);
    cardEl.addEventListener('pointermove', move);
    cardEl.addEventListener('pointerup', up);
    cardEl.addEventListener('pointercancel', up);
  }
  setupCardSwipe(document.getElementById('card_giant_meteor'), 'giant_meteor', () => armCard('giant_meteor'));
  setupCardSwipe(document.getElementById('card_light_pillar'), 'light_pillar', () => armCard('light_pillar'));
  setupCardSwipe(document.getElementById('card_poison_rain'), 'poison_rain', () => armCard('poison_rain'));

  function hideHint(){
    if (hintShown){ hintShown = false; hintEl.style.opacity = '0'; }
  }

  function getPos(evt){
    const rect = canvas.getBoundingClientRect();
    if (evt.touches && evt.touches.length){
      return { x: evt.touches[0].clientX - rect.left, y: evt.touches[0].clientY - rect.top };
    }
    return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
  }

  function onDown(evt){
    if (radialMenuOpen){
      evt.preventDefault();
      hideRadialMenu();
      return;
    }
    if (evt.touches && evt.touches.length === 2){
      evt.preventDefault();
      drawingChar = null; isRotating = false; tapCandidate = null;
      clearTimeout(longPressTimer);
      pinchStartDist = getTouchDist(evt.touches);
      pinchStartZoom = zoomFactor;
      return;
    }
    evt.preventDefault();
    sphereGroup.updateMatrixWorld(true);
    const p = getPos(evt);

    const canPlay = myTeam !== -1 && NET.phase === 'playing';
    if (armedCardId && !canPlay) disarmCard();
    if (armedCardId){
      const worldPt = raycastSpherePoint(p.x, p.y);
      if (!worldPt){
        // Missed the sphere entirely — don't leave the card armed forever;
        // that would silently swallow every touch afterward (including
        // taps meant to move a character), since this branch runs before
        // any other input handling.
        disarmCard();
        return;
      }
      const localDir = sphereGroup.worldToLocal(worldPt.clone()).normalize();
      abilityDrawDense = [localDir.clone()];
      abilityDrawScreenPts = [p];
      setAbilityPathTube(abilityDrawDense);
      abilityDrawing = true;
      return;
    }

    for (const ch of characters){
      if (!canPlay || ch.team !== myTeam) continue; // only your own dots answer to you
      if (!ch.alive) continue;
      const charWorld = worldPositionOf(ch.mesh);
      // Whether this character is on the hemisphere currently facing the
      // camera — used to be a plain "world Z > 0" check, which only worked
      // back when the camera sat fixed on the +Z axis. Now that the camera
      // orbits (see camYaw/camPitch), that check silently excluded roughly
      // half the globe's characters at any given moment — whichever half
      // happened to be on the far side of world Z, regardless of where the
      // camera actually was. Comparing against the camera's own current
      // direction from the sphere's center fixes it for any orbit angle.
      if (charWorld.dot(camera.position) <= 0) continue;
      const charScreen = toScreen(charWorld);
      if (dist2D(p, charScreen) <= CHAR_HIT_TOLERANCE_PX){
        hideHint();
        drawingChar = ch;
        // Interrupting a run in progress stops it where it stands; its
        // glow fades immediately, leaving the territory it already
        // claimed as it is.
        netAction({ type: 'stop', role: ch.role });
        drawingScreenPts = [charScreen];
        // Dots move freely: the path is the raw dragged curve itself.
        drawingGridPath = [];
        drawingLocalPts = [ch.dir.clone()];
        setCharPathTube(ch, drawingLocalPts);
        isRotating = false;
        return;
      }
    }

    const hit = raycastSphereHit(p.x, p.y);
    if (hit){
      hideHint();
      isRotating = true;
      lastPointer = p;
      dragVel = { x: 0, y: 0 };
      tapCandidate = {
        downPos: p,
        downTime: performance.now(),
        localDir: sphereGroup.worldToLocal(hit.point.clone()).normalize(),
        uv: hit.uv.clone()
      };
      longPressFired = false;
      clearTimeout(longPressTimer);
      longPressTimer = setTimeout(() => {
        longPressFired = true;
        isRotating = false;
        showRadialMenu(p.x, p.y, tapCandidate.localDir, tapCandidate.uv);
      }, LONG_PRESS_MS);
    }
  }

  function onMove(evt){
    if (evt.touches && evt.touches.length === 2 && pinchStartDist){
      evt.preventDefault();
      const d = getTouchDist(evt.touches);
      setZoomFactor(pinchStartZoom * (pinchStartDist / d));
      return;
    }
    const p = getPos(evt);
    if (tapCandidate && !longPressFired && dist2D(p, tapCandidate.downPos) > LONG_PRESS_MOVE_TOLERANCE_PX){
      clearTimeout(longPressTimer);
    }
    if (drawingChar){
      evt.preventDefault();
      const last = drawingScreenPts[drawingScreenPts.length - 1];
      if (dist2D(p, last) < MIN_POINT_DIST_PX) return;
      const worldPt = raycastSpherePoint(p.x, p.y);
      if (!worldPt) return;
      drawingScreenPts.push(p);
      const localDir = sphereGroup.worldToLocal(worldPt.clone()).normalize();
      drawingLocalPts.push(localDir);
      setCharPathTube(drawingChar, drawingLocalPts);
    } else if (abilityDrawing){
      evt.preventDefault();
      const last = abilityDrawScreenPts[abilityDrawScreenPts.length - 1];
      if (dist2D(p, last) < MIN_POINT_DIST_PX) return;
      const worldPt = raycastSpherePoint(p.x, p.y);
      if (!worldPt) return;
      abilityDrawScreenPts.push(p);
      const localDir = sphereGroup.worldToLocal(worldPt.clone()).normalize();
      abilityDrawDense.push(localDir);
      setAbilityPathTube(abilityDrawDense);
    } else if (isRotating && lastPointer){
      evt.preventDefault();
      const dx = p.x - lastPointer.x, dy = p.y - lastPointer.y;
      // Orbiting the camera the opposite way the sphere used to rotate
      // reproduces the exact same apparent drag feel — dragging right still
      // looks like pulling the globe's far side into view.
      camYaw -= dx * ROT_K;
      camPitch = Math.max(-CAM_PITCH_LIMIT, Math.min(CAM_PITCH_LIMIT, camPitch + dy * ROT_K)); // inverted vertical
      updateCameraOrbit();
      dragVel = { x: dx, y: dy };
      lastPointer = p;
    }
  }

  function onUp(evt){
    if (evt.touches && evt.touches.length < 2) pinchStartDist = null;
    if (drawingChar){
      evt.preventDefault();
      const ch = drawingChar;
      const cum = buildAngularCum(drawingLocalPts);
      const total = cum[cum.length - 1] || 0;
      if (drawingLocalPts.length >= 2 && total >= MIN_PATH_ANGULAR){
        netAction({ type: 'route', role: ch.role, path: drawingLocalPts.slice(), dense: drawingLocalPts });
      } else {
        setCharPathTube(ch, null);
      }
      drawingScreenPts = []; drawingLocalPts = []; drawingGridPath = [];
      drawingChar = null;
    } else if (abilityDrawing){
      evt.preventDefault();
      abilityDrawing = false;
      abilityDrawScreenPts = [];
      executeArmedCard();
    } else if (tapCandidate){
      // A quick tap on empty ground no longer drops a meteor — that's now
      // only available via the long-press radial menu.
      clearTimeout(longPressTimer);
    }
    tapCandidate = null;
    isRotating = false;
    lastPointer = null;
  }

  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onUp, { passive: false });
  canvas.addEventListener('touchcancel', onUp, { passive: false });

  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    setZoomFactor(zoomFactor * (1 + e.deltaY * 0.0025));
  }, { passive: false });

  function applyInertia(){
    if (isRotating || drawingChar) return;
    if (Math.abs(dragVel.x) < 0.01 && Math.abs(dragVel.y) < 0.01) return;
    camYaw -= dragVel.x * ROT_K;
    camPitch = Math.max(-CAM_PITCH_LIMIT, Math.min(CAM_PITCH_LIMIT, camPitch + dragVel.y * ROT_K)); // inverted vertical
    updateCameraOrbit();
    dragVel.x *= FRICTION;
    dragVel.y *= FRICTION;
  }

  // Ends a character's run: it stops moving, its glow fades, and whatever
  // it already painted stays as plain territory. `enclose` decides whether
  // to also check for (and fill) an area the just-finished trail sealed off.
  // Wipes the current run's trail and starts tracking a fresh one from
  // wherever the character is right now, without ending the run itself.
  // Used when a closed loop has been "spent" (see role C's enclosure), so
  // the same loop can't keep re-triggering frame after frame.
  function resetRunTrail(ch){
    if (!ch.runTrailSet) return;
    ch.trailEpoch = ((ch.trailEpoch || 0) + 1) % 64;
    ch.runTrail = [];
    ch.runTrailSet = new Set();
    ch.runTrailFirstSeenArc = new Map();
    rebuildGlowCanvas();
  }

  function stopCharacterRun(ch, checkEnclosure){
    ch.moving = false;
    ch.trailEpoch = ((ch.trailEpoch || 0) + 1) % 64;
    ch.activePathLocal = null; ch.cumAngular = null;
    setCharPathTube(ch, null);
    if (checkEnclosure){
      if (isTerritoryPaintingRole(ch.role)) fillEnclosedByActiveTrails(ch);
      else if (ch.role === 'C') damageEnclosedEnemies(ch);
    }
    ch.runTrail = null; ch.runTrailSet = null; ch.runTrailFirstSeenArc = null;
    ch.gridSnapshotAtRunStart = null;
    rebuildGlowCanvas();
  }

  // Crossing the trail doesn't stop the character — it keeps walking its
  // path — but it does split the trail in two at the crossed cell: the part
  // that leads back to the start (you can't reach the character by
  // following it) loses its glow and settles as ordinary pink, while the
  // part that leads forward to the character (still glowing) survives as
  // the active wall the run can still use to close a loop.
  function cutCharacterTrail(ch, cutIdx){
    if (!ch.runTrail) return;
    const i = ch.runTrail.indexOf(cutIdx);
    if (i === -1) return;
    const after = ch.runTrail.slice(i + 1); // -> still leads to the character
    ch.trailEpoch = ((ch.trailEpoch || 0) + 1) % 64;
    ch.runTrail = after;
    ch.runTrailSet = new Set(after);
    rebuildGlowCanvas();
  }

  // A carried fragment changes role C's move speed; everyone else always
  // moves at the plain base speed.
  function characterMoveSpeed(ch){
    if (ch.role === 'C'){
      let speed = ANGULAR_SPEED;
      if (ch.carryingFragment === 'meteor') speed *= METEOR_FRAGMENT_SPEED_MULT;
      else if (ch.carryingFragment === 'crystal') speed *= CRYSTAL_FRAGMENT_SPEED_MULT;
      if (isWerewolfActive(ch)) speed *= WEREWOLF_SPEED_MULT;
      return speed;
    }
    return ANGULAR_SPEED;
  }
  function updateCharacterMovement(){
    const nowMs = performance.now();
    for (const ch of characters){
      if (!ch.alive || !ch.moving || !ch.activePathLocal) continue;
      // Stunned by a gray mob's charge: the run is held, not cancelled — it
      // picks up from exactly where it left off once the lock wears off.
      if (nowMs < (ch.stunUntil || 0)) continue;
      ch.traveledAngular += characterMoveSpeed(ch) * frameSpeedScale;
      const dir = pointAtAngularDistance(ch.activePathLocal, ch.cumAngular, ch.traveledAngular);
      // A precise, continuous distance check against each obstacle's own
      // collision radius — not the coarse territory-grid cell a naive
      // isCellBlocked would use, which has enough resolution slack near an
      // edge that a fast-enough step could land inside without ever
      // registering a "new blocked cell" in between.
      // No extra padding for the character's own size here — the
      // pass/no-pass boundary is meant to line up exactly with the "this
      // ground can't become anyone's territory" zone around the obstacle,
      // not a slightly wider circle around that.
      const wasClear = !isDirCollidingWithObstacle(ch.dir, 0);
      if (wasClear && isDirCollidingWithObstacle(dir, 0)){
        // Stopping exactly on the collision boundary leaves it sitting
        // right on the edge — close enough that the very next attempt to
        // move at all could immediately re-trigger this same block and
        // never let it budge. Back off a small fixed distance along the
        // path it just came from, so it rests clearly clear of the
        // obstacle instead of glued to its edge.
        const restTraveled = Math.max(0, ch.traveledAngular - LANDMARK_STOP_BACKOFF);
        const restDir = pointAtAngularDistance(ch.activePathLocal, ch.cumAngular, restTraveled);
        ch.dir.copy(restDir);
        ch.mesh.position.copy(restDir).multiplyScalar(R * 1.02);
        ch.hpBar.position.copy(restDir).multiplyScalar(R * 1.02 + CHAR_LOCAL_R + 0.1);
        ch.label.position.copy(restDir).multiplyScalar(R * 1.02 + CHAR_LOCAL_R + 0.24);
        // The path was allowed to be *drawn* through a landmark/ice wall,
        // but actually walking into one just isn't possible — stop right
        // here instead, as if the path had ended at this point.
        stopCharacterRun(ch, true);
        continue;
      }
      ch.dir.copy(dir);
      ch.mesh.position.copy(dir).multiplyScalar(R * 1.02);
      ch.hpBar.position.copy(dir).multiplyScalar(R * 1.02 + CHAR_LOCAL_R + 0.1);
      ch.label.position.copy(dir).multiplyScalar(R * 1.02 + CHAR_LOCAL_R + 0.24);

      if (isTerritoryPaintingRole(ch.role)){
        let sawGenuineCrossing = false;
        paintDirAsColor(dir, LIGHT_OF[ch.team], CHAR_BRUSH_ANGULAR, (idx) => {
          // Running over a still-glowing enemy trail claims that ground and
          // cuts their trail there (see cutCharacterTrail) — the enemy dot
          // itself keeps going. (This is what the old AI blue dot did.)
          for (const foe of characters){
            if (foe.team !== ch.team && foe.moving && foe.runTrailSet && foe.runTrailSet.has(idx)){
              cutCharacterTrail(foe, idx);
            }
          }
          // Every cell the trail passes over becomes (or stays) part of this
          // run's wall — including ground that was already this character's
          // own pink territory — so a loop can close even when it dips back
          // over land it already owns.
          const isNewForCh = !ch.runTrailSet.has(idx);
          if (isNewForCh){
            ch.runTrailSet.add(idx);
            ch.runTrail.push(idx);
            ch.runTrailFirstSeenArc.set(idx, ch.traveledAngular);
            drawGlowBlot(idx, glowRgbForRole(ch.role));
            glowDirty = true;
          } else {
            // The brush is wider than one step, so it re-touches cells it
            // painted just a moment ago on every ordinary frame of movement —
            // that's not a crossing. Only count it once the trail has
            // actually traveled away and looped back around to here.
            const firstArc = ch.runTrailFirstSeenArc.get(idx);
            if (firstArc !== undefined && ch.traveledAngular - firstArc > CROSS_CHECK_MIN_ARC){
              sawGenuineCrossing = true;
            }
          }
          // Meeting a DIFFERENT territory-painting character's active trail
          // is always a real crossing — two separate trails can finish off
          // one enclosure together, no "just brush overlap" ambiguity there.
          for (const other of characters){
            if (other !== ch && other.team === ch.team && isTerritoryPaintingRole(other.role) && other.moving && other.runTrailSet && other.runTrailSet.has(idx)){
              sawGenuineCrossing = true;
            }
          }
        });
        // At most one (cheap-ish, but not free) full-board enclosure scan
        // per character per frame, however many cells the brush touched.
        // Closing a loop consumes it: the trail restarts from here, so the
        // brush re-touching those same cells on later frames can't be read
        // as closing the loop all over again. A genuine SECOND loop over the
        // same ground still reinforces it — fillEnclosedByActiveTrails
        // advances each enclosed cell's baseline by one level as it fills.
        if (sawGenuineCrossing && fillEnclosedByActiveTrails(ch)) resetRunTrail(ch);
      } else if (ch.role === 'C'){
        // C never paints territory, but its own trail still tracks itself
        // the same way, purely to detect when it loops around some blue
        // mobs — closing the loop destroys them, however many there are.
        let sawGenuineCrossing = false;
        forEachCellInBrush(dir, CHAR_BRUSH_ANGULAR, (idx) => {
          const isNewForCh = !ch.runTrailSet.has(idx);
          if (isNewForCh){
            ch.runTrailSet.add(idx);
            ch.runTrail.push(idx);
            ch.runTrailFirstSeenArc.set(idx, ch.traveledAngular);
            drawGlowBlot(idx, glowRgbForRole(ch.role));
            glowDirty = true;
          } else {
            const firstArc = ch.runTrailFirstSeenArc.get(idx);
            if (firstArc !== undefined && ch.traveledAngular - firstArc > CROSS_CHECK_MIN_ARC){
              sawGenuineCrossing = true;
            }
          }
        });
        // Closing a loop consumes it: the trail restarts from here. Without
        // this, the brush keeps re-touching those same old cells on every
        // later frame, so the one closed loop counted as a fresh crossing
        // over and over and dealt its damage many times a second — which is
        // what let a single pass delete even a boss outright.
        if (sawGenuineCrossing && damageEnclosedEnemies(ch)) resetRunTrail(ch);
      }
      // (role A and B both handled above via isTerritoryPaintingRole)

      if (ch.traveledAngular >= ch.totalAngular){
        stopCharacterRun(ch, true);
      } else {
        setCharPathTube(ch, getRemainingPathPoints(ch));
      }
    }
  }

  function updateBlueDot(now){
    if (blueDot.active){
      blueDot.segT += BLUE_DOT_SEG_SPEED * frameSpeedScale;
      while (blueDot.segT >= 1){
        blueDot.segT -= 1;
        blueDot.segFromDir = blueDot.segToDir;
        pickNextBlueDotTarget();
      }
      blueDot.dir = slerpVec(blueDot.segFromDir, blueDot.segToDir, blueDot.segT);
      blueDot.mesh.position.copy(blueDot.dir).multiplyScalar(R * 1.02);
      blueDot.hpBar.position.copy(blueDot.dir).multiplyScalar(R * 1.02 + DOT_LOCAL_R + 0.1);
      paintDirAsColor(blueDot.dir, CYAN, undefined, (idx) => {
        // Crossing a still-glowing trail claims that ground as enemy
        // territory and cuts the trail there (see cutCharacterTrail) — the
        // character itself keeps going.
        for (const ch of characters){
          if (ch.moving && ch.runTrailSet && ch.runTrailSet.has(idx)){
            cutCharacterTrail(ch, idx);
          }
        }
      });
    } else if (now >= blueDot.respawnAt){
      spawnBlueDot();
    }
  }

  // =====================================================================
  //  オンライン対戦 (online 2-player)
  // ---------------------------------------------------------------------
  //  Player 1's page is the host: it runs the whole simulation and, about
  //  11 times a second, publishes a compact snapshot of the board in its
  //  room presence. Player 2 (and anyone watching) draws that snapshot and
  //  sends its own commands back through its presence. Everything travels
  //  as short base-64 strings (originally sized for a 4 KB presence budget).
  // =====================================================================
  const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
  const B64I = {};
  for (let i = 0; i < 64; i++) B64I[B64[i]] = i;
  function enc1(n){ return B64[Math.max(0, Math.min(63, n | 0))]; }
  function enc2(n){ n = Math.max(0, Math.min(4095, n | 0)); return B64[n >> 6] + B64[n & 63]; }
  function enc3(n){ n = Math.max(0, Math.min(262143, n | 0)); return B64[n >> 12] + B64[(n >> 6) & 63] + B64[n & 63]; }
  function dec1(s, i){ return B64I[s[i]] || 0; }
  function dec2(s, i){ return (B64I[s[i]] || 0) * 64 + (B64I[s[i + 1]] || 0); }
  function dec3(s, i){ return (B64I[s[i]] || 0) * 4096 + (B64I[s[i + 1]] || 0) * 64 + (B64I[s[i + 2]] || 0); }
  function encDir(d){
    const phi = Math.acos(THREE.MathUtils.clamp(d.y, -1, 1));
    let theta = Math.atan2(d.z, -d.x);
    if (theta < 0) theta += Math.PI * 2;
    return enc2(Math.round(phi / Math.PI * 4095)) + enc2(Math.round(theta / (Math.PI * 2) * 4096) % 4096);
  }
  function decDir(s, i, out){
    const phi = dec2(s, i) / 4095 * Math.PI;
    const theta = dec2(s, i + 2) / 4096 * Math.PI * 2;
    const sp = Math.sin(phi);
    return (out || new THREE.Vector3()).set(-Math.cos(theta) * sp, Math.cos(phi), Math.sin(theta) * sp);
  }

  // ---------- one-shot visual events (damage numbers, meteors, ...) ----------
  const netEvents = [];
  let netEvSeq = 0;
  function netPushEvent(str){
    if (!NET.broadcasting) return;
    netEvents.push({ q: ++netEvSeq, s: str, at: performance.now() });
    if (netEvents.length > 200) netEvents.shift();
  }

  // ---------- area score (true surface area, not raw cell counts) ----------
  const CELL_WEIGHT = new Float32Array(GRID_W * GRID_H);
  let CELL_WEIGHT_TOTAL = 0;
  for (let gy = 0; gy < GRID_H; gy++){
    const w = Math.sin(((gy + 0.5) / GRID_H) * Math.PI);
    for (let gx = 0; gx < GRID_W; gx++){ CELL_WEIGHT[gy * GRID_W + gx] = w; CELL_WEIGHT_TOTAL += w; }
  }
  const scoreFrac = [0, 0];
  let lastScoreAt = 0;
  function computeScoresNow(){
    let p = 0, c = 0;
    for (let i = 0; i < territoryGrid.length; i++){
      const v = territoryGrid[i];
      if (v === PINK || v === DARK_PINK || v === RED_PINK) p += CELL_WEIGHT[i];
      else if (v === CYAN || v === DARK_CYAN || v === DEEP_BLUE) c += CELL_WEIGHT[i];
    }
    scoreFrac[0] = p / CELL_WEIGHT_TOTAL;
    scoreFrac[1] = c / CELL_WEIGHT_TOTAL;
  }
  function updateScores(now){
    if (now - lastScoreAt < 400) return;
    lastScoreAt = now;
    computeScoresNow();
  }
  function currentScores(){
    if (isSimHost()) return scoreFrac;
    const sc = NET.netScores;
    return sc ? [sc[0] / 1000, sc[1] / 1000] : [0, 0];
  }

  // ---------- match flow (host) ----------
  NET.winner = null; // 0 pink, 1 cyan, 2 draw
  NET.matchId = null;
  function randomId(){ return Math.random().toString(36).slice(2, 10); }
  function startMatch(){
    NET.phase = 'playing';
    matchStartAt = performance.now();
    NET.winner = null;
    const now = matchStartAt;
    for (let t = 0; t < 2; t++){
      nextMobSpawnAt[t] = now + MOB_SPAWN_MIN_MS + Math.random() * (MOB_SPAWN_MAX_MS - MOB_SPAWN_MIN_MS);
      bossMobSpawned[t] = false;
    }
    nextBlackMobSpawnAt = now + NEUTRAL_SPAWN_MIN_MS + Math.random() * (NEUTRAL_SPAWN_MAX_MS - NEUTRAL_SPAWN_MIN_MS);
    nextGreenMobSpawnAt = now + NEUTRAL_SPAWN_MIN_MS + Math.random() * (NEUTRAL_SPAWN_MAX_MS - NEUTRAL_SPAWN_MIN_MS);
    scheduleMoonMeteors();
    focusCameraOn(charOf(myTeam === 1 ? 1 : 0, 'A'));
    renderLobby();
  }
  function endMatch(){
    matchFrozenElapsed = MATCH_MS;
    NET.phase = 'ended';
    computeScoresNow();
    NET.winner = scoreFrac[0] > scoreFrac[1] ? 0 : (scoreFrac[1] > scoreFrac[0] ? 1 : 2);
    drawingChar = null;
    disarmCard();
    clearAbilityLine();
    renderLobby();
  }
  function requestRematch(){
    // A fresh page is the cleanest new board. Settings and this seat carry
    // over; player 2's page notices the new match and reloads too.
    try { sessionStorage.setItem(RESET_SETTINGS_KEY, JSON.stringify(collectSettingsValues())); } catch (e){}
    try { sessionStorage.setItem('lr3d_seat', '1'); } catch (e){}
    location.reload();
  }

  // ---------- settings travel as one flat array, in menu order ----------
  function settingsArray(){
    const out = [];
    SETTINGS_SECTIONS.forEach(sec => sec.items.forEach(item => out.push(Math.round(item.get() * 10000) / 10000)));
    return out;
  }
  function applySettingsArray(arr){
    let i = 0;
    SETTINGS_SECTIONS.forEach(sec => sec.items.forEach(item => {
      const v = arr[i++];
      if (typeof v === 'number' && isFinite(v)) item.set(v);
    }));
  }

  // ---------- host: building a snapshot ----------
  NET.budget = 3700;
  NET.snapCount = 0;
  NET.rowCursor = 0;
  NET.lastSendAt = 0;
  function encodeTerrRow(gy){
    let out = enc2(gy);
    let prev = -1, run = 0;
    const flush = () => {
      while (run > 0){ const l = Math.min(63, run); out += B64[prev] + B64[l]; run -= l; }
    };
    for (let gx = 0; gx < GRID_W; gx++){
      const idx = gy * GRID_W + gx;
      let v = territoryGrid[idx];
      if (farmCells.has(idx)){
        if (v === DARK_PINK) v = 8; else if (v === DARK_CYAN) v = 9;
      }
      if (v === prev) run++;
      else { flush(); prev = v; run = 1; }
    }
    flush();
    return out;
  }
  function mobTypeCode(m, t){
    if (m.isPurple) return 17 + t; // 17 = pink purple, 18 = blue purple
    if (m.isFarmer) return 19 + t;
    if (m.isScarecrow) return 21 + t;
    const kind = m.isAlliedGray ? 6 : m.isBoss ? 5 : m.isAlliedBlack ? 3 : m.isAlliedGreen ? 4 : m.isGold ? 2 : m.isBig ? 1 : 0;
    return t * 7 + kind;
  }
  function buildSnapshot(now){
    NET.snapCount++;
    const o = {
      mid: NET.matchId, ph: NET.phase, t: Math.round(gameElapsedMs()),
      sc: [Math.round(scoreFrac[0] * 1000), Math.round(scoreFrac[1] * 1000)],
      w: NET.winner === null ? -1 : NET.winner,
      mc: meteorImpactCount,
      cd: [teamCardUsed(1, 'giant_meteor') ? 1 : 0, teamCardUsed(1, 'light_pillar') ? 1 : 0, teamCardUsed(1, 'poison_rain') ? 1 : 0],
      fc: [meteorFragmentDeliveryCount[1], crystalFragmentDeliveryCount[1], moonFragmentDeliveryCount[1], poisonLiquidDeliveryCount[1]],
      bs: [encodeBState(charOf(0, 'B')), encodeBState(charOf(1, 'B'))]
    };
    let c = '';
    const pa = ['', '', ''];
    for (const ch of characters){
      const flags = (ch.alive ? 1 : 0) | (ch.moving ? 2 : 0) | (ch.carryingFragment === 'meteor' ? 4 : 0) | (ch.carryingFragment === 'crystal' ? 8 : 0) | (ch.carryingFragment === 'moon' ? 16 : 0) | (ch.poisonLiquid ? 32 : 0);
      const frac = ch.moving && ch.totalAngular > 0 ? Math.min(1, ch.traveledAngular / ch.totalAngular) : 0;
      c += encDir(ch.dir) + enc2(Math.round(Math.max(0, ch.hp) / ch.maxHp * 4095)) + enc1(flags) + enc1(ch.watermelons || 0)
        + enc1(ch.trailEpoch || 0) + enc1(ch.pathVer || 0) + enc2(Math.round(frac * 4095));
      if (ch.team === 1 && ch.moving && ch.routePts){
        pa['ABC'.indexOf(ch.role)] = ch.routePts.map(encDir).join('');
      }
    }
    o.c = c; o.pa = pa;
    const mb = [];
    let cur = '', n = 0;
    const addMob = (m, type) => {
      cur += enc2(m.netId || 0) + enc1(type) + enc1((m.spinT > 0 ? 1 : 0) | (m.kbRemaining > 0 ? 2 : 0)) + encDir(m.dir) + enc1(Math.round(Math.max(0, m.hp) / m.maxHp * 63));
      if (++n % 110 === 0){ mb.push(cur); cur = ''; }
    };
    for (let t = 0; t < 2; t++) for (const m of teamMobs(t)) addMob(m, mobTypeCode(m, t));
    for (const m of neutralMobs) addMob(m, m.kind === 'black' ? 14 : m.kind === 'green' ? 15 : 16);
    if (cur) mb.push(cur);
    o.mb = mb;
    let lm = '';
    for (const l of landmarks){
      if (l.permanent) continue; // no countdown to show for permanent landmarks
      lm += enc2(l.id || 0) + enc1(l.type === 'toxic_pool' ? 4 : l.type === 'poison_pool' ? 3 : l.type === 'moon_crater' ? 2 : l.type === 'spirit_crystal' ? 1 : 0) + encDir(l.dir) + enc2(Math.ceil(Math.max(0, l.expiresAt - now) / 1000));
    }
    o.lm = lm;
    let ho = '';
    for (const h of tunnelHoles) ho += enc2(h.id || 0) + encDir(h.dir);
    o.ho = ho;

    const budget = NET.budget;
    let size = JSON.stringify(o).length;
    // Recent one-shot events, newest kept if space is short.
    const evs = [];
    for (let i = netEvents.length - 1; i >= 0 && evs.length < 60; i--){
      const e = netEvents[i];
      if (now - e.at > 2000) break;
      if (size + e.s.length + 3 > budget - 700) break;
      evs.unshift(e);
      size += e.s.length + 3;
    }
    o.eq = evs.length ? evs[0].q : netEvSeq + 1;
    o.ev = evs.map(e => e.s);
    size += 20;
    // Watermelon crops, a few times a second.
    if (NET.snapCount % 4 === 0 || NET.cropsDue){
      const cr = [];
      let cc = '', k = 0;
      for (const crop of crops){
        if (k >= 320) break;
        cc += encDir(crop.dir) + enc1(crop.ripe ? 63 : Math.min(62, Math.round(crop.progress * 63))) + enc1((crop.team || 0) | (crop.rainbow ? 2 : 0));
        if (++k % 160 === 0){ cr.push(cc); cc = ''; }
      }
      if (cc) cr.push(cc);
      const len = cr.reduce((a, s) => a + s.length + 3, 8);
      if (size + len < budget - 400){ o.cr = cr; size += len; NET.cropsDue = false; }
      else NET.cropsDue = true;
    }
    // Host-side settings, every few seconds.
    if (NET.snapCount % 40 === 1){
      const st = settingsArray();
      const len = JSON.stringify(st).length + 6;
      if (size + len < budget - 300){ o.st = st; size += len; }
    }
    // Fill what's left with territory rows: changed rows first, then a
    // rolling sweep of the whole board so anything missed heals itself.
    const rows = [];
    const sent = new Uint8Array(GRID_H);
    size += 8;
    const tryRow = (gy) => {
      const r = encodeTerrRow(gy);
      if (size + r.length + 3 > budget) return false;
      rows.push(r); size += r.length + 3; sent[gy] = 1;
      return true;
    };
    for (let gy = 0; gy < GRID_H; gy++){
      if (terrRowDirty[gy] > 0){
        if (!tryRow(gy)) break;
        terrRowDirty[gy]--;
      }
    }
    for (let k = 0; k < GRID_H; k++){
      const gy = NET.rowCursor;
      if (!sent[gy] && !tryRow(gy)) break;
      NET.rowCursor = (NET.rowCursor + 1) % GRID_H;
    }
    o.tr = rows;
    return o;
  }
  function netHostTick(now){
    if (!isSimHost() || !NET.room || NET.offline) return;
    if (now - NET.lastSendAt < 90) return;
    NET.lastSendAt = now;
    const o = buildSnapshot(now);
    NET.room.presence({ s: o }).catch(() => { NET.budget = Math.max(2200, NET.budget - 300); });
  }

  // ---------- commands (drawn routes, cards, ...) ----------
  // Local input always goes through netAction. On the host it's applied
  // straight away; on player 2's page it's queued for the host.
  NET.cmdSeq = 0;
  NET.cmdQueue = [];
  function netAction(a){
    if (myTeam === -1 || NET.phase !== 'playing') return;
    if (isSimHost()){ applyAction(myTeam, a); return; }
    const str = encodeAction(a);
    if (!str || !NET.room) return;
    NET.cmdSeq++;
    NET.cmdQueue.push(NET.cmdSeq + '|' + str);
    while (NET.cmdQueue.length > 8 || NET.cmdQueue.join('').length > 2800) NET.cmdQueue.shift();
    NET.room.presence({ cq: NET.cmdQueue.slice() }).catch(() => {});
    const ch = a.role ? charOf(myTeam, a.role) : null;
    if (ch && a.type === 'route'){
      // Show the drawn route right away until the host confirms it.
      ch.pendingFromVer = ch.netPathVer;
      ch.pendingUntil = performance.now() + 3000;
      setCharPathTube(ch, a.dense);
      startGuestPrediction(ch, a.dense);
    } else if (ch && a.type === 'stop'){
      ch.pendingUntil = 0;
      ch.pred = null;
    }
  }
  // ---------- player 2: moving its own dots without waiting for the host ----------
  // The dot starts running along the drawn route the moment the line is
  // finished. By the time the host's confirmation comes back, the local dot
  // is ahead of the host's by one round trip. That lead is measured once
  // and then KEPT (instead of pulling the dot back onto the host's
  // position, which looked like a rollback): from then on the dot follows
  // the host's progress + that lead, and it never moves backwards along the
  // route — if the host is held up (stun etc.) the local dot just waits.
  const GUEST_PRED_MAX_LEAD_MS = 700;
  function startGuestPrediction(ch, dense){
    if (!ch.alive || !dense || dense.length < 2) { ch.pred = null; return; }
    const route = dense.map(p => p.clone().normalize());
    if (angleBetween(route[0], ch.dir) < 1 * Math.PI / 180) route[0] = ch.dir.clone();
    else route.unshift(ch.dir.clone());
    const pts = densifyRoute(route);
    const cum = buildAngularCum(pts);
    if (pts.length < 2 || !(cum[cum.length - 1] > 0)){ ch.pred = null; return; }
    ch.pred = { dense: pts, cum, dist: 0, fromVer: ch.netPathVer, confirmed: false, until: performance.now() + 3000, hostDist: 0, hostAt: 0, lead: null };
  }
  // Called each frame on player 2's page. Returns false when there is
  // nothing to predict (the dot is then eased toward the host position).
  function guestPredictStep(ch, dt, now){
    const p = ch.pred;
    if (!p) return false;
    if (!ch.alive || (!p.confirmed && now > p.until)){ ch.pred = null; return false; }
    const speed = characterMoveSpeed(ch);
    let next = p.dist + speed * frameSpeedScale;
    let dense = p.dense, cum = p.cum;
    // Always stays on the locally drawn route (switching to the host's
    // re-simplified copy caused a small sideways jump); the host's progress
    // is mapped onto it as a fraction of the whole route.
    if (p.confirmed){
      if (p.lead === null){
        // First confirmation: how far ahead the local dot got = the lag.
        p.lead = Math.max(0, Math.min(p.dist - p.hostDist, speed * FRAME_REF_FPS * GUEST_PRED_MAX_LEAD_MS / 1000));
      }
      const age = Math.min(200, now - p.hostAt);
      const target = p.hostDist + speed * FRAME_REF_FPS * age / 1000 + p.lead;
      // Ahead of where it should be: hold (never step backwards).
      if (next > target) next = Math.max(p.dist, target);
      // Behind: catch up smoothly.
      else next += (target - next) * (1 - Math.exp(-dt * 6));
    }
    p.dist = next;
    const total = cum[cum.length - 1] || 0;
    p.dist = Math.max(0, Math.min(total, p.dist));
    const here = pointAtAngularDistance(dense, cum, p.dist);
    placeCharacterAt(ch, here);
    // Keep the remaining-route line starting at the dot itself.
    if (drawingChar !== ch && now - (p.tubeAt || 0) > 100){
      p.tubeAt = now;
      const k0 = cum.findIndex(v => v > p.dist);
      setCharPathTube(ch, k0 === -1 ? null : [here].concat(dense.slice(k0)));
    }
    return true;
  }
  function applyAction(team, a){
    if (!a || NET.phase !== 'playing') return;
    const ch = a.role ? charOf(team, a.role) : null;
    switch (a.type){
      case 'stop':
        if (ch){
          if (ch.moving) stopCharacterRun(ch, false);
          ch.activePathLocal = null; ch.cumAngular = null; ch.traveledAngular = 0;

  }

  // Per-frame work on a page that isn't running the simulation.
  function guestFrame(dt, now){
    const k = 1 - Math.exp(-dt * 14);
    for (const ch of characters){
      if (!ch.alive || !ch.netTarget) continue;
      if (!guestPredictStep(ch, dt, now)){
        const a = angleBetween(ch.dir, ch.netTarget);
        if (a > 0.3) placeCharacterAt(ch, ch.netTarget);
        else if (a > 1e-6) placeCharacterAt(ch, slerpVec(ch.dir, ch.netTarget, k).normalize());
      }
      if (ch.fragmentMesh) ch.fragmentMesh.position.copy(ch.dir).multiplyScalar(R * 1.02 + FRAGMENT_HEIGHT_OFFSET);
      placeLiquidMesh(ch);
      if (ch.stockLabel) ch.stockLabel.position.copy(ch.dir).multiplyScalar(R * 1.02 + CHAR_LOCAL_R + 0.38);
      if (ch.moving){
        if (!ch.gTrail) ch.gTrail = new Set();
        const rgb = glowRgbForRole(ch.role);
        forEachCellInBrush(ch.dir, CHAR_BRUSH_ANGULAR, (idx) => {
          if (ch.gTrail.has(idx)) return;
          ch.gTrail.add(idx);
          drawGlowBlot(idx, rgb);
          glowDirty = true;
        });
      }
    }
    for (const ch of characters){
      if (ch.stockLabel && !ch.alive) ch.stockLabel.visible = false;
      if (ch.role === 'C') updateWerewolfEars(ch);
      if (ch.role === 'B') guestLayoutB(ch);
    }
    if (NET.glowRebuild){
      NET.glowRebuild = false;
      glowCtx.clearRect(0, 0, TERR_CANVAS_W, TERR_CANVAS_H);
      for (const ch of characters) if (ch.gTrail) ch.gTrail.forEach(idx => drawGlowBlot(idx, glowRgbForRole(ch.role)));
      glowDirty = true;
    }
    const km = 1 - Math.exp(-dt * 12);
    for (const r of mobReplicas.values()){
      const a = angleBetween(r.dir, r.target);
      if (a > 0.35) r.dir.copy(r.target);
      else if (a > 1e-6) r.dir.copy(slerpVec(r.dir, r.target, km).normalize());
      let hop = 0;
      if (r.hopT > 0){
        r.hopT += dt;
        const p = Math.min(1, r.hopT / 0.22);
        hop = 4 * p * (1 - p) * (4.1 * Math.PI / 180) * R * 0.55;
        if (p >= 1) r.hopT = 0;
      }
      r.mesh.position.copy(r.dir).multiplyScalar(R * 1.02 + hop);
      r.mesh.quaternion.setFromUnitVectors(MOB_UP, r.dir);
      if (r.spinT > 0){ r.spinT -= dt; applyMobSpin(r.mesh, Math.max(0, r.spinT), (r.type === 21 || r.type === 22) ? MOB_UP : undefined); }
      updateAuraRingTransform(r.auraRing, r.dir, r.range);
      if (r.hpBar) r.hpBar.position.copy(r.dir).multiplyScalar(R * 1.02 + r.vr + 0.12);
    }
    for (let i = netMelons.length - 1; i >= 0; i--){
      const w = netMelons[i];
      w.t += dt;
      const p = Math.min(1, w.t / 0.45);
      const d = slerpVec(w.from, w.to, p).normalize();
      w.mesh.position.copy(d).multiplyScalar(R * 1.04 + Math.sin(Math.PI * p) * 0.35);
      w.mesh.rotation.x += dt * 10;
      if (p >= 1){ sphereGroup.remove(w.mesh); netMelons.splice(i, 1); }
    }
    if (farmDirty && now - lastFarmRebuildAt > 250){
      rebuildFarmOutline();
      farmDirty = false;
      lastFarmRebuildAt = now;
    }
  }

  function focusCameraOn(ch){
    if (!ch) return;
    sphereGroup.updateMatrixWorld(true);
    const v = new THREE.Vector3();
    ch.mesh.getWorldPosition(v);
    const len = v.length();
    if (len < 1e-6) return;
    camYaw = Math.atan2(v.x, v.z);
    camPitch = Math.max(-CAM_PITCH_LIMIT, Math.min(CAM_PITCH_LIMIT, Math.asin(v.y / len)));
    dragVel = { x: 0, y: 0 };
    updateCameraOrbit();
  }

  // ---------- seats and lobby ----------
  const lobbyEl = document.getElementById('lobby');
  const lobbyStatusEl = document.getElementById('lobbyStatus');
  const seatStateEls = [null, document.getElementById('seat1State'), document.getElementById('seat2State')];
  const seatBtnEls = [null, document.getElementById('seat1Btn'), document.getElementById('seat2Btn')];
  const startBtnEl = document.getElementById('startBtn');
  const rematchBtnEl = document.getElementById('rematchBtn');
  const netWarnEl = document.getElementById('netWarn');
  const bottomPanelsEl = document.getElementById('bottomPanels');
  const joinP2BtnEl = document.createElement('button');
  joinP2BtnEl.className = 'lobbyBtn hidden';
  joinP2BtnEl.id = 'joinP2Btn';
  joinP2BtnEl.textContent = 'プレイヤー2として参加する';
  Object.assign(joinP2BtnEl.style, { position: 'fixed', left: '50%', transform: 'translateX(-50%)', top: 'max(96px, calc(env(safe-area-inset-top) + 96px))', zIndex: 32 });
  document.body.appendChild(joinP2BtnEl);
  joinP2BtnEl.addEventListener('click', () => claimSeat(2));
  seatBtnEls[1].addEventListener('click', () => { if (NET.seat === 1) leaveSeat(); else claimSeat(1); });
  seatBtnEls[2].addEventListener('click', () => { if (NET.seat === 2) leaveSeat(); else claimSeat(2); });
  startBtnEl.addEventListener('click', () => { if (isSimHost() && NET.phase === 'lobby') startMatch(); });
  rematchBtnEl.addEventListener('click', () => { if (isSimHost() && NET.phase === 'ended') requestRematch(); });

  NET.peers = [];
  try { NET.autoSeat = parseInt(sessionStorage.getItem('lr3d_seat') || '0', 10) || 0; } catch (e){ NET.autoSeat = 0; }
  function seatOwnerPeer(n){
    let best = null;
    for (const p of NET.peers){
      const pr = p.presence;
      if (!pr || pr.seat !== n || p.kind !== 'viewer') continue;
      const sa = typeof pr.sa === 'number' ? pr.sa : 0;
      const bsa = best ? (typeof best.presence.sa === 'number' ? best.presence.sa : 0) : 0;
      if (!best || sa < bsa || (sa === bsa && p.peer < best.peer)) best = p;
    }
    return best;
  }
  function isMine(p){ return !!p && p.isMe && p.sameTab; }
  function claimSeat(n){
    if (NET.offline || !NET.room) return;
    const o = seatOwnerPeer(n);
    if (o && !isMine(o)) return;
    if (n === 1 && NET.phase !== 'lobby') return;
    if (NET.seat === n) return;
    NET.seat = n;
    myTeam = n - 1;
    try { sessionStorage.setItem('lr3d_seat', String(n)); } catch (e){}
    if (n === 1){
      NET.matchId = randomId();
      NET.phase = 'lobby';
      NET.broadcasting = true;
      clearReplicas();
    } else {
      NET.broadcasting = false;
      NET.needFocus = true;
    }
    NET.room.presence({ seat: n, sa: Date.now(), s: null, cq: null }).catch(() => {});
    applySeatUi();
    renderLobby();
  }
  function leaveSeat(){
    if (NET.offline || !NET.room) return;
    if (NET.seat === 1 && NET.phase !== 'lobby') return;
    NET.seat = 0;
    myTeam = -1;
    NET.broadcasting = false;
    try { sessionStorage.removeItem('lr3d_seat'); } catch (e){}
    NET.room.presence({ seat: null, s: null, cq: null }).catch(() => {});
    applySeatUi();
    renderLobby();
  }
  function applySeatUi(){
    const host = isSimHost();
    tabSlidersEl.classList.toggle('hidden', !host);
    if (!host && activePanel === 'settings') setActivePanel('ability');
    bottomPanelsEl.classList.toggle('hidden', myTeam === -1);
    // Route lines follow whose side you're on.
    for (const ch of characters){
      if (myTeam !== -1 && ch.team !== myTeam && ch.pathTubeMesh) setCharPathTube(ch, null);
    }
  }
  function onPeersChanged(peers){
    NET.peers = peers || [];
    if (NET.seat && !NET.offline){
      const o = seatOwnerPeer(NET.seat);
      if (o && !isMine(o)){
        // Someone else got this seat first.
        NET.seat = 0; myTeam = -1; NET.broadcasting = false;
        try { sessionStorage.removeItem('lr3d_seat'); } catch (e){}
        NET.room.presence({ seat: null, s: null, cq: null }).catch(() => {});
        applySeatUi();
      }
    }
    const o1 = seatOwnerPeer(1), o2 = seatOwnerPeer(2);
    if (isSimHost()){
      NET.p2Presence = o2 ? o2.presence : null;
      NET.p2Peer = o2 ? o2.peer : null;
    } else {
      NET.hostPresent = !!o1;
      if (o1 && o1.presence.s && o1.presence.s !== NET.lastSnapObj){
        NET.lastSnapObj = o1.presence.s;
        applySnapshot(o1.presence.s);
      }
    }
    renderLobby();
  }
  function goOffline(){
    if (NET.offline) return;
    NET.offline = true;
    NET.room = null;
    NET.broadcasting = false;
    if (NET.phase === 'lobby' || NET.seat === 1){ NET.seat = 1; myTeam = 0; NET.phase = NET.phase === 'lobby' ? 'lobby' : NET.phase; }
    applySeatUi();
    renderLobby();
  }
  function renderLobby(){
    lobbyEl.classList.toggle('hidden', NET.phase !== 'lobby');
    const o1 = NET.offline ? null : seatOwnerPeer(1);
    const o2 = NET.offline ? null : seatOwnerPeer(2);
    if (NET.offline){
      lobbyStatusEl.textContent = 'オンラインに接続できないため、ひとりで試すモードです。水色陣営は動きません。';
      seatStateEls[1].textContent = 'あなた'; seatStateEls[1].className = 'seatState me';
      seatStateEls[2].textContent = '接続なし'; seatStateEls[2].className = 'seatState';
      seatBtnEls[1].disabled = true; seatBtnEls[2].disabled = true;
      seatBtnEls[1].textContent = '参加中'; seatBtnEls[2].textContent = '参加する';
      startBtnEl.classList.remove('hidden');
      startBtnEl.disabled = false;
      startBtnEl.textContent = 'ひとりで開始';
    } else {
      const connected = !!NET.room && (typeof NET.room.connected === 'function' ? NET.room.connected() : true);
      if (!NET.room) lobbyStatusEl.textContent = '接続しています…';
      else if (!connected) lobbyStatusEl.textContent = '接続が不安定です。しばらくお待ちください。';
      else if (!NET.seat) lobbyStatusEl.textContent = '空いている席を選んで参加してください。';
      else if (NET.seat === 1) lobbyStatusEl.textContent = o2 ? 'そろいました。試合を開始できます。' : 'プレイヤー2の参加を待っています。';
      else lobbyStatusEl.textContent = o1 ? 'プレイヤー1が試合を開始するのを待っています。' : 'プレイヤー1の参加を待っています。';
      [null, o1, o2].forEach((o, n) => {
        if (!n) return;
        const mine = NET.seat === n;
        seatStateEls[n].textContent = mine ? 'あなた' : (o ? '参加中' : '空き');
        seatStateEls[n].className = 'seatState' + (mine ? ' me' : '');
        seatBtnEls[n].textContent = mine ? '抜ける' : '参加する';
        seatBtnEls[n].disabled = !NET.room || !connected || (!mine && !!o);
      });
      startBtnEl.classList.toggle('hidden', !isSimHost());
      startBtnEl.disabled = !isSimHost();
      startBtnEl.textContent = o2 ? '試合開始' : 'プレイヤー2なしで開始';
    }
    joinP2BtnEl.classList.toggle('hidden', !(NET.phase === 'playing' && !NET.offline && NET.room && NET.seat === 0 && !o2 && NET.hostPresent));
  }
  (async function initNet(){
    let room = null;
    try {
      if (typeof window.createP2PRoom === 'function') room = await window.createP2PRoom();
    } catch (e){ room = null; }
    if (!room){ goOffline(); return; }
    NET.room = room;
    let autoTried = false;
    room.onConnection((c) => {
      renderLobby();
      if (c && !autoTried && NET.autoSeat){
        autoTried = true;
        // Give everyone already here a moment to show up before reclaiming.
        setTimeout(() => { if (!NET.seat && NET.autoSeat) claimSeat(NET.autoSeat); }, 1500);
      }
    }, () => goOffline());
    room.onPeers((change) => onPeersChanged(change.peers), () => goOffline());
    renderLobby();
  })();
  applySeatUi();
  renderLobby();

  // ---------- big top-of-screen messages, timer, score ----------
  const bannerEl = document.getElementById('topBanner');
  const resultSubEl = document.getElementById('resultSub');
  const timerEl = document.getElementById('matchTimer');
  const scorePinkEl = document.getElementById('scorePink');
  const scoreCyanEl = document.getElementById('scoreCyan');
  const scorePinkTxtEl = document.getElementById('scorePinkTxt');
  const scoreCyanTxtEl = document.getElementById('scoreCyanTxt');
  let bannerKey = '';
  function showBanner(text, cls, key){
    if (key === bannerKey) return;
    bannerKey = key;
    bannerEl.className = '';
    void bannerEl.offsetWidth; // restart the CSS animation
    bannerEl.textContent = text;
    bannerEl.className = cls;
  }
  function clearBanner(){
    if (!bannerKey) return;
    bannerKey = '';
    bannerEl.className = '';
    bannerEl.textContent = '';
  }
  let lastTimerText = '', lastScoreKey = '';
  function fmtClock(ms){
    const sec = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  }
  function updateMatchUi(now){
    const ph = NET.phase;
    const el = gameElapsedMs();
    const rem = Math.max(0, MATCH_MS - el);
    const tt = ph === 'lobby' ? fmtClock(MATCH_MS) : fmtClock(rem);
    if (tt !== lastTimerText){ lastTimerText = tt; timerEl.textContent = tt; }
    timerEl.classList.toggle('urgent', ph === 'playing' && rem <= 60000);
    const sc = currentScores();
    const sk = Math.round(sc[0] * 1000) + ':' + Math.round(sc[1] * 1000);
    if (sk !== lastScoreKey){
      lastScoreKey = sk;
      scorePinkEl.style.width = (sc[0] * 100).toFixed(1) + '%';
      scoreCyanEl.style.width = (sc[1] * 100).toFixed(1) + '%';
      scorePinkTxtEl.textContent = 'ピンク ' + (sc[0] * 100).toFixed(1) + '%';
      scoreCyanTxtEl.textContent = '水色 ' + (sc[1] * 100).toFixed(1) + '%';
    }
    if (ph === 'playing'){
      if (el < 2500) showBanner('試合開始！', 'fadeOut', 'start');
      else if (rem <= 10000 && rem > 0){ const n = Math.ceil(rem / 1000); showBanner(String(n), 'pop warn', 'cd' + n); }
      else if (rem <= 60000 && rem > 55000) showBanner('残り1分', 'warn fadeOut', '1min');
      resultSubEl.textContent = '';
    } else if (ph === 'ended'){
      const w = NET.winner;
      if (w === 0) showBanner('ピンク陣営の勝利！', 'show pop pink', 'end0');
      else if (w === 1) showBanner('水色陣営の勝利！', 'show pop cyan', 'end1');
      else showBanner('引き分け', 'show pop', 'end2');
      resultSubEl.textContent = 'ピンク ' + (sc[0] * 100).toFixed(1) + '%　／　水色 ' + (sc[1] * 100).toFixed(1) + '%';
    } else {
      clearBanner();
      resultSubEl.textContent = '';
    }
    rematchBtnEl.classList.toggle('hidden', !(ph === 'ended' && isSimHost()));
    let warn = '';
    if (!NET.offline && NET.room){
      if (isSimHost() && ph === 'playing' && !seatOwnerPeer(2)) warn = 'プレイヤー2が接続していません';
      else if (NET.seat === 2 && ph !== 'lobby' && !NET.hostPresent) warn = 'プレイヤー1との接続が切れています';
      else if (ph === 'ended' && !isSimHost()) warn = '';
    }
    if (ph === 'ended' && !isSimHost() && NET.hostPresent) resultSubEl.textContent += '\nプレイヤー1の再戦を待っています';
    netWarnEl.textContent = warn;
    netWarnEl.classList.toggle('hidden', !warn);
  }

  let lastFrameTime = performance.now();
  const FRAME_REF_FPS = 60;   // the frame rate the per-frame speeds were tuned at
  let frameSpeedScale = 1;    // this frame's length, as a multiple of a 60fps frame

  function animate(now){
    requestAnimationFrame(animate);
    const t = now || performance.now();
    const dt = Math.min((t - lastFrameTime) / 1000, 0.05);
    lastFrameTime = t;
    // Movement speeds are all authored as "per frame at 60fps", but the
    // real frame rate isn't fixed — phones in particular bump the display
    // to a higher refresh rate while a finger is on the screen. Scaling
    // every per-frame step by how long the frame actually took keeps real
    // speeds identical at any refresh rate.
    frameSpeedScale = Math.min(3, Math.max(0.1, dt * FRAME_REF_FPS));

    applyInertia();
    updateCelestialBodies(t);
    sphereGroup.updateMatrixWorld(true);
    if (isSimHost()){
      if (NET.phase === 'playing' && gameElapsedMs() >= MATCH_MS) endMatch();
      if (simRunning()){
        netProcessGuestCommands();
        updateCharacterMovement();
        updateCharacterFragments();
        updateMoonCharges(t);
        updateCharacterAbilities(dt, t);
        updateRespawns(t);
        updateMobs(dt, t);
        updateNeutralMobs(dt, t);
        updatePassiveRegen(dt, t);
        updatePoisonSystem(dt, t);
        updateLandmarks(t);
        updateMoonMeteors();
      }
      updateScores(t);
      netHostTick(t);
    } else {
      guestFrame(dt, t);
    }
    updateFloatingNumbers(dt);
    updateCardCooldownDisplays(t);
    if (activePanel === 'spawnInfo' && t - lastSpawnInfoRefreshAt > 1000){
      buildSpawnInfoPanel();
      lastSpawnInfoRefreshAt = t;
    }
    updateMeteors(dt);
    updatePoisonVisuals(dt);
    updateBVisuals(dt);
    updatePillarEffects(dt);
    updateMatchUi(t);
    if (terrDirty){ terrTexture.needsUpdate = true; terrDirty = false; }
    if (glowDirty){ glowTexture.needsUpdate = true; glowDirty = false; }
    renderer.render(scene, camera);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
